      const fuori = stato.servizi.filter(x => !normalizza(x.nome).includes(filtro));
      if (fuori.length) {
        html += `<div class="gruppo-listino">
          <div class="gruppo-listino__titolo">Già scelti, fuori dalla ricerca</div>
          <div class="chip-servizi">${fuori.map(x => chip(x, coloreDi(x.categoriaId))).join('')}</div>
        </div>`;
      }
      html += '<p class="campo__aiuto">Svuota la ricerca per rivedere tutto il listino.</p>';

    } else {
      // Quello che di solito fa: i suoi soliti, o in mancanza l'ultima volta.
      const proposti = await store.serviziProposti(stato.cliente);
      if (proposti) {
        const elenco = proposti.servizi;
        const tuttiScelti = elenco.every(a => stato.servizi.some(x => x.id === a.id));
        const durataTot = elenco.reduce((t, a) => t + a.durata, 0);
        const prezzoTot = elenco.reduce((t, a) => t + a.prezzo, 0);
        const titolo = proposti.origine === 'abituali'
          ? `★ I soliti di ${esc(stato.cliente.nome)}`
          : `★ Come l'ultima volta${proposti.quando ? ` — ${esc(dataBreve(proposti.quando))}` : ''}`;
        html += `<div class="gruppo-listino">
          <div class="gruppo-listino__titolo">${titolo}</div>
          <div class="chip-servizi">
            <button class="chip chip--grande${tuttiScelti ? ' is-scelto' : ''}" id="carica-soliti" type="button"
                    style="border-color:var(--oro)">
              <span class="chip__riga">${tuttiScelti ? '✓ caricati' : 'Rifai gli stessi'}</span>
              <span class="chip__meta" style="padding-left:0">${esc(elenco.map(a => a.nome).join(' + '))} · ${durataUmana(durataTot)} · ${euro(prezzoTot, valuta)}</span>
            </button>
          </div>
        </div>`;
      }

      if (listino.preferiti.length) {
        html += `<div class="gruppo-listino">
          <div class="gruppo-listino__titolo">★ Più usati</div>
          <div class="chip-servizi">${listino.preferiti.map(s => chip(s, coloreDi(s.categoriaId))).join('')}</div>
        </div>`;
      }
      for (const g of listino.gruppi) {
        const restanti = g.servizi.filter(s => !s.preferito);
        if (!restanti.length) continue;
        html += `<div class="gruppo-listino">
          <div class="gruppo-listino__titolo">
            <span class="punto-colore" style="background:${esc(g.categoria.colore)}"></span>${esc(g.categoria.nome)}
          </div>
          <div class="chip-servizi">${restanti.map(s => chip(s, g.categoria.colore)).join('')}</div>
        </div>`;
      }
      if (!html) {
        html = ui.statoVuoto({
          titolo: 'Il listino è vuoto',
          testo: 'Aggiungi i servizi dalle impostazioni per poterli selezionare qui.'
        });
      }
      if (stato.cliente && stato.cliente.prezzi && Object.keys(stato.cliente.prezzi).length) {
        html += `<p class="campo__aiuto" style="margin-top:4px">✱ prezzo o durata personalizzati per ${esc(stato.cliente.nome)}</p>`;
      }
    }

    zonaServizi.innerHTML = html;
    zonaServizi.scrollTop = scorrimento;

    const soliti = zonaServizi.querySelector('#carica-soliti');
    if (soliti) soliti.addEventListener('click', async () => {
      const proposti = await store.serviziProposti(stato.cliente);
      if (!proposti) return;
      const elenco = proposti.servizi;
      const tuttiScelti = elenco.every(a => stato.servizi.some(x => x.id === a.id));
      if (tuttiScelti) {
        stato.servizi = stato.servizi.filter(x => !elenco.some(a => a.id === x.id));
      } else {
        for (const a of elenco) if (!stato.servizi.some(x => x.id === a.id)) stato.servizi.push(a);
      }
      stato.durataManuale = null; stato.prezzoManuale = null;
      await disegnaServizi(); aggiorna(true);
    });
  }

  const campoCercaServizio = radice.querySelector('#cerca-servizio');
  campoCercaServizio.addEventListener('input', debounce(async () => {
    stato.filtroServizi = campoCercaServizio.value;
    await disegnaServizi();
  }, 110));
  campoCercaServizio.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && campoCercaServizio.value) {
      campoCercaServizio.value = '';
      stato.filtroServizi = '';
      disegnaServizi();
    }
  });

  ui.su(zonaServizi, 'click', '[data-servizio]', async (e, el) => {
    const id = el.dataset.servizio;
    const tutti = await store.elencoServizi();
    const trovato = tutti.find(x => x.id === id);
    if (!trovato) return;
    const i = stato.servizi.findIndex(x => x.id === id);
    if (i >= 0) stato.servizi.splice(i, 1);
    else stato.servizi.push(store.servizioPerCliente(stato.cliente, trovato));
    stato.durataManuale = null; stato.prezzoManuale = null;
    await disegnaServizi(); aggiorna(true);
  });

  /* ---------------- 3. quando ---------------- */

  const zonaGiorni = radice.querySelector('#zona-giorni');
  const zonaOrari = radice.querySelector('#zona-orari');

  function disegnaGiorni() {
    const oggi = new Date();
    const giorni = [];

    /* I prossimi sette giorni in cui il negozio è davvero aperto: la tabella
       degli orari, le chiusure e le aperture extra decidono quali. Proporre
       la domenica non serviva a niente e rubava un posto a un giorno buono.
       Si guarda fino a 90 giorni avanti: se sono tutte ferie, si smette. */
    const soloLavorativi = store.orariConfigurati();
    for (let i = 0; i < 90 && giorni.length < 7; i++) {
      const d = addDays(oggi, i);
      if (soloLavorativi && !store.giornoAperto(d)) continue;
      giorni.push({
        data: d,
        etichetta: i === 0 ? 'Oggi' : i === 1 ? 'Domani' : `${GIORNI_BREVI[d.getDay()]}`,
        sotto: `${d.getDate()} ${MESI_BREVI[d.getMonth()]}`
      });
    }
    // Il giorno già scelto resta sempre in fila, anche se è di chiusura.
    const scelto = dayKey(stato.data);
    if (!giorni.some(g => dayKey(g.data) === scelto) && scelto >= dayKey(oggi)) {
      giorni.push({
        data: new Date(stato.data),
        etichetta: GIORNI_BREVI[stato.data.getDay()],
        sotto: `${stato.data.getDate()} ${MESI_BREVI[stato.data.getMonth()]}`
      });
      giorni.sort((x, y) => dayKey(x.data).localeCompare(dayKey(y.data)));
    }
    const fuoriElenco = !giorni.some(g => dayKey(g.data) === scelto);

    zonaGiorni.innerHTML = giorni.map(g => `
      <button class="giorno-btn${dayKey(g.data) === scelto ? ' is-scelto' : ''}" data-giorno="${dayKey(g.data)}" type="button">
        <strong>${esc(g.etichetta)}</strong><span>${esc(g.sotto)}</span>
      </button>`).join('') + `
      <label class="giorno-btn${fuoriElenco ? ' is-scelto' : ''}" style="display:flex;flex-direction:column;justify-content:center;position:relative">
        <strong>📅</strong><span>${fuoriElenco ? esc(`${stato.data.getDate()} ${MESI_BREVI[stato.data.getMonth()]}`) : 'altra data'}</span>
        <input type="date" id="data-libera" value="${dayKey(stato.data)}"
               style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
      </label>` + (soloLavorativi
        ? '<p class="campo__aiuto" style="width:100%;margin-top:7px">Compaiono solo i giorni di apertura. Per gli altri usa 📅.</p>'
        : '');

    zonaGiorni.querySelectorAll('[data-giorno]').forEach(b => b.addEventListener('click', () => {
      stato.data = fromDayKey(b.dataset.giorno); stato.ora = null;
      disegnaGiorni(); aggiorna(true);
    }));
    zonaGiorni.querySelector('#data-libera').addEventListener('change', (e) => {
      if (!e.target.value) return;
      stato.data = fromDayKey(e.target.value); stato.ora = null;
      disegnaGiorni(); aggiorna(true);
    });
  }

  async function disegnaOrari() {
    const d = durata();
    const slot = await store.orariLiberi(stato.data, d, { escludiId: appuntamento ? appuntamento.id : null, servizi: serviziOrdinati() });
    const scelotFuoriFascia = stato.ora && !slot.some(s => s.ora === stato.ora);

    if (!slot.length) {
      const chiuso = !store.giornoAperto(stato.data);
      const chiusura = store.chiusuraDi(stato.data);
      zonaOrari.innerHTML = chiuso
        ? `<div class="avviso-riquadro avviso-riquadro--attenzione">
             <span>🔒</span><div><strong>${chiusura ? esc(chiusura.motivo || 'Chiusura') : 'Negozio chiuso'}</strong>
             ${chiusura ? 'In questo periodo il negozio è chiuso.' : 'Questo giorno della settimana il negozio è chiuso.'}
             Puoi comunque fissare a mano qui sotto.</div></div>`
        : `<div class="avviso-riquadro avviso-riquadro--attenzione">
             <span>⚠</span><div><strong>Nessun orario libero</strong>
             La giornata è piena per una durata di ${durataUmana(d)}. Puoi scegliere un altro giorno,
             oppure indicare l'orario a mano qui sotto.</div></div>`;
      zonaOrari.innerHTML +=  `
        <div style="margin-top:11px;display:flex;gap:10px;align-items:center">
          ${ui.campoOra('ora-manuale', stato.ora || '', { stile: 'max-width:170px' })}
          <span class="testo-tenue">orario libero</span>
        </div>`;
    } else {
      // Si propone un orario solo se non ne è ancora stato scelto uno.
      // Un orario indicato a mano non viene mai sostituito d'ufficio, nemmeno
      // se è occupato: l'avviso lo segnala, la decisione resta sua.
      if (!stato.ora) {
        const primo = slot.find(s => !s.durantePosa) || slot[0];
        stato.ora = primo ? primo.ora : null;
      }
      zonaOrari.innerHTML = `
        <div class="griglia-orari">
          ${slot.map(s => `
            <button class="ora-btn${s.ora === stato.ora ? ' is-scelto' : ''}${s.durantePosa ? ' is-posa' : ''}"
                    data-ora="${s.ora}" type="button"
                    title="${s.durantePosa ? 'Durante la posa di ' + esc(nomeCliente(s.appuntamentoInPosa)) : 'Libero'}">
              ${s.ora}${s.durantePosa ? '<small>in posa</small>' : ''}
            </button>`).join('')}
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="testo-tenue">${scelotFuoriFascia ? 'Orario scelto a mano:' : 'Oppure a mano:'}</span>
          ${ui.campoOra('ora-manuale', stato.ora || '', {
            stile: 'max-width:150px' + (scelotFuoriFascia ? ';border-color:var(--oro);background:var(--oro-tenue)' : '') })}
        </div>`;
    }

    ui.legaCampiOra(zonaOrari);

    zonaOrari.querySelectorAll('[data-ora]').forEach(b => b.addEventListener('click', async () => {
      stato.ora = b.dataset.ora;
      await disegnaOrari();
      await aggiorna();
    }));
    const manuale = zonaOrari.querySelector('#ora-manuale');
    if (manuale) manuale.addEventListener('change', async (e) => {
      const scritta = ui.normalizzaOra(e.target.value);
      if (!scritta) return;
      e.target.value = scritta;
      stato.ora = scritta;
      await disegnaOrari();
      await aggiorna();
    });

    await disegnaSpecchietto();
  }

  /* ---------------- lo specchietto degli orari vicini ----------------
     Tre ore attorno all'orario scelto, disegnate in scala. Ogni appuntamento
     è una barra, le pose sono tratteggiate perché in quei minuti lei è libera,
     e il nuovo appuntamento sta sopra in oro. Serve a decidere con gli occhi
     se il sormonto sta in piedi, invece che a memoria. */

  async function disegnaSpecchietto() {
    const zona = radice.querySelector('#specchietto');
    if (!zona) return;

    if (!stato.ora) {
      zona.innerHTML = '<p class="campo__aiuto">Scegli un orario e qui sotto vedi com\'è occupato intorno.</p>';
      return;
    }

    const d = durata();
    const inizioNuovo = minutiDaHHMM(stato.ora);
    const fineNuovo = inizioNuovo + d;

    // La finestra abbraccia il nuovo appuntamento con un'ora di margine per parte.
    const da = Math.max(0, inizioNuovo - 60);
    const a = Math.min(24 * 60, Math.max(fineNuovo + 60, da + 180));
    const larghezza = a - da;
    const perc = (m) => ((Math.min(Math.max(m, da), a) - da) / larghezza) * 100;

    const giornata = (await store.giornataCompleta(stato.data))
      .filter(x => x.stato !== 'annullato')
      .filter(x => !appuntamento || x.id !== appuntamento.id)
      .filter(x => minutiDaHHMM(x.inizio.slice(11)) < a && minutiDaHHMM(x.inizio.slice(11)) + x.durata > da)
      .sort((x, y) => x.inizio.localeCompare(y.inizio));

    // Corsie: due appuntamenti che si accavallano non devono coprirsi.
    const corsie = [];
    const posizione = new Map();
    for (const x of giornata) {
      const i0 = minutiDaHHMM(x.inizio.slice(11));
      const i1 = i0 + x.durata;
      let c = corsie.findIndex(fine => fine <= i0);
      if (c === -1) { corsie.push(i1); c = corsie.length - 1; } else corsie[c] = i1;
      posizione.set(x.id, c);
    }

    // Il nuovo appuntamento non esiste ancora: per disegnarlo si finge, con i
    // servizi scelti finora, così le sue pose si vedono come quelle degli altri.
    const ipotetico = { servizi: serviziOrdinati(), durata: d };

    const barra = (x, corsia, nuovo) => {
      const oggetto = nuovo ? ipotetico : x;
      const i0 = nuovo ? inizioNuovo : minutiDaHHMM(x.inizio.slice(11));
      const i1 = nuovo ? fineNuovo : i0 + x.durata;
      const durataBarra = Math.max(1, i1 - i0);
      const sx = perc(i0), larg = Math.max(1.2, perc(i1) - perc(i0));
      const dentro = (m) => (m / durataBarra) * 100;   // i tratti partono da 0
      const pose = store.tratti(oggetto)
        .filter(t => t.tipo === 'attesa')
        .map(t => `<span class="specchietto__posa" style="left:${dentro(t.da)}%;width:${dentro(t.a) - dentro(t.da)}%"></span>`)
        .join('');
      const etichetta = nuovo
        ? (stato.cliente ? stato.cliente.nome : (stato.nomeLibero || 'questo'))
        : (x.nomeVisualizzato || '');
      return `<div class="specchietto__barra${nuovo ? ' specchietto__barra--nuovo' : ''}${(!nuovo && store.eImpegno(x)) ? ' specchietto__barra--impegno' : ''}"
                   style="left:${sx}%;width:${larg}%;top:${corsia * 26}px"
                   title="${esc(etichetta)} — ${hhmmDaMinuti(i0)}–${hhmmDaMinuti(i1)}">
        ${pose}<span class="specchietto__nome">${esc(etichetta)}</span>
      </div>`;
    };

    const corsiaNuovo = corsie.length;
    const altezza = (corsiaNuovo + 1) * 26;

    // Tacche: ogni mezz'ora una riga fra le corsie, ogni ora il numero sopra.
    let tacche = '', numeri = '';
    const primaTacca = Math.ceil(da / 30) * 30;
    for (let m = primaTacca; m <= a; m += 30) {
      const intera = m % 60 === 0;
      tacche += `<span class="specchietto__tacca${intera ? ' specchietto__tacca--ora' : ''}" style="left:${perc(m)}%"></span>`;
      if (intera) numeri += `<span class="specchietto__etichetta" style="left:${perc(m)}%">${hhmmDaMinuti(m)}</span>`;
    }

    const conflitti = await store.verificaConflitti(`${dayKey(stato.data)}T${stato.ora}`, d, {
      escludiId: appuntamento ? appuntamento.id : null, servizi: serviziOrdinati()
    });

    // I nomi si prendono dalla giornata già risolta: gli appuntamenti che
    // tornano da verificaConflitti non hanno la cliente attaccata.
    const nomeDi = (id) => {
      const trovato = giornata.find(x => x.id === id);
      return trovato ? trovato.nomeVisualizzato : 'un\'altra cliente';
    };

    let verdetto;
    if (conflitti.attivi.length) {
      verdetto = `<div class="specchietto__verdetto specchietto__verdetto--no">
        ✕ Si accavalla al lavoro di ${esc(conflitti.attivi.map(x => nomeDi(x.id)).join(', '))}</div>`;
    } else if (conflitti.durantePosa.length) {
      verdetto = `<div class="specchietto__verdetto specchietto__verdetto--forse">
        ↔ Cade nella posa di ${esc(conflitti.durantePosa.map(x => nomeDi(x.id)).join(', '))}: in quei minuti sei libera, il sormonto si può fare</div>`;
    } else {
      verdetto = '<div class="specchietto__verdetto specchietto__verdetto--si">✓ Spazio libero</div>';
    }

    zona.innerHTML = `
      <div class="specchietto">
        <div class="specchietto__testa">Com'è occupato qui intorno</div>
        ${verdetto}
        <div class="specchietto__scala">${numeri}</div>
        <div class="specchietto__corsie" style="height:${altezza}px">
          ${tacche}
          ${giornata.map(x => barra(x, posizione.get(x.id), false)).join('')}
          ${barra(null, corsiaNuovo, true)}
        </div>
        <div class="specchietto__legenda">
          <span><i class="specchietto__campione specchietto__campione--altri"></i>già fissato</span>
          <span><i class="specchietto__campione specchietto__campione--posa"></i>posa, sei libera</span>
          <span><i class="specchietto__campione specchietto__campione--nuovo"></i>questo appuntamento</span>
        </div>
      </div>`;
  }

  function nomeCliente(app) {
    return app && app.cliente ? nomeCompleto(app.cliente) : 'un\'altra cliente';
  }

  /* ---------------- avvisi, riepilogo, salvataggio ---------------- */

  const zonaAvvisi = radice.querySelector('#zona-avvisi');

  async function aggiornaAvvisi() {
    zonaAvvisi.innerHTML = '';
    if (!stato.ora) return;

    const inizio = `${dayKey(stato.data)}T${stato.ora}`;

    // Fuori orario si può, ma bisogna saperlo: l'app avvisa e non impedisce.
    const fuori = store.fuoriOrario(inizio, durata());
    if (fuori) {
      zonaAvvisi.innerHTML = `<div class="avviso-riquadro avviso-riquadro--attenzione">
        <span>🕐</span><div><strong>Fuori dall'orario di apertura</strong>
        ${esc(fuori.motivo)}. Puoi salvare lo stesso.</div></div>`;
    }

    const modo = cfg.get('agenda').avvisoSovrapposizione;
    if (modo === 'off') return;
    const c = await store.verificaConflitti(inizio, durata(), { escludiId: appuntamento ? appuntamento.id : null, servizi: serviziOrdinati() });

    if (c.attivi.length) {
      const nomi = [];
      for (const a of c.attivi) {
        const cl = a.clienteId ? await store.leggiCliente(a.clienteId) : null;
        nomi.push(`${store.nomeDiAppuntamento(a, cl)} alle ${a.inizio.slice(11)}`);
      }
      zonaAvvisi.innerHTML += `<div class="avviso-riquadro" style="margin-top:8px">
        <span>⚠</span><div><strong>Si sovrappone a un altro appuntamento</strong>
        ${esc(nomi.join(' · '))}. Puoi salvare comunque se sai di farcela.</div></div>`;
    } else if (c.durantePosa.length) {
      const primo = c.durantePosa[0];
      const cl = primo.clienteId ? await store.leggiCliente(primo.clienteId) : null;
      zonaAvvisi.innerHTML += `<div class="avviso-riquadro avviso-riquadro--info" style="margin-top:8px">
        <span>✓</span><div><strong>Cade durante la posa${cl ? ' di ' + esc(nomeCompleto(cl)) : ''}</strong>
        Perfetto: in quel tempo sei libera.</div></div>`;
    }
  }

  function aggiornaExtra() {
    radice.querySelector('#ex-durata').value = durata();
    radice.querySelector('#ex-prezzo').value = prezzo();
    radice.querySelector('#ex-posa').value = posa();
    radice.querySelector('#ex-note').value = stato.note || '';
  }

  radice.querySelector('#ex-durata').addEventListener('change', (e) => {
    const v = Number(e.target.value);
    stato.durataManuale = v > 0 ? v : null;
    aggiorna(true);
  });
  radice.querySelector('#ex-prezzo').addEventListener('change', (e) => {
    stato.prezzoManuale = e.target.value === '' ? null : Number(e.target.value);
    aggiorna();
  });
  radice.querySelector('#ex-note').addEventListener('input', (e) => { stato.note = e.target.value; });

  async function aggiorna(ridisegnaOrari = false) {
    radice.querySelector('#etichetta-servizi').textContent = stato.servizi.length
      ? `${durataUmana(durata())} · ${euro(prezzo(), valuta)}`
      : '';
    if (ridisegnaOrari) await disegnaOrari();
    await aggiornaAvvisi();
    aggiornaExtra();

    const chi = stato.cliente ? nomeCompleto(stato.cliente) : stato.nomeLibero;
    const pronto = !!(chi && stato.ora);
    btnSalva.disabled = !pronto;
    riepilogo.innerHTML = pronto
      ? `<strong style="color:var(--bruno);font-size:15px">${esc(chi)}</strong> ·
         ${esc(dataEstesa(stato.data).toLowerCase())} alle ${esc(stato.ora)} ·
         ${durataUmana(durata())} · ${euro(prezzo(), valuta)}`
      : (!chi ? 'Scegli la cliente per continuare' : 'Scegli un orario');
  }

  btnSalva.addEventListener('click', async () => {
    if ((!stato.cliente && !stato.nomeLibero) || !stato.ora) return;
    btnSalva.disabled = true;
    const salvato = await store.salvaAppuntamento({
      id: appuntamento ? appuntamento.id : undefined,
      clienteId: stato.cliente ? stato.cliente.id : null,
      clienteNome: stato.cliente ? null : stato.nomeLibero,
      serieId: appuntamento ? appuntamento.serieId : null,
      dataSerie: appuntamento ? appuntamento.dataSerie : null,
      inizio: `${dayKey(stato.data)}T${stato.ora}`,
      durata: durata(),
      posaMinuti: posa(),
      prezzo: prezzo(),
      servizi: serviziOrdinati(),
      note: stato.note,
      stato: appuntamento ? appuntamento.stato : 'previsto',
      confermaInviata: appuntamento ? appuntamento.confermaInviata : null,
      promemoriaInviato: appuntamento ? appuntamento.promemoriaInviato : null,
      creatoIl: appuntamento ? appuntamento.creatoIl : undefined
    });
    p.chiudi();
    if (modifica) ui.ok('Appuntamento aggiornato');
    else if (stato.cliente) setTimeout(() => proponiConferma(salvato, stato.cliente), 240);
    else ui.ok(`Appuntamento fissato per ${stato.nomeLibero}`);
  });

  /* ---------------- avvio ---------------- */
  disegnaCliente();
  await disegnaServizi();
  disegnaGiorni();
  await disegnaOrari();
  await aggiorna();
}

/* Subito dopo il salvataggio: il messaggio di conferma, pronto da inviare. */

MOD.vPromemoria = (function () {
/* Charme — coda dei promemoria WhatsApp.
   Una cliente sotto l'altra: tocca, invia, torna, tocca la successiva. */

const store = MOD.store;
const cfg = MOD.cfgApp;
const wa = MOD.whatsapp;
const ui = MOD.ui;
const { esc, iniziali, nomeCompleto, telefonoLeggibile, addDays, dayKey, dataEstesa, dataBreve, fromDayKey, daIsoLocale, ora: oraDi, durataUmana, euro } = MOD.util;

function inizializza() {
  const scelta = document.getElementById('giorno-promemoria');
  const oggi = new Date();
  scelta.innerHTML = Array.from({ length: 8 }, (_, i) => {
    const d = addDays(oggi, i);
    const k = dayKey(d);
    const etichetta = i === 0 ? 'Oggi' : i === 1 ? 'Domani' : dataBreve(d);
    return `<option value="${k}">${esc(etichetta)} — ${esc(dataEstesa(d).toLowerCase())}</option>`;
  }).join('');

  });

async function invia(appuntamentoId) {
  const a = await store.leggiAppuntamento(appuntamentoId);
  if (!a) return;
  const cliente = a.clienteId ? await store.leggiCliente(a.clienteId) : null;
  if (!cliente) { ui.errore('Questa cliente non ha ancora una scheda: creala dall\'appuntamento in agenda'); return; }
  if (!cliente.telefono) { ui.errore('Manca il numero di telefono'); return; }
  const testo = wa.testoPromemoria(cliente, a);
  if (wa.apri(cliente, testo)) {
    await store.segnaMessaggioInviato(appuntamentoId, 'promemoria');
    ui.ok(`WhatsApp aperto per ${cliente.nome}: tocca invia`);
    disegna();
  } else ui.errore('Numero non valido');
}

async function disegna() {
  const elenco = document.getElementById('elenco-promemoria');
  const data = fromDayKey(giornoScelto);
  const valuta = cfg.get('incassi').valuta;

  const appuntamenti = (await store.giornataCompleta(data)).filter(a => a.stato !== 'annullato');
  const daInviare = [], gia = [], esclusi = [];

  for (const a of appuntamenti) {
    const c = a.cliente;
    if (!c) {
      if (a.clienteNome) esclusi.push({ a, c: { nome: a.clienteNome, cognome: '' }, motivo: 'non ha ancora una scheda' });
      continue;
    }
    if (!c.promemoriaAttivo) { esclusi.push({ a, c, motivo: 'promemoria disattivato nella sua scheda' }); continue; }
    if (!c.telefono) { esclusi.push({ a, c, motivo: 'manca il numero di telefono' }); continue; }
    (a.promemoriaInviato ? gia : daInviare).push({ a, c });
  }

  document.getElementById('sottotitolo-promemoria').textContent =
    daInviare.length === 0
      ? (appuntamenti.length ? 'tutti i promemoria di questa giornata sono a posto' : 'nessun appuntamento in questa giornata')
      : `${daInviare.length} ${daInviare.length === 1 ? 'messaggio da inviare' : 'messaggi da inviare'}`;

  const carta = ({ a, c }, inviato) => {
    const d = daIsoLocale(a.inizio);
    const testo = wa.testoPromemoria(c, a);
    return `
      <div class="carta-promemoria${inviato ? ' carta-promemoria--inviato' : ''}">
        <div class="pastiglia">${esc(iniziali(c.nome, c.cognome))}</div>
        <div class="carta-promemoria__corpo">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <strong style="font-size:16.5px">${esc(nomeCompleto(c))}</strong>
            <span class="pillola pillola--oro">${esc(oraDi(d))}</span>
            <span class="testo-tenue">${esc((a.servizi || []).map(s => s.nome).join(', ') || 'appuntamento')} · ${durataUmana(a.durata)}</span>
          </div>
          <div class="testo-tenue" style="margin-top:2px">${esc(telefonoLeggibile(c.telefono))}</div>
          ${inviato ? '' : `<div class="anteprima-messaggio">${esc(testo)}</div>`}
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">
          ${inviato
            ? '<span class="pillola pillola--verde">✓ inviato</span>'
            : `<button class="btn btn--verde" data-invia="${esc(a.id)}" type="button">Apri WhatsApp</button>
               <button class="btn btn--fantasma btn--piccolo" data-salta="${esc(a.id)}" type="button">Già avvisata</button>`}
        </div>
      </div>`;
  };

  let html = '';

  if (daInviare.length) {
    html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
      <h3 style="font-size:17px">Da inviare</h3>
      <span class="pillola pillola--rossa">${daInviare.length}</span>
      <span class="testo-tenue">Ogni messaggio si apre in WhatsApp già scritto: tocca invia e torna qui.</span>
    </div>`;
    html += daInviare.map(x => carta(x, false)).join('');
  } else if (appuntamenti.length) {
    html += `<div class="avviso-riquadro avviso-riquadro--info" style="margin-bottom:18px">
      <span>✓</span><div><strong>Tutto a posto</strong>
      Non ci sono promemoria in sospeso per ${esc(dataEstesa(data).toLowerCase())}.</div></div>`;
  } else {
    html += ui.statoVuoto({
      icona: '💬',
      titolo: 'Nessun appuntamento',
      testo: `Per ${dataEstesa(data).toLowerCase()} non c'è niente in agenda.`
    });
  }

  if (gia.length) {
    html += `<h3 style="font-size:17px;margin:26px 0 12px">Già inviati</h3>`;
    html += gia.map(x => carta(x, true)).join('');
  }

  if (esclusi.length) {
    html += `<h3 style="font-size:17px;margin:26px 0 8px">Non ricevono il promemoria</h3>`;
    html += esclusi.map(({ a, c, motivo }) => `
      <div class="carta-promemoria" style="opacity:.62">
        <div class="pastiglia">${esc(iniziali(c.nome, c.cognome))}</div>
        <div class="carta-promemoria__corpo">
          <strong style="font-size:15.5px">${esc(nomeCompleto(c))}</strong>
          <span class="pillola" style="margin-left:8px">${esc(a.inizio.slice(11))}</span>
          <div class="testo-tenue" style="margin-top:2px">${esc(motivo)}</div>
        </div>
      </div>`).join('');
  }

  elenco.innerHTML = html;
  aggiornaPallino();
}

      ? `<textarea class="area" id="${id}" placeholder="${esc(segnaposto)}">${esc(valore || '')}</textarea>`
      : `<input class="input" id="${id}" type="${tipo}" value="${esc(valore == null ? '' : valore)}" placeholder="${esc(segnaposto)}">`}
    ${aiuto ? `<p class="campo__aiuto">${aiuto}</p>` : ''}
  </div>`;
}

function leva(id, etichetta, attivo, sotto = '') {
  return `<label class="interruttore">
    <input type="checkbox" id="${id}" ${attivo ? 'checked' : ''}>
    <span class="interruttore__leva"></span>
    <span class="interruttore__testo">${esc(etichetta)}${sotto ? `<small>${esc(sotto)}</small>` : ''}</span>
  </label>`;
}

function collega(radice, sezione, mappa) {
  for (const [id, chiave] of Object.entries(mappa)) {
    const el = radice.querySelector('#' + id);
    if (!el) continue;
    const evento = el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'change';
    el.addEventListener(evento, async () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'number') v = v === '' ? null : Number(v);
      await cfg.imposta(sezione, { [chiave]: v });
      ui.ok('Salvato');
    });
  }
}

function ridimensiona(file, lato) {
  return new Promise((ok, ko) => {
    const lettore = new FileReader();
    lettore.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const s = Math.min(lato / img.width, lato / img.height, 1);
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ko; img.src = lettore.result;
    };
    lettore.onerror = ko;
    lettore.readAsDataURL(file);
  });
}

/* --- foglio del listino (CSV con punto e virgola: si apre in Excel) --- */

function esportaListino(servizi, categorie) {
  const nomeCat = Object.fromEntries(categorie.map(c => [c.id, c.nome]));
  const righe = [['Categoria','Servizio','Durata (min)','Posa (min)','Prezzo','Più usato','Attivo']];
  for (const s of servizi) {
    righe.push([
      nomeCat[s.categoriaId] || '', s.nome, s.durata, s.posaMinuti || 0,
      String(s.prezzo).replace('.', ','), s.preferito ? 'sì' : 'no', s.attivo ? 'sì' : 'no'
    ]);
  }
  const csv = righe.map(r => r.map(v => {
    const t = String(v);
    return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  }).join(';')).join('\r\n');
  scaricaFile(nomeFileConData('charme-listino', 'csv'), '﻿' + csv, 'text/csv;charset=utf-8');
  ui.ok('Foglio del listino scaricato');
}

async function importaListino(file) {
  if (!file) return;
  const testo = (await file.text()).replace(/^﻿/, '');
  const righe = testo.split(/\r?\n/).filter(r => r.trim());
  if (righe.length < 2) { ui.errore('Il foglio sembra vuoto'); return; }

  const separatore = (righe[0].match(/;/g) || []).length >= (righe[0].match(/,/g) || []).length ? ';' : ',';
  const dividi = (r) => {
    const out = []; let corrente = '', dentro = false;
    for (let i = 0; i < r.length; i++) {
      const ch = r[i];
      if (ch === '"') { if (dentro && r[i+1] === '"') { corrente += '"'; i++; } else dentro = !dentro; }
      else if (ch === separatore && !dentro) { out.push(corrente); corrente = ''; }
      else corrente += ch;
    }
    out.push(corrente);
    return out.map(x => x.trim());
  };

  const dati = righe.slice(1).map(dividi).filter(r => r[1]);
  if (!dati.length) { ui.errore('Nessuna riga valida trovata'); return; }

  const sicuro = await ui.conferma({
    titolo: 'Sostituire il listino?',
    testo: `Il foglio contiene ${dati.length} servizi. Il listino attuale verrà sostituito. ` +
           `Gli appuntamenti già registrati non cambiano: conservano nome e prezzo del momento in cui sono stati creati.`,
    confermaTesto: 'Sostituisci listino'
  });
  if (!sicuro) return;

  const categorieEsistenti = await store.elencoCategorie();
  const perNome = Object.fromEntries(categorieEsistenti.map(c => [c.nome.toLowerCase(), c.id]));
  const tavolozza = ['#B08D57','#C98F86','#9B6A7D','#7E9478','#A8743F','#6E8CA0'];

  for (const s of await store.elencoServizi()) await store.eliminaServizio(s.id);

  let i = 0;
  for (const r of dati) {
    const [cat, nome, durata, posa, prezzo, preferito, attivo] = r;
    let categoriaId = perNome[(cat || '').toLowerCase()];
    if (cat && !categoriaId) {
      const nuova = await store.salvaCategoria({ nome: cat, colore: tavolozza[Object.keys(perNome).length % tavolozza.length] });
      perNome[cat.toLowerCase()] = nuova.id;
      categoriaId = nuova.id;
    }
    await store.salvaServizio({
      nome, categoriaId: categoriaId || null,
      durata: Number(String(durata).replace(',', '.')) || 30,
      posaMinuti: Number(String(posa).replace(',', '.')) || 0,
      prezzo: Number(String(prezzo).replace(/[^\d,.-]/g, '').replace(',', '.')) || 0,
      preferito: /^(s|y|1|x|v)/i.test(preferito || ''),
      attivo: attivo === undefined || attivo === '' ? 1 : /^(s|y|1|x|v)/i.test(attivo),
      ordine: ++i
    });
  }
  ui.ok(`${dati.length} servizi importati`);
  disegna(); if (alCambioListino) alCambioListino();
}

                 data-campo="pausaA" aria-label="pausa a" placeholder="--:--" value="${esc(ui.normalizzaOra(g.pausaA || ''))}">
          <input class="input input--ora" type="text" inputmode="numeric" maxlength="5" autocomplete="off"
                 data-campo="chiusura" aria-label="chiude" value="${esc(ui.normalizzaOra(g.chiusura))}">
        </div>`;
      }).join('')}

      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn--principale" id="o-salva">Salva gli orari</button>
        ${configurati ? '<button class="btn btn--fantasma" id="o-annulla">Torna alla fascia unica</button>' : ''}
      </div>
    </div>

    <div class="blocco" style="max-width:900px">
      <h3 class="blocco__titolo">Ferie e chiusure straordinarie</h3>
      <p class="blocco__nota">Nei periodi indicati l'app non propone orari e non crea appuntamenti fissi.
      Quelli già in agenda restano: nessuno li cancella di nascosto.</p>

      ${chiusure.length ? chiusure.map((c, i) => {
        const passata = (c.a || c.da) < oggi;
        return `
        <div class="riga-info" style="${passata ? 'opacity:.5' : ''}">
          <span class="riga-info__etichetta">
            ${c.a && c.a !== c.da
              ? `dal ${esc(dataBreve(fromDayKey(c.da)))} al ${esc(dataBreve(fromDayKey(c.a)))}`
              : esc(dataBreve(fromDayKey(c.da)))}
            ${c.motivo ? ` — <strong>${esc(c.motivo)}</strong>` : ''}
            ${passata ? ' (passata)' : ''}
          </span>
          <span><button class="btn-icona" data-chiusura-via="${i}" title="Togli">&times;</button></span>
        </div>`;
      }).join('') : '<p class="testo-tenue">Nessuna chiusura in programma.</p>'}

      <div class="riga-campi--tre riga-campi" style="margin-top:16px">
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ch-da">Dal</label>
          <input class="input" id="ch-da" type="date" value="${esc(oggi)}">
        </div>
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ch-a">Al</label>
          <input class="input" id="ch-a" type="date" value="${esc(oggi)}">
        </div>
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ch-motivo">Motivo</label>
          <input class="input" id="ch-motivo" placeholder="ferie, corso, ponte…">
        </div>
      </div>
      <button class="btn btn--fantasma" id="ch-aggiungi" style="margin-top:12px">Aggiungi la chiusura</button>
    </div>

    <div class="blocco" style="max-width:900px">
      <h3 class="blocco__titolo">Aperture extra</h3>
      <p class="blocco__nota">Una giornata singola con orari suoi: il prefestivo, il lunedì sotto Natale,
      il giorno in più prima delle feste. Vince su tutto — sulla settimana e anche sulle ferie —
      perché riguarda un giorno solo.</p>

      ${aperture.length ? aperture.map((e, i) => {
        const passata = e.giorno < oggi;
        const dentroFerie = store.chiusuraScrittaDi(e.giorno);
        return `
        <div class="riga-info" style="${passata ? 'opacity:.5' : ''}">
          <span class="riga-info__etichetta">
            ${esc(dataBreve(fromDayKey(e.giorno)))} · ${esc(e.apertura)}–${esc(e.chiusura)}${
              e.pausaDa && e.pausaA ? ` (pausa ${esc(e.pausaDa)}–${esc(e.pausaA)})` : ''}
            ${e.motivo ? ` — <strong>${esc(e.motivo)}</strong>` : ''}
            ${passata ? ' (passata)' : ''}
            ${dentroFerie && !passata ? `<br><small class="testo-tenue">cade in «${esc(dentroFerie.motivo || 'chiusura')}»: quel giorno resti aperta</small>` : ''}
          </span>
          <span><button class="btn-icona" data-apertura-via="${i}" title="Togli">&times;</button></span>
        </div>`;
      }).join('') : '<p class="testo-tenue">Nessuna apertura extra in programma.</p>'}

      <div class="riga-campi--tre riga-campi" style="margin-top:16px">
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ap-giorno">Giorno</label>
          <input class="input" id="ap-giorno" type="date" value="${esc(oggi)}">
        </div>
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ap-apertura">Apre</label>
          ${ui.campoOra('ap-apertura', '09:00')}
        </div>
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ap-chiusura">Chiude</label>
          ${ui.campoOra('ap-chiusura', '19:00')}
        </div>
      </div>
      <div class="riga-campi--tre riga-campi" style="margin-top:12px">
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ap-pausa-da">Pausa da</label>
          ${ui.campoOra('ap-pausa-da', '')}
        </div>
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ap-pausa-a">Pausa a</label>
          ${ui.campoOra('ap-pausa-a', '')}
        </div>
        <div class="campo" style="margin:0">
          <label class="campo__etichetta" for="ap-motivo">Motivo</label>
          <input class="input" id="ap-motivo" placeholder="prefestivo, Natale…">
        </div>
      </div>
      <p class="campo__aiuto">Lascia vuota la pausa se quel giorno si tira dritto.</p>
      <button class="btn btn--fantasma" id="ap-aggiungi" style="margin-top:12px">Aggiungi l'apertura extra</button>
    </div>

    <div class="blocco" style="max-width:900px">
      ${leva('o-avviso', 'Avvisa quando fisso fuori orario', a.avvisoFuoriOrario,
             'Un avviso, non un divieto: alla cliente affezionata si resta aperti')}
    </div>`;

  collega(p, 'agenda', { 'o-avviso': 'avvisoFuoriOrario' });

  p.querySelector('#o-salva').addEventListener('click', async () => {
    const nuova = [...settimana];
    p.querySelectorAll('[data-giorno]').forEach(riga => {
      const i = Number(riga.dataset.giorno);
      const leggi = (campo) => riga.querySelector(`[data-campo="${campo}"]`);
      // Gli orari passano sempre da normalizzaOra: «9», «930», «9.30» sono
      // tutti orari validi da scrivere in fretta, e diventano 09:00 e 09:30.
      const ora = (campo, ripiego) => ui.normalizzaOra(leggi(campo).value) || ripiego;
      nuova[i] = {
        aperto: leggi('aperto').checked,
        apertura: ora('apertura', '09:00'),
        chiusura: ora('chiusura', '19:00'),
        pausaDa: ora('pausaDa', ''),
        pausaA: ora('pausaA', '')
      };
    });

    const storti = nuova.filter(g => g.aperto && g.chiusura <= g.apertura);
    if (storti.length) { ui.errore('C\'è un giorno che chiude prima di aprire: controlla'); return; }
    const pausePazze = nuova.filter(g => g.aperto && g.pausaDa && g.pausaA && g.pausaA <= g.pausaDa);
    if (pausePazze.length) { ui.errore('C\'è una pausa che finisce prima di cominciare: controlla'); return; }

    await cfg.imposta('agenda', { settimana: nuova });
    ui.ok('Orari salvati');
    document.dispatchEvent(new CustomEvent('impostazioni:cambiate'));
    disegna();
  });

  const annulla = p.querySelector('#o-annulla');
  if (annulla) annulla.addEventListener('click', async () => {
    const sicuro = await ui.conferma({
      titolo: 'Tornare alla fascia unica?',
      testo: `L'app smetterà di distinguere i giorni e userà ${a.oraInizio}–${a.oraFine} per tutti, festivi compresi. Le chiusure straordinarie restano.`,
      confermaTesto: 'Torna indietro'
    });
    if (!sicuro) return;
    await cfg.imposta('agenda', { settimana: null });
    ui.ok('Orari azzerati');
    document.dispatchEvent(new CustomEvent('impostazioni:cambiate'));
    disegna();
  });

  p.querySelector('#ch-aggiungi').addEventListener('click', async () => {
    const da = p.querySelector('#ch-da').value;
    const fino = p.querySelector('#ch-a').value || da;
    const motivo = p.querySelector('#ch-motivo').value.trim();
    if (!da) { ui.errore('Scegli almeno il giorno di inizio'); return; }
    if (fino < da) { ui.errore('La fine viene prima dell\'inizio'); return; }

    const nuove = [...(cfg.get('agenda').chiusure || []), { da, a: fino, motivo }];
    await cfg.imposta('agenda', { chiusure: nuove });

    // Chi ha un appuntamento fisso in quel periodo va avvisata adesso, non dopo.
    const tocca = [];
    for (const c of await store.elencoClienti()) {
      if (!c.ricorrenza || !c.ricorrenza.attiva || !c.ricorrenza.serieId) continue;
      const occ = await store.occorrenzeSerie(c.ricorrenza.serieId, { daGiorno: da });
      const dentro = occ.filter(x => x.giorno >= da && x.giorno <= fino);
      if (dentro.length) tocca.push({ cliente: c, quanti: dentro.length });
    }

    ui.ok('Chiusura aggiunta');
    document.dispatchEvent(new CustomEvent('impostazioni:cambiate'));

    if (tocca.length) {
      setTimeout(() => ui.pannello({
        titolo: 'Ci sono appuntamenti fissi in quel periodo',
        sottotitolo: 'Sono già in agenda: l\'app non li cancella da sola.',
        contenuto: `<p class="testo-lungo">In questa chiusura cadono appuntamenti fissi già creati:</p>
          ${tocca.map(t => `<div class="riga-info">
            <span class="riga-info__etichetta">${esc(nomeCompleto(t.cliente))}</span>
            <span class="riga-info__valore">${t.quanti} ${t.quanti === 1 ? 'appuntamento' : 'appuntamenti'}</span>
          </div>`).join('')}
          <p class="testo-lungo" style="margin-top:14px">Da qui in avanti non ne verranno creati altri in quei giorni.
          Questi vanno tolti o spostati a mano dall'agenda — così puoi avvisare le clienti mentre lo fai.</p>`,
        azioni: '<button class="btn btn--principale" data-x="ok">Ho capito</button>'
      }).elemento.querySelector('[data-x="ok"]').addEventListener('click', () => ui.chiudiPannello()), 500);
    }
    disegna();
  });

  p.querySelector('#ap-aggiungi').addEventListener('click', async () => {
    const giorno = p.querySelector('#ap-giorno').value;
    const apertura = ui.normalizzaOra(p.querySelector('#ap-apertura').value) || '09:00';
    const chiusura = ui.normalizzaOra(p.querySelector('#ap-chiusura').value) || '19:00';
    const pausaDa = ui.normalizzaOra(p.querySelector('#ap-pausa-da').value);
    const pausaA = ui.normalizzaOra(p.querySelector('#ap-pausa-a').value);
    const motivo = p.querySelector('#ap-motivo').value.trim();

    if (!giorno) { ui.errore('Scegli il giorno'); return; }
    if (chiusura <= apertura) { ui.errore('Chiude prima di aprire: controlla gli orari'); return; }
    if (pausaDa && pausaA && pausaA <= pausaDa) { ui.errore('La pausa finisce prima di cominciare'); return; }
    if (pausaDa && pausaA && (pausaDa < apertura || pausaA > chiusura)) {
      ui.errore('La pausa cade fuori dall\'orario di quel giorno'); return;
    }

    // Un giorno, un'apertura: la nuova sostituisce quella che c'era.
    const elenco = (cfg.get('agenda').aperture || []).filter(x => x && x.giorno !== giorno);
    elenco.push({ giorno, apertura, chiusura, pausaDa, pausaA, motivo });
    await cfg.imposta('agenda', { aperture: elenco });

    ui.ok('Apertura extra aggiunta');
    document.dispatchEvent(new CustomEvent('impostazioni:cambiate'));
    disegna();
  });

  ui.su(p, 'click', '[data-apertura-via]', async (e, el) => {
    const elenco = [...(cfg.get('agenda').aperture || [])]
      .sort((x, y) => (x.giorno || '').localeCompare(y.giorno || ''));
    elenco.splice(Number(el.dataset.aperturaVia), 1);
    await cfg.imposta('agenda', { aperture: elenco });
    ui.ok('Apertura extra tolta');
    document.dispatchEvent(new CustomEvent('impostazioni:cambiate'));
    disegna();
  });

  ui.su(p, 'click', '[data-chiusura-via]', async (e, el) => {
    const elenco = [...(cfg.get('agenda').chiusure || [])]
      .sort((x, y) => (x.da || '').localeCompare(y.da || ''));
    elenco.splice(Number(el.dataset.chiusuraVia), 1);
    await cfg.imposta('agenda', { chiusure: elenco });
    ui.ok('Chiusura tolta');
    document.dispatchEvent(new CustomEvent('impostazioni:cambiate'));
    disegna();
  });

  p.querySelectorAll('[data-campo="aperto"]').forEach(c => c.addEventListener('change', () => {
    c.closest('.riga-giorno').classList.toggle('is-chiuso', !c.checked);
  }));

  ui.legaCampiOra(p);
}

/* ========================== COLORE ========================== */

async function dColore(p) {
  const c = cfg.get('colore');
  const lista = (titolo, id, valori, nota) => `
    <div class="blocco">
      <h3 class="blocco__titolo">${esc(titolo)}</h3>
      <p class="blocco__nota">${esc(nota)}</p>
      <textarea class="area" id="${id}" style="min-height:110px">${esc(valori.join('\n'))}</textarea>
      <p class="campo__aiuto">Una voce per riga.</p>
    </div>`;

  p.innerHTML = `
    <h2>Colore e formule</h2>
    <p class="testo-tenue">Queste liste alimentano i menu della scheda colore. Aggiungi una marca qui e comparirà ovunque serva.</p>
    ${lista('Marche', 'co-marche', c.marche, 'I prodotti che usi abitualmente.')}
    ${lista('Volumi di ossigeno', 'co-volumi', c.volumi, 'Compaiono come scelta rapida nella formula.')}
    ${lista('Tempi di posa proposti (minuti)', 'co-tempi', c.tempiPosa.map(String), 'Solo numeri, uno per riga.')}
  `;

  const salva = async (id, chiave, numerico = false) => {
    const el = p.querySelector('#' + id);
    el.addEventListener('change', async () => {
      let v = el.value.split('\n').map(x => x.trim()).filter(Boolean);
      if (numerico) v = v.map(Number).filter(n => !isNaN(n));
      await cfg.imposta('colore', { [chiave]: v });
      ui.ok('Salvato');
    });
  };
  salva('co-marche', 'marche');
  salva('co-volumi', 'volumi');
  salva('co-tempi', 'tempiPosa', true);
}

async function dPonte(p) {
  const b = cfg.get('ponte');
  const configurato = ponte.configurato();
  const linkPagina = ponte.indirizzoConsultazione();
  const linkConnettore = ponte.indirizzoConnettore();

  const quando = b.ultimaSincronizzazione
    ? `${dataNumerica(new Date(b.ultimaSincronizzazione))} alle ${oraDi(new Date(b.ultimaSincronizzazione))}`
    : null;

  let stato, classeStato, testoStato;
  if (!b.attivo) {
    stato = '○'; classeStato = 'avviso-riquadro--attenzione';
    testoStato = 'Il ponte è spento: dal telefono non si vede niente. Nessun dato esce dal tablet.';

      ${campo('pn-lettura', 'Chiave di lettura', b.chiaveLettura,

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <button class="btn btn--fantasma" id="pn-prova">Prova la connessione</button>
        <button class="btn btn--principale" id="pn-invia">Invia adesso</button>
      </div>
    </div>

    ${linkConnettore ? `
    <div class="blocco">
      <h3 class="blocco__titolo">Indirizzi da usare sul telefono</h3>
      <p class="blocco__nota">Il primo va incollato in Claude, in Impostazioni → Connettori → Aggiungi connettore
      personalizzato. Il secondo si apre in un browser qualsiasi e mostra l'agenda: tienilo come riserva.</p>

      <div class="campo">
        <span class="campo__etichetta">Connettore per Claude</span>
        <div style="display:flex;gap:8px;align-items:center">
          <input class="input" id="pn-url-mcp" value="${esc(linkConnettore)}" readonly style="font-size:13px">
          <button class="btn btn--fantasma btn--piccolo" data-copia="pn-url-mcp">Copia</button>

          <button class="btn btn--fantasma btn--piccolo" data-copia="pn-url-pagina">Copia</button>
          <a class="btn btn--fantasma btn--piccolo" href="${esc(linkPagina)}" target="_blank" rel="noopener">Apri</a>
        </div>

        <span class="riga-info__valore">nome, telefono, note, allergie, riepiloghi</span></div>
      <div class="riga-info"><span class="riga-info__etichetta">Foto</span>
        <span class="riga-info__valore">no, restano solo sul tablet</span></div>
      <p class="campo__aiuto" style="margin-top:12px">Sono dati personali di terzi: stanno su un server tuo,
      raggiungibile solo da chi conosce le chiavi. Spegnendo il ponte smetti di inviarli, ma quelli già inviati
      restano sul server finché non lo svuoti o non lo cancelli.</p>
    </div>`;

  collega(p, 'ponte', {
    'pn-attivo': 'attivo', 'pn-indirizzo': 'indirizzo',
    'pn-scrittura': 'chiaveScrittura', 'pn-lettura': 'chiaveLettura'
  });
  p.querySelectorAll('#pn-indirizzo,#pn-scrittura,#pn-lettura,#pn-attivo')
   .forEach(el => el.addEventListener('change', () => setTimeout(() => disegna(), 350)));

  ui.su(p, 'click', '[data-copia]', (e, el) => {
    const campo = p.querySelector('#' + el.dataset.copia);
    campo.select();
    navigator.clipboard.writeText(campo.value)
      .then(() => ui.ok('Indirizzo copiato'))
      .catch(() => ui.avviso('Selezionato: copialo a mano'));
  });

  p.querySelector('#pn-prova').addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Provo…';
    const r = await ponte.prova();
    r.ok ? ui.ok(r.messaggio) : ui.errore(r.messaggio);
    if (r.ok) await ponte.sincronizza({ manuale: true });
    disegna();
  });

  p.querySelector('#pn-invia').addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Invio…';
    const r = await ponte.sincronizza({ manuale: true });
    r.ok ? ui.ok('Agenda inviata al telefono') : ui.errore(r.messaggio);
    disegna();
  });
}

      <p class="campo__aiuto">La <strong>configurazione</strong> contiene solo listino, testi e preferenze:

      <p class="blocco__nota">Da un file di backup salvato in precedenza. Fai sempre una copia prima di ripristinare.</p>

    <div class="blocco">
      <h3 class="blocco__titolo">Promemoria</h3>

        ${campo('b-giorni', 'Avvisa dopo quanti giorni senza backup', b.giorniAvviso, { tipo: 'number' })}

      <div id="b-server" class="testo-tenue">caricamento…</div>
    </div>

    <div class="blocco">
      <h3 class="blocco__titolo">Copie automatiche interne</h3>
      <p class="blocco__nota">L'app salva da sola una copia prima di ogni aggiornamento che tocca la struttura dei dati.
      Restano dentro il tablet, in un archivio separato: non sostituiscono il backup esterno.</p>
      ${copie.length
        ? copie.map(c => `<div class="riga-info">
            <span class="riga-info__etichetta">${esc(dataNumerica(new Date(c.creataIl)))} ${esc(oraDi(new Date(c.creataIl)))} — v${c.daVersione} → v${c.aVersione}</span>

    });
    if (!sicuro) return;

    try {

      await cfg.carica();
      ui.ok('Ripristino completato: ' + Object.entries(riepilogo).map(([k, v]) => `${v} ${k}`).join(', '));
      document.dispatchEvent(new CustomEvent('dati:cambiati'));
      disegna();
    } catch (err) {
      ui.errore(err.message);
    }
  });
}

/** Il riquadro delle copie conservate sul server. */
async function disegnaCopieServer(p) {
  const zona = p.querySelector('#b-server');
  if (!zona) return;
  const b = cfg.get('ponte');

  if (!ponte.configurato()) {
    zona.innerHTML = `<p class="testo-tenue">Il ponte non è configurato: senza server non c'è dove mandare le copie.
      Si imposta in <strong>Telefono e Claude</strong>.</p>`;
    return;
  }

  zona.innerHTML = `
    ${leva('b-server-attivo', 'Manda una copia al giorno', b.backupSuServer,
           'Se spento, sul server resta solo il riassunto per Claude, senza i dati completi')}
    <div id="b-copie" style="margin-top:12px" class="testo-tenue">controllo le copie sul server…</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn--fantasma" id="b-invia-ora">Manda una copia adesso</button>
      <button class="btn btn--fantasma" id="b-ripristina-server">Ripristina dal server</button>
      <button class="btn btn--fantasma" id="b-svuota-server" style="color:var(--rosso);margin-left:auto">Svuota l'archivio</button>
    </div>`;

  collega(p, 'ponte', { 'b-server-attivo': 'backupSuServer' });

  const esito = await ponte.copieSulServer();
  const elenco = p.querySelector('#b-copie');
  if (!esito.ok) {
    elenco.innerHTML = `<span style="color:var(--rosso)">Non riesco a leggere l'archivio: ${esc(esito.messaggio || 'errore')}</span>`;
  } else if (!esito.copie.length) {
    elenco.innerHTML = 'Nessuna copia sul server per ora. La prima parte alla prossima sincronizzazione.';
  } else {
    const ultima = esito.copie[0];
    const mb = ultima.byte ? (ultima.byte / 1048576).toFixed(2) + ' MB' : '';
    elenco.innerHTML = `<strong style="color:var(--bruno)">${esito.copie.length}
      ${esito.copie.length === 1 ? 'copia conservata' : 'copie conservate'}</strong>
      — la più recente è del ${esc(dataBreve(fromDayKey(ultima.giorno)))}${mb ? ` (${mb})` : ''}.
      Si conservano gli ultimi ${esito.conservate} giorni.`;
  }

  p.querySelector('#b-invia-ora').addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Invio…';
    const r = await ponte.inviaBackupGiornaliero({ forza: true });
    r.ok ? ui.ok('Copia inviata al server') : ui.errore(r.messaggio);
    disegna();
  });

  p.querySelector('#b-svuota-server').addEventListener('click', async () => {
    const sicuro = await ui.conferma({
      titolo: 'Svuotare l\'archivio sul server?',
      testo: 'Tutte le copie conservate sul server verranno cancellate. I dati sul tablet non vengono toccati, ma resterai senza copie fuori sede finché non ne parte una nuova.',
      confermaTesto: 'Svuota', pericolo: true
    });
    if (!sicuro) return;
    await ponte.svuotaCopieSulServer();
    await cfg.imposta('ponte', { ultimoBackupServer: null });
    ui.ok('Archivio svuotato');
    disegna();
  });

  p.querySelector('#b-ripristina-server').addEventListener('click', () => moduloRipristinoServer());
}

/** Scegliere il giorno da cui tornare indietro. */
async function moduloRipristinoServer() {
  const esito = await ponte.copieSulServer();
  if (!esito.ok || !esito.copie.length) {
    ui.errore(esito.ok ? 'Non ci sono copie sul server' : (esito.messaggio || 'server non raggiungibile'));
    return;
  }

  const pannello = ui.pannello({
    titolo: 'Ripristina dal server',
    sottotitolo: 'Scegli il giorno da cui vuoi tornare indietro.',
    contenuto: `
      <div class="avviso-riquadro" style="margin-bottom:14px">
        <span>⚠</span><div><strong>Tutto quello che c'è adesso sul tablet verrà sostituito</strong>
        con i dati di quel giorno. Se hai lavorato dopo, quel lavoro si perde.
        Prima di procedere l'app scarica una copia di quello che c'è ora.</div>
      </div>
      ${esito.copie.map(c => {
        const n = c.conteggi || {};
        return `<div class="riga-cliente" data-giorno="${esc(c.giorno)}" style="border-radius:var(--raggio-s)">
          <div class="pastiglia" style="background:var(--crema-scura);color:var(--bruno-medio);font-size:13px">
            ${esc(String(Number(c.giorno.slice(8))))}</div>
          <div style="min-width:0;flex:1">
            <div class="riga-cliente__nome">${esc(dataEstesa(fromDayKey(c.giorno)))}</div>
            <div class="riga-cliente__dettaglio">
              ${n.clienti || 0} clienti · ${n.appuntamenti || 0} appuntamenti${c.byte ? ` · ${(c.byte / 1048576).toFixed(2)} MB` : ''}
            </div>
          </div>
        </div>`;
      }).join('')}`
  });

  ui.su(pannello.elemento, 'click', '[data-giorno]', async (e, el) => {
    const giorno = el.dataset.giorno;
    const sicuro = await ui.conferma({
      titolo: `Tornare al ${dataBreve(fromDayKey(giorno))}?`,
      testo: 'I dati attuali del tablet verranno sostituiti. Prima viene scaricata una copia di quello che c\'è ora, così nulla è davvero perduto.',
      confermaTesto: 'Ripristina', pericolo: true
    });
    if (!sicuro) return;

    try {
      // Rete di sicurezza: la situazione attuale finisce in un file prima di toccare niente.
      const prima = await db.esporta({ includiFoto: false });
      scaricaFile(nomeFileConData('charme-prima-del-ripristino', 'json'), JSON.stringify(prima));

      const pacchetto = await ponte.scaricaCopia(giorno);
      const riepilogo = await db.ripristina(pacchetto);
      await cfg.carica();
      pannello.chiudi();
      ui.ok('Ripristino completato: ' + Object.entries(riepilogo).map(([k, v]) => `${v} ${k}`).join(', '));
      document.dispatchEvent(new CustomEvent('dati:cambiati'));
      setTimeout(() => location.reload(), 1800);
    } catch (err) {
      ui.errore('Ripristino non riuscito: ' + err.message);
    }
  });
}

        <button class="btn btn--fantasma" id="s-cache">Svuota la cache dell'app</button>
        <button class="btn btn--fantasma" id="s-listino" style="color:var(--rosso)">Ripristina listino di esempio</button>
      </div>
      <p class="campo__aiuto">Svuotare la cache ricarica il codice dell'app dalla rete.
      <strong>Non tocca i dati</strong>: clienti e appuntamenti restano dove sono.</p>

  p.querySelector('#s-aggiorna').addEventListener('click', async () => {
    if (!('serviceWorker' in navigator)) { ui.errore('Aggiornamenti non disponibili'); return; }
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { ui.errore('App non installata'); return; }
    await reg.update();
    ui.ok(reg.waiting ? 'Aggiornamento pronto: riapri l\'app' : 'Sei già alla versione più recente');

  const persisti = p.querySelector('#s-persisti');
  if (persisti) persisti.addEventListener('click', async () => {
    const esito = await db.chiediArchiviazionePersistente();
    esito ? ui.ok('Dati protetti') : ui.errore('Android non ha concesso la protezione: usa comunque i backup');

  p.querySelector('#s-cache').addEventListener('click', async () => {

      titolo: 'Svuotare la cache?',

    if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k);
    ui.ok('Cache svuotata: ricarico…');
    setTimeout(() => location.reload(), 900);
  });

  p.querySelector('#s-listino').addEventListener('click', async () => {
    const sicuro = await ui.conferma({
      titolo: 'Ripristinare il listino di esempio?',
      testo: 'Il listino attuale verrà sostituito da quello di esempio. Appuntamenti e clienti non vengono toccati.',
      confermaTesto: 'Ripristina', pericolo: true
    });
    if (!sicuro) return;
    for (const s of await store.elencoServizi()) await db.elimina('servizi', s.id);
    for (const c of await store.elencoCategorie()) await db.elimina('categorie', c.id);
    await db.elimina('impostazioni', '_esempio');
    await cfg.primoAvvio();
    ui.ok('Listino di esempio ripristinato');
    if (alCambioListino) alCambioListino();
    disegna();
  });
}

/* ======================= js/app.js ======================= */
MOD.app = (function () {
/* Charme — avvio e navigazione. */

const db = MOD.db;
const cfg = MOD.cfgApp;
const ui = MOD.ui;
const ponte = MOD.ponte;
const store = MOD.store;
const agenda = MOD.vAgenda;
const clienti = MOD.vClienti;
const nuovo = MOD.vNuovo;
const promemoria = MOD.vPromemoria;
const impostazioni = MOD.vImpost;

const VISTE = ['agenda', 'clienti', 'promemoria', 'impostazioni'];
let vistaCorrente = 'agenda';

async function avvia() {
  try {
    await db.inizializza();
    await cfg.carica();
    const primo = await cfg.primoAvvio();
    if (primo) console.info('[Charme] primo avvio: caricato il listino di esempio');

    // Android non deve poter liberare i dati per fare spazio.
    db.chiediArchiviazionePersistente().then(esito => {
      if (!esito) console.warn('[Charme] archiviazione persistente non concessa: i backup sono essenziali');
    });

    agenda.inizializza({
      suNuovoAppuntamento: (opzioni) => nuovo.apri(opzioni),
      suApriCliente: (id) => clienti.scheda(id)
    });
    clienti.inizializza({
      suNuovoAppuntamento: (opzioni) => nuovo.apri(opzioni),
      // La scheda cliente riusa il pannello dell'agenda invece di rifarne uno
      // suo: elimina, sposta e le domande sulle serie stanno scritte in un
      // posto solo, quindi si comportano allo stesso modo dovunque si tocchi.
      suApriAppuntamento: (id, alChiudere) => agenda.mostraDettaglio(id, alChiudere)
    });
    promemoria.inizializza();
    impostazioni.inizializza({ suListinoCambiato: () => agenda.disegna() });

    document.querySelectorAll('.nav__voce').forEach(b =>
      b.addEventListener('click', () => vaiA(b.dataset.vista)));

    // A giornata finita gli appuntamenti rimasti "previsto" passano a
    // "concluso": si fa prima di disegnare l'agenda, così i colori sono
    // già quelli giusti alla prima occhiata.
    try {
      const chiusi = await store.concludiGiorniPassati();
      if (chiusi) console.info(`[Charme] ${chiusi} appuntamenti passati segnati come conclusi`);
    } catch (e) {
      console.warn('[Charme] chiusura degli appuntamenti passati non riuscita', e);
    }

    // L'orizzonte degli appuntamenti fissi si sposta in avanti da solo:
    // così non finiscono mai e l'agenda lontana non si intasa.
    store.rigeneraTutteLeSerie()
      .then(esito => { if (esito.create) console.info(`[Charme] ${esito.create} appuntamenti fissi generati`); })
      .catch(e => console.warn('[Charme] generazione appuntamenti fissi non riuscita', e));

    await agenda.disegna();
    await promemoria.aggiornaPallino();

    const parametri = new URLSearchParams(location.search);
    if (parametri.get('vista') && VISTE.includes(parametri.get('vista'))) vaiA(parametri.get('vista'));
    if (parametri.get('azione') === 'nuovo') setTimeout(() => nuovo.apri({ data: new Date() }), 400);

    ponte.avvia();

    mostraApp();
    registraServiceWorker();
    avviaControlloPromemoria();
    scorciatoieTastiera();

  } catch (errore) {
    console.error('[Charme] avvio non riuscito', errore);
    schermataDiGuasto(errore);
  }
}

/**
 * Se l'app non riesce ad aprirsi, i dati non devono restare in ostaggio.
 * Da qui si può sempre scaricare una copia leggendo il database direttamente,
 * senza passare da niente che possa essersi rotto.
 */
function schermataDiGuasto(errore) {
  const avvio = document.getElementById('avvio');
  if (!avvio) return;
  avvio.innerHTML = `
    <div class="avvio__marchio">Charme</div>
    <div style="max-width:440px;text-align:center;padding:0 24px">
      <p style="color:var(--rosso);font-weight:600;margin-bottom:8px">L'app non è riuscita ad aprirsi</p>
      <p class="avvio__testo" style="line-height:1.55">${(errore && errore.message) || 'errore sconosciuto'}</p>
      <p class="avvio__testo" style="line-height:1.55;margin-top:14px">
        I dati delle clienti non sono stati toccati. Prima di qualsiasi altra cosa,
        salvane una copia con il pulsante qui sotto.
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px">
        <button class="btn btn--principale" id="guasto-salva">Salva una copia dei dati</button>
        <button class="btn btn--fantasma" id="guasto-riprova">Riprova</button>
      </div>
      <p class="avvio__testo" style="margin-top:16px;font-size:12px">
        Se il problema resta, manda una foto di questo schermo.
      </p>
    </div>`;

  avvio.querySelector('#guasto-riprova').addEventListener('click', () => location.reload());
  avvio.querySelector('#guasto-salva').addEventListener('click', async (e) => {
    e.target.disabled = true;
    e.target.textContent = 'Salvo…';
    try {
      const pacchetto = await esportazioneDiEmergenza();
      const nome = `charme-emergenza-${new Date().toISOString().slice(0, 10)}.json`;
      const url = URL.createObjectURL(new Blob([JSON.stringify(pacchetto)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = nome;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      e.target.textContent = 'Copia salvata ✓';
    } catch (err) {
      e.target.disabled = false;
      e.target.textContent = 'Riprova a salvare';
      console.error('[Charme] esportazione di emergenza fallita', err);
    }
  });
}

/** Legge il database senza usare nessun altro pezzo dell'app. */
function esportazioneDiEmergenza() {
  return new Promise((risolvi, rifiuta) => {
    const richiesta = indexedDB.open('charme');
    richiesta.onerror = () => rifiuta(richiesta.error);
    richiesta.onsuccess = async () => {
      const database = richiesta.result;
      const pacchetto = {
        formato: 'charme-backup',
        versioneDati: database.version,
        creatoIl: new Date().toISOString(),
        emergenza: true,
        dati: {}
      };
      for (const nome of database.objectStoreNames) {
        if (nome === 'foto') continue;   // pesanti: hanno un backup a parte
        pacchetto.dati[nome] = await new Promise((ok) => {
          try {
            const r = database.transaction(nome, 'readonly').objectStore(nome).getAll();
            r.onsuccess = () => ok(r.result);
            r.onerror = () => ok([]);
          } catch { ok([]); }
        });
      }
      database.close();
      risolvi(pacchetto);
    };
  });
}

function mostraApp() {
  document.getElementById('app').hidden = false;
  const avvio = document.getElementById('avvio');
  avvio.classList.add('is-nascosta');
  setTimeout(() => avvio.remove(), 450);
}

function vaiA(vista) {
  if (!VISTE.includes(vista)) return;
  vistaCorrente = vista;
  VISTE.forEach(v =>
    document.getElementById('vista-' + v).classList.toggle('is-attiva', v === vista));
  document.querySelectorAll('.nav__voce').forEach(b =>
    b.classList.toggle('is-attiva', b.dataset.vista === vista));

  if (vista === 'clienti') clienti.disegna();
  if (vista === 'promemoria') promemoria.disegna();
  if (vista === 'impostazioni') impostazioni.disegna();
  if (vista === 'agenda') agenda.disegna();
}

/* ---------- service worker e aggiornamenti ---------- */

async function registraServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });

    reg.addEventListener('updatefound', () => {
      const nuovoSw = reg.installing;
      if (!nuovoSw) return;
      nuovoSw.addEventListener('statechange', () => {
        if (nuovoSw.state === 'installed' && navigator.serviceWorker.controller) {
          proponiAggiornamento(reg);
        }
      });
    });

    // controlla una volta al giorno, senza disturbare
    setInterval(() => reg.update().catch(() => {}), 24 * 3600 * 1000);
  } catch (e) {
    console.warn('[Charme] service worker non registrato', e);
  }
}

function proponiAggiornamento(reg) {
  const p = ui.pannello({
    titolo: 'Aggiornamento disponibile',
    contenuto: `<p class="testo-lungo">C'è una versione nuova di Charme.
      L'aggiornamento riguarda solo il funzionamento dell'app: <strong>clienti, appuntamenti e impostazioni
      restano esattamente come sono</strong>.</p>`,
    azioni: `<button class="btn btn--fantasma" data-x="dopo">Più tardi</button>
             <button class="btn btn--principale" data-x="ora">Aggiorna adesso</button>`
  });
  p.elemento.querySelector('[data-x="dopo"]').addEventListener('click', () => p.chiudi());
  p.elemento.querySelector('[data-x="ora"]').addEventListener('click', () => {
    if (reg.waiting) reg.waiting.postMessage({ tipo: 'attiva-subito' });
    p.chiudi();
    setTimeout(() => location.reload(), 400);
  });
}

/* ---------- promemoria serale ---------- */

function avviaControlloPromemoria() {
  const controlla = async () => {
    const totale = await promemoria.aggiornaPallino();
    const oraPromemoria = cfg.get('messaggi').oraNotificaSerale;
    const adesso = new Date();
    const [h, m] = oraPromemoria.split(':').map(Number);
    const chiave = 'charme-avvisato-' + adesso.toDateString();

    if (totale > 0 &&
        (adesso.getHours() > h || (adesso.getHours() === h && adesso.getMinutes() >= m)) &&
        !sessionStorage.getItem(chiave)) {
      sessionStorage.setItem(chiave, '1');
      ui.avviso(`Ci sono ${totale} promemoria WhatsApp da inviare`, 'info', 8000);
      notificaSistema(totale);
    }
  };
  controlla();
  setInterval(controlla, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) controlla(); });
}

async function notificaSistema(totale) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'denied') return;
  if (Notification.permission === 'default') {
    try { if (await Notification.requestPermission() !== 'granted') return; } catch { return; }
  }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const opzioni = {
      body: `${totale} ${totale === 1 ? 'cliente da avvisare' : 'clienti da avvisare'} per domani.`,
      icon: './icona-192.png',
      badge: './icona-192.png',
      tag: 'charme-promemoria'
    };
    if (reg) await reg.showNotification('Promemoria da inviare', opzioni);
    else new Notification('Promemoria da inviare', opzioni);
  } catch { /* la notifica è un di più: se non parte, pazienza */ }
}

/* ---------- tastiera (il tablet ha la cover con tastiera) ---------- */

function scorciatoieTastiera() {
  document.addEventListener('keydown', (e) => {
    const dentroCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (dentroCampo || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nuovo.apri({ data: agenda.dataVisualizzata() }); }
    if (e.key === 'c' || e.key === 'C') { e.preventDefault(); vaiA('clienti'); document.getElementById('ricerca-clienti').focus(); }
    if (e.key === 'o' || e.key === 'O') { e.preventDefault(); vaiA('agenda'); agenda.vaiA(new Date()); }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvia);
else avvia();

return { vaiA };
})();
