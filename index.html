<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="Gestionale appuntamenti di Charme Parrucchieri">
<meta name="theme-color" content="#2B2219">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charme">
<title>Charme</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icona-192.png">
<link rel="apple-touch-icon" href="icons/icona-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="avvio" id="avvio">
  <div class="avvio__marchio">Charme</div>
  <div class="avvio__testo">apertura in corso…</div>
</div>

<div class="app" id="app" hidden>

  <!-- ===================== navigazione ===================== -->
  <nav class="nav" aria-label="Sezioni">
    <div class="nav__marchio" aria-hidden="true">C</div>

    <button class="nav__voce is-attiva" data-vista="agenda" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
      <span>Oggi</span>
    </button>

    <button class="nav__voce" data-vista="clienti" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <span>Clienti</span>
    </button>

    <button class="nav__voce" data-vista="promemoria" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.7 8.7 0 0 1-3.9-.9L3 20.5l1.6-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
      </svg>
      <span>Promemoria</span>
      <em class="nav__pallino" id="pallino-promemoria" hidden></em>
    </button>

    <button class="nav__voce nav__coda" data-vista="impostazioni" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 1z"/>
      </svg>
      <span>Impostazioni</span>
    </button>
  </nav>

  <!-- ===================== contenuto ===================== -->
  <main class="principale">

    <!-- ---------- AGENDA ---------- -->
    <section class="vista is-attiva" id="vista-agenda" aria-label="Agenda">
      <div class="barra-giorno">
        <button class="btn-icona" id="giorno-prec" type="button" aria-label="Giorno precedente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="btn-icona" id="giorno-succ" type="button" aria-label="Giorno successivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div class="barra-giorno__data" id="etichetta-giorno"></div>
        <button class="btn btn--fantasma btn--piccolo" id="vai-oggi" type="button">Oggi</button>
        <div class="barra-giorno__spazio"></div>
        <div class="riassunto" id="riassunto-giorno"></div>
      </div>
      <div class="corpo" id="corpo-agenda">
        <div class="agenda" id="agenda"></div>
      </div>
      <button class="fab" id="btn-nuovo" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Appuntamento
      </button>
    </section>

    <!-- ---------- CLIENTI ---------- -->
    <section class="vista" id="vista-clienti" aria-label="Clienti">
      <div class="intestazione">
        <div>
          <h1 class="intestazione__titolo">Clienti</h1>
          <p class="intestazione__sottotitolo" id="conteggio-clienti"></p>
        </div>
        <div class="intestazione__coda">
          <button class="btn btn--principale" id="btn-nuova-cliente" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Nuova cliente
          </button>
        </div>
      </div>
      <div class="barra-ricerca">
        <div class="ricerca-avvolgi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="input" id="ricerca-clienti" type="search" placeholder="Cerca per nome o numero…" autocomplete="off">
        </div>
      </div>
      <div class="corpo"><div class="elenco-clienti" id="elenco-clienti"></div></div>
    </section>

    <!-- ---------- PROMEMORIA ---------- -->
    <section class="vista" id="vista-promemoria" aria-label="Promemoria">
      <div class="intestazione">
        <div>
          <h1 class="intestazione__titolo">Promemoria WhatsApp</h1>
          <p class="intestazione__sottotitolo" id="sottotitolo-promemoria"></p>
        </div>
        <div class="intestazione__coda">
          <select class="scelta" id="giorno-promemoria" style="width:auto;min-width:190px"></select>
        </div>
      </div>
      <div class="corpo corpo--imbottito"><div id="elenco-promemoria"></div></div>
    </section>

    <!-- ---------- IMPOSTAZIONI ---------- -->
    <section class="vista" id="vista-impostazioni" aria-label="Impostazioni">
      <div class="impostazioni">
        <nav class="impostazioni__menu" id="menu-impostazioni" aria-label="Sezioni delle impostazioni"></nav>
        <div class="impostazioni__pannello" id="pannello-impostazioni"></div>
      </div>
    </section>

  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
