  const passoNavigazione = () => Math.max(1, Number(cfg.get('agenda').vistaGiorni) || 1);
  document.getElementById('giorno-prec').addEventListener('click', () => vaiA(addDays(dataCorrente, -passoNavigazione())));
  document.getElementById('giorno-succ').addEventListener('click', () => vaiA(addDays(dataCorrente, passoNavigazione())));
  document.getElementById('vai-oggi').addEventListener('click', () => vaiA(new Date()));
  document.getElementById('btn-nuovo').addEventListener('click', () => apriNuovo({ data: dataCorrente }));
  document.getElementById('cerca-scheda').addEventListener('click', () => apriRicercaScheda());
  document.getElementById('btn-impegno').addEventListener('click', () => moduloImpegno({ data: dataCorrente }));

  // Il calendario: l'icona copre un campo data, così si apre quello di Android.
  const campoData = document.getElementById('data-scelta');
  campoData.addEventListener('change', () => {
    if (!campoData.value) return;
    vaiA(fromDayKey(campoData.value));
  });

  const selettore = document.getElementById('selettore-vista');
  selettore.value = String(cfg.get('agenda').vistaGiorni || 1);
  selettore.addEventListener('change', async () => {
    await cfg.imposta('agenda', { vistaGiorni: Number(selettore.value) || 1 });
    disegna();
  });

  const agenda = document.getElementById('agenda');
  ui.su(agenda, 'click', '.app-blocco', (e, el) => mostraDettaglio(el.dataset.id));
  ui.su(agenda, 'click', '.agenda__vuoto', (e, el) => {
    const colonna = el.closest('[data-giorno-colonna]');
    const giorno = colonna ? fromDayKey(colonna.dataset.giornoColonna) : dataCorrente;
    apriNuovo({ data: giorno, oraSuggerita: el.dataset.ora });
  });
  ui.su(agenda, 'click', '.testata-giorno', (e, el) => {
    vaiA(fromDayKey(el.dataset.giorno));
    const s = document.getElementById('selettore-vista');
    if (s.value !== '1') { s.value = '1'; cfg.imposta('agenda', { vistaGiorni: 1 }).then(() => disegna()); }
  });
  ui.su(agenda, 'click', '.fascia-proposte', () => pannelloProposte());
  document.addEventListener('proposte:cambiate', () => disegna());

  document.addEventListener('dati:cambiati', () => disegna());
  document.addEventListener('impostazioni:cambiate', () => disegna());
}

function vaiA(data) {
  dataCorrente = new Date(data);
  return disegna();
}

function dataVisualizzata() { return new Date(dataCorrente); }

/* ---------- disegno ---------- */

async function disegna() {
  /* Mai ridisegnare sotto le dita di chi sta scrivendo il promemoria della
     giornata: si perderebbero testo e cursore. Il ridisegno si rimanda a
     quando esce dalla casella. */
  if (staScrivendo()) { ridisegnoRimandato = true; return; }
  ridisegnoRimandato = false;

  const agendaCfg = cfg.get('agenda');
  const valuta = cfg.get('incassi').valuta;
  const quanti = Math.max(1, Number(agendaCfg.vistaGiorni) || 1);
  const multi = quanti > 1;

  const griglia = store.estremiGriglia();
  const inizioMin = griglia.da;
  const fineMin = griglia.a;
  const ppm = agendaCfg.densita === 'compatta' ? 1.1 : (agendaCfg.minutiPerPixel || 1.6);

  /* --- quali giorni mostrare --- */
  const giorni = [];
  if (!multi) {
    giorni.push(new Date(dataCorrente));
  } else {
    let d = new Date(dataCorrente), guardia = 0;
    while (giorni.length < quanti && guardia++ < 90) {
      if (!agendaCfg.soloGiorniLavorativi || store.giornoAperto(d)) giorni.push(new Date(d));
      d = addDays(d, 1);
    }
    // tutto chiuso davanti a noi: meglio mostrare i giorni veri che una pagina vuota
    if (!giorni.length) for (let i = 0; i < quanti; i++) giorni.push(addDays(dataCorrente, i));
  }

  /* --- intestazione --- */
  const etichetta = document.getElementById('etichetta-giorno');
  if (multi) {
    const primo = giorni[0], ultimo = giorni[giorni.length - 1];
    etichetta.innerHTML = `${esc(dataBreve(primo))} – ${esc(dataBreve(ultimo))}` +
      `<small>${giorni.length} ${giorni.length === 1 ? 'giornata' : 'giornate'}${agendaCfg.soloGiorniLavorativi ? ' di lavoro' : ''}</small>`;
  } else {
    etichetta.innerHTML = `${esc(dataEstesa(dataCorrente))}<small>${isToday(dataCorrente) ? 'oggi' : dayKey(dataCorrente).split('-').reverse().join('/')}</small>`;
  }
  document.getElementById('vai-oggi').hidden = !multi && isToday(dataCorrente);
  // Il calendario si apre sul giorno che si sta guardando, non su oggi.
  const campoData = document.getElementById('data-scelta');
  if (campoData) campoData.value = dayKey(dataCorrente);

  /* --- dati di tutte le giornate mostrate --- */
  const giornate = [];
  for (const g of giorni) {
    giornate.push({
      data: g,
      chiave: dayKey(g),
      appuntamenti: (await store.giornataCompleta(g)).filter(a => a.stato !== 'annullato'),
      riepilogo: await store.riepilogoGiorno(g),
      fasce: store.fasceDelGiorno(g),
      chiusura: store.chiusuraDi(g),
      titolo: await store.titoloDelGiorno(g)
    });
  }

  // Gli impegni personali occupano la griglia ma non sono clienti.
  const totaleClienti = giornate.reduce((t, g) => t + g.riepilogo.totale, 0);
  const totaleLavoro = giornate.reduce((t, g) => t + g.riepilogo.minutiOccupati, 0);
  const totalePrevisto = giornate.reduce((t, g) => t + g.riepilogo.previsto, 0);
  const totaleImpegni = giornate.reduce((t, g) => t + g.riepilogo.impegni, 0);

  document.getElementById('riassunto-giorno').innerHTML = `
    <div class="riassunto__voce">
      <div class="riassunto__valore">${totaleClienti}</div>
      <div class="riassunto__etichetta">${totaleClienti === 1 ? 'cliente' : 'clienti'}</div>
    </div>
    <div class="riassunto__voce">
      <div class="riassunto__valore">${durataUmana(totaleLavoro)}</div>
      <div class="riassunto__etichetta">di lavoro</div>
    </div>
    ${agendaCfg.mostraPrezzi ? `
    <div class="riassunto__voce">
      <div class="riassunto__valore">${euro(totalePrevisto, valuta)}</div>
      <div class="riassunto__etichetta">previsto</div>
    </div>` : ''}
    ${totaleImpegni ? `
    <div class="riassunto__voce">
      <div class="riassunto__valore">${totaleImpegni}</div>
      <div class="riassunto__etichetta">${totaleImpegni === 1 ? 'impegno' : 'impegni'}</div>
    </div>` : ''}
  `;

  /* --- disegno --- */
  const altezza = (fineMin - inizioMin) * ppm;
  const contenitore = document.getElementById('agenda');
  contenitore.classList.toggle('agenda--multi', multi);

  let html = '';

  // richieste da Claude e chiusura: cappelli sopra tutto
  const inAttesa = ponte.proposte();
  if (inAttesa.length) {
    html += `<div class="fascia-proposte">
      <span style="font-size:20px">📥</span>
      <div><strong>${inAttesa.length} ${inAttesa.length === 1 ? 'richiesta in attesa' : 'richieste in attesa'}</strong>
      <div class="testo-tenue">arrivate da Claude — da confermare</div></div>
      <span class="fascia-proposte__coda">Guarda ›</span>
    </div>`;
  }
  if (!multi && !giornate[0].fasce.length) {
    const c = giornate[0].chiusura;
    html += `<div class="fascia-chiusura">
      <span>🔒</span>
      <div><strong>${esc(c ? (c.motivo || 'Chiusura straordinaria') : 'Negozio chiuso')}</strong>
      ${c ? esc(`dal ${dataBreve(fromDayKey(c.da))} al ${dataBreve(fromDayKey(c.a || c.da))}`)
          : `di ${esc(store.NOMI_GIORNI[dataCorrente.getDay()])} non si lavora`}
      ${giornate[0].appuntamenti.length ? ` — ma ci sono ${giornate[0].appuntamenti.length} appuntamenti in agenda` : ''}</div>
    </div>`;
  }

  // testate dei giorni, solo quando ce n'è più di uno
  if (multi) {
    html += `<div class="agenda__testate" style="grid-template-columns:repeat(${giornate.length},1fr)">`;
    for (const g of giornate) {
      const aperto = g.fasce.length > 0;
      html += `<div class="testata-giorno${isToday(g.data) ? ' is-oggi' : ''}${aperto ? '' : ' is-chiusa'}" data-giorno="${g.chiave}">
        <div class="testata-giorno__nome">${esc(GIORNI_BREVI[g.data.getDay()])}</div>
        <div class="testata-giorno__numero">${g.data.getDate()}</div>
        <div class="testata-giorno__sotto">${aperto
          ? `${g.appuntamenti.length || '—'}${g.appuntamenti.length ? (agendaCfg.mostraPrezzi ? ' · ' + euro(g.riepilogo.previsto, valuta) : '') : ''}`
          : (g.chiusura ? esc(g.chiusura.motivo || 'chiuso') : 'chiuso')}</div>
      </div>`;
    }
    html += '</div>';
  }

  /* Il titolo della giornata: una riga da scrivere sopra l'agenda, per i
     promemoria che non sono appuntamenti — «consegna colore», «Marta richiama».
     Una per ogni giornata mostrata, allineata alla sua colonna. */
  html += `<div class="titoli-giorno" style="grid-template-columns:repeat(${giornate.length},1fr)">`;
  for (const g of giornate) {
    html += `<div class="titolo-giorno${g.titolo ? ' is-pieno' : ''}">
      <span class="titolo-giorno__segno">📌</span>
      <input class="titolo-giorno__campo" type="text" maxlength="120"
             data-titolo-giorno="${esc(g.chiave)}"
             value="${esc(g.titolo)}"
             aria-label="Promemoria del ${esc(dataBreve(g.data))}"
             placeholder="${multi ? 'promemoria' : 'Scrivi qui un promemoria per la giornata…'}">
    </div>`;
  }
  html += '</div>';

  html += `<div class="agenda__griglia" style="height:${altezza}px">`;

  // linee orarie e fasce vuote cliccabili (solo su un giorno: in multi si tocca la colonna)
  for (let m = inizioMin; m <= fineMin; m += 30) {
    const y = (m - inizioMin) * ppm;
    const intera = m % 60 === 0;
    html += `<div class="agenda__linea${intera ? '' : ' agenda__linea--mezza'}" style="top:${y}px"></div>`;
    if (m < fineMin) html += `<div class="agenda__ora${intera ? '' : ' agenda__ora--mezza'}" style="top:${y}px">${hhmmDaMinuti(m)}</div>`;
  }

  if (isToday(dataCorrente) || giornate.some(g => isToday(g.data))) {
    const adesso = new Date();
    const m = adesso.getHours() * 60 + adesso.getMinutes();
    if (m >= inizioMin && m <= fineMin) {
      html += `<div class="agenda__adesso" style="top:${(m - inizioMin) * ppm}px"></div>`;
    }
  }

  html += `<div class="agenda__colonne" style="grid-template-columns:repeat(${giornate.length},1fr)">`;
  for (const g of giornate) {
    html += `<div class="agenda__colonna" data-giorno-colonna="${g.chiave}">`;

    // ore chiuse, ombreggiate
    const zone = [];
    if (!g.fasce.length) zone.push({ da: inizioMin, a: fineMin });
    else {
      if (g.fasce[0].da > inizioMin) zone.push({ da: inizioMin, a: g.fasce[0].da });
      for (let i = 0; i < g.fasce.length - 1; i++) zone.push({ da: g.fasce[i].a, a: g.fasce[i + 1].da });
      if (g.fasce[g.fasce.length - 1].a < fineMin) zone.push({ da: g.fasce[g.fasce.length - 1].a, a: fineMin });
    }
    for (const z of zone) {
      const cima = (Math.max(z.da, inizioMin) - inizioMin) * ppm;
      const alt = (Math.min(z.a, fineMin) - Math.max(z.da, inizioMin)) * ppm;
      if (alt > 1) html += `<div class="agenda__chiuso" style="top:${cima}px;height:${alt}px"></div>`;
    }

    // fasce vuote toccabili
    for (let m = inizioMin; m < fineMin; m += 30) {
      html += `<div class="agenda__vuoto" data-ora="${hhmmDaMinuti(m)}"
                    style="position:absolute;left:0;right:0;top:${(m - inizioMin) * ppm}px;height:${30 * ppm}px;cursor:pointer"></div>`;
    }

    const colonne = disponiInColonne(g.appuntamenti);
    for (const a of g.appuntamenti) {
      html += bloccoHtml(a, { ppm, inizioMin, colonne, multi, valuta, mostraPrezzi: agendaCfg.mostraPrezzi });
    }

    if (!g.appuntamenti.length && !multi) {
      html += `<div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none">
        <div style="font-family:var(--serif);font-size:20px;color:var(--bruno-tenue)">Nessun appuntamento</div>
        <div style="font-size:13.5px;color:var(--bruno-tenue);margin-top:5px">${g.fasce.length ? 'Tocca una fascia oraria per fissarne uno' : ''}</div>
      </div>`;
    }
    html += '</div>';
  }
  html += '</div></div>';

  contenitore.innerHTML = html;

  /* Il promemoria della giornata si salva DA SOLO mentre lei scrive, non solo
     uscendo dal campo. Tre reti: si salva a mano a mano, i ridisegni sono
     rimandati finché ha il cursore dentro, e uscendo si salva comunque.
     Prima ne bastava uno qualsiasi per portarle via quello che aveva scritto. */
  contenitore.querySelectorAll('[data-titolo-giorno]').forEach(campo => {
    const salva = async (avvisa) => {
      const scritto = await store.salvaTitoloDelGiorno(campo.dataset.titoloGiorno, campo.value);
      const contenitoreCampo = campo.closest('.titolo-giorno');
      if (contenitoreCampo) contenitoreCampo.classList.toggle('is-pieno', !!scritto);
      if (avvisa) {
        campo.value = scritto;
        ui.ok(scritto ? 'Promemoria del giorno salvato' : 'Promemoria tolto');
      }
      return scritto;
    };

    campo.addEventListener('input', debounce(() => salva(false), 700));
    campo.addEventListener('change', () => salva(true));
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') campo.blur(); });
    campo.addEventListener('blur', () => {
      // Il ridisegno messo in attesa mentre scriveva può partire adesso.
      if (ridisegnoRimandato) setTimeout(() => { if (!staScrivendo()) disegna(); }, 120);
    });
  });

  const pillolaPonte = document.getElementById('avviso-ponte');
  if (pillolaPonte) pillolaPonte.addEventListener('click', () => {
    document.querySelector('[data-vista="impostazioni"]').click();
    setTimeout(() => {
      const voce = document.querySelector('[data-sezione="ponte"]');
      if (voce) voce.click();
    }, 120);
  });

  // primo disegno: porta in vista l'ora corrente
  if (giornate.some(g => isToday(g.data)) && !contenitore.dataset.giaScorso) {
    const adesso = new Date();
    const m = adesso.getHours() * 60 + adesso.getMinutes();
    document.getElementById('corpo-agenda').scrollTop = Math.max(0, (m - inizioMin) * ppm - 160);
    contenitore.dataset.giaScorso = '1';
  }

  /* Ogni minuto si sposta soltanto la riga rossa dell'ora. Il ridisegno
     completo, che prima girava qui, era la causa del promemoria che spariva
     mentre lo si scriveva. */
  giornoDisegnato = dayKey(new Date());
  clearTimeout(temporizzatoreAdesso);
  temporizzatoreAdesso = setTimeout(aggiornaOraAdesso, 60000);
}

/** Un appuntamento disegnato al suo posto nella colonna della sua giornata. */
function bloccoHtml(a, { ppm, inizioMin, colonne, multi, valuta, mostraPrezzi }) {
  const inizio = minutiDaHHMM(a.inizio.slice(11));
  const top = (inizio - inizioMin) * ppm;
  const alt = Math.max(multi ? 26 : 38, a.durata * ppm - 3);
  const col = colonne.get(a.id) || { indice: 0, totale: 1 };
  const larghezza = 100 / col.totale;
  const sinistra = larghezza * col.indice;
  const corto = alt < (multi ? 44 : 62);
  const colore = a._colore || 'var(--oro)';

  const impegno = store.eImpegno(a);
  const fisso = !impegno && !!a.serieId;
  const nome = a.nomeVisualizzato || (a.cliente ? nomeCompleto(a.cliente) : 'Cliente eliminata');
  const servizi = impegno
    ? 'impegno personale'
    : ((a.servizi || []).map(s => s.nome).join(', ') || 'Appuntamento');
  // Il promemoria per la prossima volta si vede dove serve: sul suo appuntamento.
  const nota = !impegno ? store.notaProssimaDi(a.cliente) : '';

  // Le attese vanno disegnate dove cadono davvero: in mezzo, non in fondo.
  const bandeAttesa = store.tratti(a)
    .filter(t => t.tipo === 'attesa')
    .map(t => {
      const cima = t.da * ppm, altezza = (t.a - t.da) * ppm;
      return altezza > 6
        ? `<div class="app-blocco__posa" style="top:${cima}px;height:${altezza}px" title="posa: sei libera"></div>`
        : '';
    }).join('');

  return `
    <div class="app-blocco${corto ? ' app-blocco--corto' : ''} app-blocco--${esc(a.stato)}${
           fisso ? ' app-blocco--fisso' : ''}${impegno ? ' app-blocco--impegno' : ''}"
         data-id="${esc(a.id)}"
         style="top:${top}px;height:${alt}px;left:calc(${sinistra}% + 2px);width:calc(${larghezza}% - 6px);${
           impegno ? '' : `border-left-color:${esc(colore)}`}">
      ${bandeAttesa}
      <div class="app-blocco__ora">${ora(daIsoLocale(a.inizio))}${corto || multi ? '' : ` – ${ora(new Date(daIsoLocale(a.inizio).getTime() + a.durata * 60000))}`}</div>
      <div class="app-blocco__nome">${impegno ? '<span class="app-blocco__segno">◆</span> ' : ''}${esc(nome)}${
        nota ? ' <span class="app-blocco__nota" title="' + esc(nota) + '">📌</span>' : ''}</div>
      ${corto ? '' : `<div class="app-blocco__servizi">${esc(servizi)}</div>`}
      ${corto || alt < 96 ? '' : `
        <div class="app-blocco__coda">
          ${!impegno && mostraPrezzi && a.prezzo ? `<span class="pillola pillola--oro">${euro(a.prezzo, valuta)}</span>` : ''}
          ${a.posaMinuti ? `<span class="pillola">posa ${a.posaMinuti}′</span>` : ''}
          ${fisso ? '<span class="pillola pillola--verde" title="Appuntamento fisso">↻ fisso</span>' : ''}
          ${nota ? `<span class="pillola pillola--nota" title="Per la prossima volta">📌 ${esc(nota.length > 22 ? nota.slice(0, 21) + '…' : nota)}</span>` : ''}
          ${store.senzaScheda(a) ? '<span class="pillola" title="Senza scheda cliente">senza scheda</span>' : ''}
          ${impegno ? '' : `<span class="segno-invio segno-invio--${a.confermaInviata ? 'ok' : 'no'}"
                title="${a.confermaInviata ? 'Conferma inviata' : 'Conferma non ancora inviata'}">${a.confermaInviata ? '✓' : '!'}</span>`}
        </div>`}
    </div>`;
}

/** Appuntamenti sovrapposti affiancati invece che uno sopra l'altro. */
function disponiInColonne(appuntamenti) {
  const mappa = new Map();
  const ordinati = [...appuntamenti].sort((a, b) => a.inizio.localeCompare(b.inizio));
  let gruppo = [], fineGruppo = -1;

  const chiudi = () => {
    if (!gruppo.length) return;
    const colonne = [];
    for (const a of gruppo) {
      const inizio = minutiDaHHMM(a.inizio.slice(11));
      let posto = colonne.findIndex(c => c <= inizio);
      if (posto === -1) { colonne.push(inizio + a.durata); posto = colonne.length - 1; }
      else colonne[posto] = inizio + a.durata;
      mappa.set(a.id, { indice: posto, totale: 1 });
    }
    for (const a of gruppo) mappa.get(a.id).totale = colonne.length;
    gruppo = []; fineGruppo = -1;
  };

  for (const a of ordinati) {
    const inizio = minutiDaHHMM(a.inizio.slice(11));
    if (gruppo.length && inizio >= fineGruppo) chiudi();
    gruppo.push(a);
    fineGruppo = Math.max(fineGruppo, inizio + a.durata);
  }
  chiudi();
  return mappa;
}

/* ---------- dettaglio appuntamento ---------- */

/**
 * Il pannello di un appuntamento: stato, WhatsApp, promemoria, elimina, modifica.
 * @param alChiudere chiamata alla chiusura — serve a chi lo apre da fuori
 *        dall'agenda (la scheda cliente) per rinfrescarsi dietro.
 */
async function mostraDettaglio(id, alChiudere = null) {
  const a = await store.leggiAppuntamento(id);
  if (!a) return;
  // Un impegno personale non ha cliente, servizi né WhatsApp: ha un pannello suo.
  if (store.eImpegno(a)) return dettaglioImpegno(a);
  const cliente = a.clienteId ? await store.leggiCliente(a.clienteId) : null;
  const senzaScheda = store.senzaScheda(a);
  const valuta = cfg.get('incassi').valuta;
  const d = daIsoLocale(a.inizio);
  const fine = new Date(d.getTime() + a.durata * 60000);

  let incatenato = false;   // questo pannello si sta chiudendo per aprirne un altro

  const servizi = (a.servizi || []).map(s =>
    `<div class="riga-info">
       <span class="riga-info__etichetta">${esc(s.nome)} · ${durataUmana(s.durata)}</span>
       <span class="riga-info__valore">${euro(s.prezzo, valuta)}</span>
     </div>`).join('') || '<p class="testo-tenue">Nessun servizio indicato</p>';

  const p = ui.pannello({
    titolo: store.nomeDiAppuntamento(a, cliente),
    sottotitolo: `${dataEstesa(d)} · ${ora(d)}–${ora(fine)}${a.serieId ? ' · appuntamento fisso ↻' : ''}`,
    contenuto: `
      ${senzaScheda ? `
        <div class="avviso-riquadro avviso-riquadro--attenzione">
          <span>?</span><div><strong>Fissata con il solo nome</strong>
          Non ha ancora una scheda: niente storico, niente WhatsApp. Creandola adesso,
          questo appuntamento entra subito nel suo storico.</div>
        </div>
        <button class="btn btn--principale btn--largo" data-azione="crea-scheda" style="margin:12px 0 16px">Crea la scheda di ${esc(a.clienteNome || '')}</button>` : ''}

      ${cliente && cliente.allergie ? `
        <div class="riquadro-allergie">
          <span>⚠</span><div><strong>Attenzione</strong>${esc(cliente.allergie)}</div>
        </div>` : ''}

      <div class="blocco" style="padding:16px;margin-bottom:14px">
        ${servizi}
        ${a.posaMinuti ? `<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--bordo-tenue)">
          <span class="campo__etichetta">Come si svolge</span>
          ${store.tratti(a).map(t => {
            const daO = ora(new Date(d.getTime() + t.da * 60000));
            const aO = ora(new Date(d.getTime() + t.a * 60000));
            return `<div class="riga-info" style="padding:5px 0;border:0">
              <span class="riga-info__etichetta" style="font-variant-numeric:tabular-nums">${daO} – ${aO}</span>
              <span class="riga-info__valore" style="font-weight:${t.tipo === 'attesa' ? '700' : '500'};color:${t.tipo === 'attesa' ? 'var(--oro-scuro)' : 'var(--bruno-medio)'}">
                ${t.tipo === 'attesa' ? 'posa — sei libera' : esc(t.servizio || 'lavoro')}
              </span></div>`;
          }).join('')}
        </div>` : ''}
        <div class="riga-info" style="border-top:1.5px solid var(--bordo);margin-top:6px;padding-top:11px">
          <span class="riga-info__etichetta"><strong>Totale</strong> · ${durataUmana(a.durata)}${a.posaMinuti ? ` (di cui ${a.posaMinuti}′ di posa)` : ''}</span>
          <span class="riga-info__valore" style="font-size:18px">${euro(a.prezzo, valuta)}</span>
        </div>
      </div>

      ${a.note ? `<div class="campo"><span class="campo__etichetta">Note dell'appuntamento</span><p class="testo-lungo">${esc(a.note)}</p></div>` : ''}

      ${cliente ? `
      <div class="campo" id="zona-nota-prossima">
        <span class="campo__etichetta">Per la prossima volta</span>
        ${store.notaProssimaDi(cliente) ? `
          <div class="riquadro-nota">
            <span>📌</span>
            <div style="flex:1;min-width:0">${esc(store.notaProssimaDi(cliente))}</div>
            <button class="btn btn--fantasma btn--piccolo" data-nota="fatto" type="button">Fatto</button>
          </div>
          <button class="btn btn--fantasma btn--piccolo" data-nota="cambia" type="button" style="margin-top:9px">Cambia</button>
        ` : `
          <div style="display:flex;gap:9px;align-items:flex-start">
            <input class="input" id="nota-prossima" placeholder="Es. avanza 20 euro · piega gratis" maxlength="120">
            <button class="btn btn--fantasma" data-nota="salva" type="button">Segna</button>
          </div>
          <p class="campo__aiuto">Resta attaccato a ${esc(cliente.nome)} e ricompare su tutti i suoi appuntamenti,
          finché non lo segni fatto.</p>
        `}
      </div>` : ''}

      <div class="campo">
        <span class="campo__etichetta">Stato</span>
        <div class="chip-servizi">
          ${[['previsto','Previsto'],['concluso','Concluso'],['assente','Non venuta'],['annullato','Annullato']]
            .map(([v, t]) => `<button class="chip${a.stato === v ? ' is-scelto' : ''}" data-stato="${v}" type="button">${t}</button>`).join('')}
        </div>
      </div>

      <div class="campo" ${senzaScheda ? 'hidden' : ''}>
        <span class="campo__etichetta">WhatsApp</span>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn ${a.confermaInviata ? 'btn--fantasma' : 'btn--verde'}" data-wa="conferma" type="button">
            ${a.confermaInviata ? '↻ Reinvia conferma' : '✓ Invia conferma'}
          </button>
          <button class="btn btn--fantasma" data-wa="promemoria" type="button">Invia promemoria</button>
        </div>
        ${cliente && !cliente.telefono
          ? '<p class="campo__aiuto" style="color:var(--rosso)">Questa cliente non ha un numero di telefono: aggiungilo nella sua scheda.</p>'
          : `<p class="campo__aiuto">${a.confermaInviata ? 'Conferma già inviata.' : 'Il messaggio si apre in WhatsApp già scritto: basta toccare invia.'}</p>`}
      </div>
    `,
    azioni: `
      <button class="btn btn--fantasma" data-azione="elimina" style="margin-right:auto;color:var(--rosso)">Elimina</button>
      ${(senzaScheda || alChiudere) ? '' : '<button class="btn btn--fantasma" data-azione="cliente">Scheda cliente</button>'}
      <button class="btn btn--principale" data-azione="modifica">Modifica</button>
    `,
    /* Chi ci ha aperti da fuori (la scheda cliente) vuole rinfrescarsi quando
       questo pannello si chiude — ma NON quando si chiude per aprirne un altro,
       o si troverebbe due pannelli che si accavallano. */
    alChiudere: () => { if (!incatenato && alChiudere) alChiudere(); }
  });

  p.elemento.querySelectorAll('[data-stato]').forEach(b => b.addEventListener('click', async () => {
    await store.cambiaStato(id, b.dataset.stato);
    ui.ok('Stato aggiornato');
    p.chiudi();
  }));

  p.elemento.querySelectorAll('[data-wa]').forEach(b => b.addEventListener('click', async () => {
    if (!cliente || !cliente.telefono) { ui.errore('Manca il numero di telefono della cliente'); return; }
    const tipo = b.dataset.wa;
    const testo = tipo === 'conferma' ? wa.testoConferma(cliente, a) : wa.testoPromemoria(cliente, a);
    if (wa.apri(cliente, testo)) {
      await store.segnaMessaggioInviato(id, tipo);
      ui.ok('WhatsApp aperto: tocca invia');
      p.chiudi();
    } else ui.errore('Numero non valido');
  }));

  const creaScheda = p.elemento.querySelector('[data-azione="crea-scheda"]');
  if (creaScheda) creaScheda.addEventListener('click', () => {
    incatenato = true;
    p.chiudi();
    setTimeout(() => moduloCreaScheda(a), 250);
  });

  /* Il promemoria per la prossima volta. Sta sulla cliente, non su questo
     appuntamento: se lei disdice, i 20 euro restano segnati lo stesso. */
  p.elemento.querySelectorAll('[data-nota]').forEach(b => b.addEventListener('click', async () => {
    if (!cliente) return;
    const cosa = b.dataset.nota;

    if (cosa === 'fatto') {
      await store.scriviNotaProssima(cliente.id, '');
      ui.ok('Promemoria segnato come fatto');
      p.chiudi();
      return;
    }
    if (cosa === 'cambia') {
      const testo = await ui.chiediTesto({
        titolo: 'Per la prossima volta',
        sottotitolo: `Ricomparirà su ogni appuntamento di ${cliente.nome} finché non lo segni fatto.`,
        valore: store.notaProssimaDi(cliente),
        segnaposto: 'Es. avanza 20 euro · piega gratis',
        aiuto: 'Svuota il campo e salva per toglierlo.'
      });
      if (testo === null) return;
      await store.scriviNotaProssima(cliente.id, testo);
      ui.ok(testo ? 'Promemoria aggiornato' : 'Promemoria tolto');
      p.chiudi();
      return;
    }
    const campo = p.elemento.querySelector('#nota-prossima');
    const testo = campo ? campo.value.trim() : '';
    if (!testo) { ui.errore('Scrivi cosa ricordare'); return; }
    await store.scriviNotaProssima(cliente.id, testo);
    ui.ok('Promemoria segnato');
    p.chiudi();
  }));

  p.elemento.querySelector('[data-azione="elimina"]').addEventListener('click', async () => {
    if (a.serieId) {
      const scelta = await chiediSuLaSerie(a, 'eliminare');
      if (scelta === 'annulla') return;
      if (scelta === 'tutti') {
        const quanti = await store.fermaSerie(a);
        ui.ok(`Serie fermata: ${quanti} appuntamenti tolti`);
      } else {
        await store.saltaOccorrenza(a);
        ui.ok('Appuntamento eliminato, la serie continua');
      }
      p.chiudi();
      return;
    }
    const sicuro = await ui.conferma({
      titolo: 'Eliminare l\'appuntamento?',
      testo: 'L\'appuntamento sparisce dall\'agenda e dallo storico della cliente. L\'operazione non si può annullare.',
      confermaTesto: 'Elimina', pericolo: true
    });
    if (sicuro) { await store.eliminaAppuntamento(id); ui.ok('Appuntamento eliminato'); p.chiudi(); }
  });

  const vaiAllaScheda = p.elemento.querySelector('[data-azione="cliente"]');
  if (vaiAllaScheda) vaiAllaScheda.addEventListener('click', () => {
    incatenato = true;
    p.chiudi();
    if (cliente) setTimeout(() => apriCliente(cliente.id), 260);
  });

  p.elemento.querySelector('[data-azione="modifica"]').addEventListener('click', async () => {
    if (a.serieId) {
      const scelta = await chiediSuLaSerie(a, 'spostare');
      if (scelta === 'annulla') return;
      if (scelta === 'tutti') {
        incatenato = true;
        p.chiudi();
        setTimeout(() => moduloSpostaSerie(a), 250);
        return;
      }
    }
    incatenato = true;
    p.chiudi();
    setTimeout(() => apriNuovo({ appuntamento: a }), 260);
  });
}

/* =========================================================================
   IMPEGNI PERSONALI
   Il dentista, una consegna, un'ora da tenersi libera. Occupano lo spazio
   come un appuntamento — l'app non propone quell'orario e avvisa se ci si
   fissa sopra — ma non sono clienti e non entrano negli incassi.
   ========================================================================= */

const DURATE_IMPEGNO = [15, 30, 45, 60, 90, 120, 180];

function moduloImpegno({ data = new Date(), impegno = null } = {}) {
  const modifica = !!impegno;
  const giorno = impegno ? impegno.giorno : dayKey(data);
  const oraIniziale = impegno ? impegno.inizio.slice(11) : ora(new Date());
  const durataIniziale = impegno ? impegno.durata : 60;

  const p = ui.pannello({
    titolo: modifica ? 'Modifica impegno' : 'Nuovo impegno',
    sottotitolo: 'Un tuo impegno personale: occupa lo spazio in agenda, ma non è una cliente.',
    contenuto: `
      <div class="campo">
        <label class="campo__etichetta" for="im-titolo">Cos'è</label>
        <input class="input" id="im-titolo" maxlength="80" data-fuoco
               value="${esc(impegno ? (impegno.titolo || '') : '')}"
               placeholder="Dentista · consegna · pausa">
      </div>
      <div class="riga-campi">
        <div class="campo">
          <label class="campo__etichetta" for="im-giorno">Giorno</label>
          <input class="input" id="im-giorno" type="date" value="${esc(giorno)}">
        </div>
        <div class="campo">
          <label class="campo__etichetta" for="im-ora">Ora</label>
          ${ui.campoOra('im-ora', oraIniziale)}
        </div>
      </div>
      <div class="campo" style="margin-bottom:0">
        <span class="campo__etichetta">Quanto dura</span>
        <div class="chip-servizi" id="im-durate">
          ${DURATE_IMPEGNO.map(m => `<button class="chip${m === durataIniziale ? ' is-scelto' : ''}"
             data-durata="${m}" type="button">${durataUmana(m)}</button>`).join('')}
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:11px">
          <span class="testo-tenue">oppure</span>
          <input class="input" id="im-durata" type="number" min="5" step="5" inputmode="numeric"
                 style="max-width:110px" value="${durataIniziale}">
          <span class="testo-tenue">minuti</span>
        </div>
      </div>`,
    azioni: `<button class="btn btn--fantasma" data-x="no">Annulla</button>
             <button class="btn btn--principale" data-x="si">${modifica ? 'Salva' : 'Segna l\'impegno'}</button>`
  });

  ui.legaCampiOra(p.elemento);
  const campoDurata = p.elemento.querySelector('#im-durata');

  ui.su(p.elemento, 'click', '[data-durata]', (e, el) => {
    campoDurata.value = el.dataset.durata;
    p.elemento.querySelectorAll('[data-durata]').forEach(b =>
      b.classList.toggle('is-scelto', b === el));
  });
  campoDurata.addEventListener('input', () => {
    p.elemento.querySelectorAll('[data-durata]').forEach(b =>
      b.classList.toggle('is-scelto', Number(b.dataset.durata) === Number(campoDurata.value)));
  });

  p.elemento.querySelector('[data-x="no"]').addEventListener('click', () => p.chiudi());
  p.elemento.querySelector('[data-x="si"]').addEventListener('click', async () => {
    const titolo = p.elemento.querySelector('#im-titolo').value.trim();
    const g = p.elemento.querySelector('#im-giorno').value;
    const oraScritta = ui.normalizzaOra(p.elemento.querySelector('#im-ora').value);
    const durata = Math.max(5, Number(campoDurata.value) || 60);

    if (!titolo) { ui.errore('Scrivi cos\'è: «dentista», «consegna»…'); return; }
    if (!g) { ui.errore('Scegli il giorno'); return; }
    if (!oraScritta) { ui.errore('Scrivi un orario, per esempio 15:00'); return; }

    await store.salvaAppuntamento({
      id: impegno ? impegno.id : undefined,
      creatoIl: impegno ? impegno.creatoIl : undefined,
      tipo: 'impegno',
      titolo,
      inizio: `${g}T${oraScritta}`,
      durata,
      prezzo: 0,
      servizi: []
    });
    ui.ok(modifica ? 'Impegno aggiornato' : 'Impegno segnato');
    p.chiudi();
    vaiA(fromDayKey(g));
  });
}

function dettaglioImpegno(a) {
  const d = daIsoLocale(a.inizio);
  const fine = new Date(d.getTime() + a.durata * 60000);
  const p = ui.pannello({
    titolo: a.titolo || 'Impegno',
    sottotitolo: `${dataEstesa(d)} · ${ora(d)}–${ora(fine)} · ${durataUmana(a.durata)}`,
    contenuto: `
      <div class="avviso-riquadro avviso-riquadro--info">
        <span>◆</span><div><strong>Impegno personale</strong>
        Occupa lo spazio come un appuntamento: l'app non propone quest'ora fra quelle libere
        e ti avvisa se ci fissi sopra una cliente. Non entra negli incassi.</div>
      </div>`,
    azioni: `
      <button class="btn btn--fantasma" data-x="elimina" style="margin-right:auto;color:var(--rosso)">Elimina</button>
      <button class="btn btn--principale" data-x="modifica">Modifica</button>`
  });
  p.elemento.querySelector('[data-x="elimina"]').addEventListener('click', async () => {
    const sicuro = await ui.conferma({
      titolo: 'Togliere l\'impegno?',
      testo: 'Sparisce dall\'agenda e quell\'ora torna libera.',
      confermaTesto: 'Togli', pericolo: true
    });
    if (sicuro) { await store.eliminaAppuntamento(a.id); ui.ok('Impegno tolto'); p.chiudi(); }
  });
  p.elemento.querySelector('[data-x="modifica"]').addEventListener('click', () => {
    p.chiudi();
    setTimeout(() => moduloImpegno({ impegno: a }), 250);
  });
}

/* ---------- lente: trova una scheda senza uscire dal calendario ---------- */

function apriRicercaScheda() {
  const p = ui.pannello({
    titolo: 'Cerca una cliente',
    sottotitolo: 'Bastano le prime lettere del nome, o parte del numero.',
    contenuto: `
      <div class="ricerca-avvolgi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="input" id="lente-testo" type="search" placeholder="Nome o numero…" autocomplete="off" data-fuoco>
      </div>
      <div class="risultati-clienti" id="lente-risultati" style="border-top:0;margin-top:10px;border-radius:var(--raggio-s);max-height:46vh"></div>`
  });

  const campo = p.elemento.querySelector('#lente-testo');
  const risultati = p.elemento.querySelector('#lente-risultati');

  const cerca = async () => {
    const trovate = await store.cercaClienti(campo.value, 30);
    if (!trovate.length) {
      risultati.innerHTML = `<div style="padding:20px;text-align:center" class="testo-tenue">
        ${campo.value.trim() ? 'Nessuna cliente con questo nome.' : 'Scrivi qualcosa per cercare.'}</div>`;
      return;
    }
    const righe = [];
    for (const c of trovate) {
      const s = await store.storicoCliente(c.id);
      const prossimo = s.prossimo
        ? `<span class="pillola pillola--oro">${esc(dataBreve(daIsoLocale(s.prossimo.inizio)))} · ${esc(s.prossimo.inizio.slice(11))}</span>`
        : '';
      righe.push(`
        <div class="riga-cliente" data-id="${esc(c.id)}">
          <div class="pastiglia">${esc(iniziali(c.nome, c.cognome))}</div>
          <div style="min-width:0;flex:1">
            <div class="riga-cliente__nome">${esc(nomeCompleto(c))}</div>
            <div class="riga-cliente__dettaglio">
              ${c.telefono ? esc(telefonoLeggibile(c.telefono)) : 'senza numero'} ·
              ${s.visite} ${s.visite === 1 ? 'visita' : 'visite'}
              ${c.allergie ? ' · <span style="color:var(--rosso)">⚠ allergie</span>' : ''}
            </div>
          </div>
          <div class="riga-cliente__coda">${prossimo}</div>
        </div>`);
    }
    risultati.innerHTML = righe.join('');
  };

  campo.addEventListener('input', debounce(cerca, 130));
  campo.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const prima = risultati.querySelector('.riga-cliente');
      if (prima) prima.click();
    }
  });
  ui.su(risultati, 'click', '.riga-cliente', (e, el) => {
    const id = el.dataset.id;
    p.chiudi();
    setTimeout(() => apriCliente(id), 240);
  });
  cerca();
}

/* =========================================================================
   APPUNTAMENTI FISSI: solo questo, o tutti?
   ========================================================================= */

function chiediSuLaSerie(appuntamento, verbo) {
  return new Promise((risolvi) => {
    let deciso = false;
    const p = ui.pannello({
      titolo: `Vuoi ${verbo} solo questo, o tutti?`,
      sottotitolo: 'Questo appuntamento fa parte di una serie fissa.',
      contenuto: `<p class="testo-lungo">
        ${esc(dataEstesa(daIsoLocale(appuntamento.inizio)))} alle ${esc(appuntamento.inizio.slice(11))}.<br><br>
        Scegliendo <strong>solo questo</strong>, la serie continua normalmente nelle settimane successive.
      </p>`,
      azioni: `
        <button class="btn btn--fantasma" data-s="annulla">Annulla</button>
        <button class="btn btn--fantasma" data-s="tutti">Tutti da qui in avanti</button>
        <button class="btn btn--principale" data-s="questo" data-fuoco>Solo questo</button>`,
      alChiudere: () => { if (!deciso) risolvi('annulla'); }
    });
    p.elemento.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
      deciso = true; risolvi(b.dataset.s); p.chiudi();
    }));
  });
}

/** Sposta l'orario, o cambia la cadenza, di tutte le occorrenze future. */
function moduloSpostaSerie(appuntamento) {
  const p = ui.pannello({
    titolo: 'Sposta tutta la serie',
    sottotitolo: 'Vale per questo appuntamento e per tutti quelli successivi.',
    contenuto: `
      <div class="campo">
        <label class="campo__etichetta" for="ss-ora">Nuovo orario</label>
        ${ui.campoOra('ss-ora', appuntamento.inizio.slice(11), { stile: 'max-width:180px' })}
        <p class="campo__aiuto">Il giorno della settimana e la cadenza si cambiano dall'ingranaggio della scheda cliente.</p>
      </div>`,
    azioni: `<button class="btn btn--fantasma" data-x="no">Annulla</button>
             <button class="btn btn--principale" data-x="si">Sposta tutti</button>`
  });
  ui.legaCampiOra(p.elemento);
  p.elemento.querySelector('[data-x="no"]').addEventListener('click', () => p.chiudi());
  p.elemento.querySelector('[data-x="si"]').addEventListener('click', async () => {
    const ora = ui.normalizzaOra(p.elemento.querySelector('#ss-ora').value);
    if (!ora) { ui.errore('Scrivi un orario, per esempio 15:00'); return; }
    const quanti = await store.spostaSerie(appuntamento, { ora });
    ui.ok(`${quanti} appuntamenti spostati alle ${ora}`);
    p.chiudi();
  });
}

/* =========================================================================
   CREARE LA SCHEDA A CHI ERA STATA FISSATA CON IL SOLO NOME
   ========================================================================= */

function moduloCreaScheda(appuntamento) {
  const parti = (appuntamento.clienteNome || '').trim().split(/\s+/);
  const p = ui.pannello({
    titolo: 'Crea la scheda',
    sottotitolo: 'Questo appuntamento e tutti quelli con lo stesso nome finiranno nel suo storico.',
    contenuto: `
      <div class="riga-campi">
        <div class="campo">
          <label class="campo__etichetta" for="cs-nome">Nome</label>
          <input class="input" id="cs-nome" value="${esc(parti[0] || '')}" data-fuoco autocomplete="off">
        </div>
        <div class="campo">
          <label class="campo__etichetta" for="cs-cognome">Cognome</label>
          <input class="input" id="cs-cognome" value="${esc(parti.slice(1).join(' '))}" autocomplete="off">
        </div>
      </div>
      <div class="campo">
        <label class="campo__etichetta" for="cs-tel">Telefono</label>
        <input class="input" id="cs-tel" type="tel" inputmode="tel" placeholder="333 123 4567" autocomplete="off">
      </div>
      <div class="campo" style="margin-bottom:0">
        <label class="campo__etichetta" for="cs-allergie">Allergie e sensibilità</label>
        <textarea class="area" id="cs-allergie" style="min-height:64px" placeholder="Se ce ne sono, compaiono in rosso su ogni appuntamento"></textarea>
      </div>`,
    azioni: `<button class="btn btn--fantasma" data-x="no">Annulla</button>
             <button class="btn btn--principale" data-x="si">Crea la scheda</button>`
  });

  p.elemento.querySelector('[data-x="no"]').addEventListener('click', () => p.chiudi());
  p.elemento.querySelector('[data-x="si"]').addEventListener('click', async () => {
    const nome = p.elemento.querySelector('#cs-nome').value.trim();
    if (!nome) { ui.errore('Il nome è obbligatorio'); return; }
    const esito = await store.creaSchedaDaAppuntamento(appuntamento.id, {
      nome,
      cognome: p.elemento.querySelector('#cs-cognome').value.trim(),
      telefono: p.elemento.querySelector('#cs-tel').value.trim(),
      allergie: p.elemento.querySelector('#cs-allergie').value.trim()
    });
    p.chiudi();
    if (esito) {
      ui.ok(esito.agganciati > 1
        ? `Scheda creata, con ${esito.agganciati} appuntamenti nello storico`
        : 'Scheda creata');

/** Prova a riconoscere i servizi dal testo libero scritto da Claude. */
async function riconosciServizi(testo) {
  if (!testo) return { trovati: [], nonCapiti: [] };
  const tutti = await store.elencoServizi({ soloAttivi: true });
  const pezzi = String(testo).split(/,| e | \+ |\+/i).map(x => x.trim()).filter(Boolean);
  const trovati = [], nonCapiti = [];
  for (const pezzo of pezzi) {
    const q = pezzo.toLowerCase();
    const s = tutti.find(x => x.nome.toLowerCase() === q)
           || tutti.find(x => x.nome.toLowerCase().includes(q) || q.includes(x.nome.toLowerCase()));
    if (s && !trovati.some(t => t.id === s.id)) trovati.push(s); else if (!s) nonCapiti.push(pezzo);
  }
  return { trovati, nonCapiti };
}

async function pannelloProposte() {
  const elenco = ponte.proposte();
  const valuta = cfg.get('incassi').valuta;

  if (!elenco.length) {
    ui.avviso('Nessuna richiesta in attesa');
    return;
  }

  const pezzi = [];
  for (const p of elenco) {
    if (p.tipo === 'nota') {
      pezzi.push(`
        <div class="carta-proposta" data-proposta="${esc(p.id)}">
          <div style="display:flex;gap:11px;align-items:flex-start">
            <span style="font-size:19px">📝</span>
            <div style="flex:1;min-width:0">
              <div class="testo-tenue" style="margin-bottom:3px">Promemoria</div>
              <div style="font-size:15.5px;line-height:1.5">${esc(p.testo)}</div>
            </div>
          </div>
          <div class="carta-proposta__azioni">
            <button class="btn btn--principale btn--piccolo" data-azione="fatto" data-id="${esc(p.id)}">Ho letto</button>
          </div>
        </div>`);
      continue;
    }

    const { trovati, nonCapiti } = await riconosciServizi(p.servizi);
    const durata = trovati.reduce((t, s) => t + s.durata, 0);
    const prezzo = trovati.reduce((t, s) => t + s.prezzo, 0);
    const clienti = await store.cercaClienti(p.cliente, 3);
    const esatta = clienti.find(c => nomeCompleto(c).toLowerCase() === String(p.cliente).toLowerCase()) || clienti[0] || null;

    pezzi.push(`
      <div class="carta-proposta" data-proposta="${esc(p.id)}">
        <div class="carta-proposta__quando">${esc(dataEstesa(fromDayKey(p.giorno)))} alle ${esc(p.ora)}</div>
        <div style="font-size:16.5px;font-weight:700;margin-top:3px">${esc(p.cliente)}</div>
        <div class="testo-tenue" style="margin-top:2px">
          ${trovati.length
            ? esc(trovati.map(s => s.nome).join(', ')) + ` · ${durataUmana(durata)} · ${euro(prezzo, valuta)}`
            : (p.servizi ? esc(p.servizi) : 'nessun servizio indicato')}
        </div>
        ${esatta
          ? `<div class="testo-tenue" style="margin-top:6px">✓ corrisponde a <strong>${esc(nomeCompleto(esatta))}</strong> in scheda</div>`
          : `<div class="testo-tenue" style="margin-top:6px">⚠ nessuna scheda con questo nome: verrà fissata con il solo nome</div>`}
        ${nonCapiti.length ? `<div class="testo-tenue" style="margin-top:4px">⚠ non ho riconosciuto: ${esc(nonCapiti.join(', '))}</div>` : ''}
        ${p.note ? `<div class="testo-tenue" style="margin-top:6px">Nota: ${esc(p.note)}</div>` : ''}
        ${(p.avvisi && p.avvisi.length)
          ? `<div class="avviso-riquadro" style="margin-top:10px"><span>⚠</span><div>${esc(p.avvisi.join('; '))}</div></div>`
          : ''}
        <div class="carta-proposta__azioni">
          <button class="btn btn--verde btn--piccolo" data-azione="conferma" data-id="${esc(p.id)}">Conferma</button>
          <button class="btn btn--fantasma btn--piccolo" data-azione="modifica" data-id="${esc(p.id)}">Apri e sistema</button>
          <button class="btn btn--fantasma btn--piccolo" data-azione="scarta" data-id="${esc(p.id)}" style="color:var(--rosso);margin-left:auto">Scarta</button>
        </div>
      </div>`);
  }

  const p = ui.pannello({
    titolo: 'Richieste in attesa',
    sottotitolo: 'Arrivate da Claude. Diventano appuntamenti solo se le confermi.',
    ampio: true,
    contenuto: pezzi.join('')
  });

  const proposta = (id) => ponte.proposte().find(x => x.id === id);

  async function creaDaProposta(dati, apriPerModifica) {
    const { trovati } = await riconosciServizi(dati.servizi);
    const clienti = await store.cercaClienti(dati.cliente, 3);
    const cliente = clienti.find(c => nomeCompleto(c).toLowerCase() === String(dati.cliente).toLowerCase()) || clienti[0] || null;

    if (apriPerModifica) {
      p.chiudi();
      setTimeout(() => apriNuovo({
        data: fromDayKey(dati.giorno),
        oraSuggerita: dati.ora,
        cliente,
        serviziIniziali: trovati.map(s => ({ servizioId: s.id, nome: s.nome, durata: s.durata, prezzo: s.prezzo, posaMinuti: s.posaMinuti }))
      }), 250);
      return true;
    }

    const servizi = trovati.map(s => {
      const t = store.tariffaPerCliente(cliente, s);
      return { servizioId: s.id, nome: s.nome, durata: t.durata, prezzo: t.prezzo, posaMinuti: t.posaMinuti };
    });
    await store.salvaAppuntamento({
      clienteId: cliente ? cliente.id : null,
      clienteNome: cliente ? null : dati.cliente,
      inizio: `${dati.giorno}T${dati.ora}`,
      servizi,
      note: [dati.note, dati.servizi && !trovati.length ? `richiesto: ${dati.servizi}` : '']
        .filter(Boolean).join(' · ')
    });
    return true;
  }

  ui.su(p.elemento, 'click', '[data-azione]', async (e, el) => {
    const id = el.dataset.id;
    const dati = proposta(id);
    if (!dati) return;
    el.disabled = true;

    if (el.dataset.azione === 'scarta' || el.dataset.azione === 'fatto') {
      await ponte.chiudiProposta(id, el.dataset.azione === 'fatto' ? 'letta' : 'scartata');
      ui.avviso(el.dataset.azione === 'fatto' ? 'Promemoria archiviato' : 'Richiesta scartata');
    } else if (el.dataset.azione === 'modifica') {
      await creaDaProposta(dati, true);
      await ponte.chiudiProposta(id, 'aperta');
      return;
    } else {
      await creaDaProposta(dati, false);
      await ponte.chiudiProposta(id, 'accettata');
      ui.ok(`Appuntamento fissato per ${dati.cliente}`);
    }

    const carta = p.elemento.querySelector(`[data-proposta="${id}"]`);
    if (carta) carta.remove();
    if (!p.elemento.querySelectorAll('[data-proposta]').length) p.chiudi();
  });
}

return { aggiornaOraAdesso, apriRicercaScheda, dataVisualizzata, disegna, inizializza, moduloImpegno, mostraDettaglio, pannelloProposte, vaiA };
})();

  ui.su(p.elemento, 'click', '[data-visita]', (e, el) => {

     il calendario era vuoto, non solo a riempirlo. */
  const propaga = p.elemento.querySelector('[data-x="propaga"]');
  if (propaga) propaga.addEventListener('click', async () => {
    propaga.disabled = true;
    propaga.textContent = 'Propago…';
    let esito;
    try {
      esito = await store.generaOccorrenze(c);
    } catch (errore) {
      ui.errore('Non sono riuscito a propagare: ' + (errore.message || 'errore sconosciuto'));
      propaga.disabled = false; propaga.textContent = 'Propaga app. fissi';
      return;
    }

    const dopo = await store.occorrenzeSerie(c.ricorrenza.serieId);
    const fino = dopo.length ? dataBreve(fromDayKey(dopo[dopo.length - 1].giorno)) : null;
    const saltate = (c.ricorrenza.saltate || []).length;

    const righe = [];
    // Attenzione: .testo-lungo conserva gli a capo, quindi niente rientri qui dentro.
    const coperta = dopo.length
      ? `Ci sono ${dopo.length} appuntamenti in agenda, fino al ${esc(fino)}.`
      : 'Non c\'è nessuna occorrenza da creare da qui in avanti.';
    righe.push(esito.create
      ? `<p class="testo-lungo"><strong>${esito.create} ${esito.create === 1 ? 'appuntamento creato' : 'appuntamenti creati'}.</strong> Adesso ${esc(nomeCompleto(c))} è coperta fino al ${esc(fino)}.</p>`
      : `<p class="testo-lungo"><strong>Era già tutto a posto.</strong> ${coperta}</p>`);

    if (esito.saltatePerChiusura && esito.saltatePerChiusura.length) {
      righe.push(`<div class="avviso-riquadro avviso-riquadro--info" style="margin-top:12px">
        <span>🔒</span><div><strong>Saltati i giorni di chiusura</strong>
        ${esito.saltatePerChiusura.map(x => esc(dataBreve(fromDayKey(x.giorno || x)))).join(' · ')}</div></div>`);
    }
    if (esito.conflitti && esito.conflitti.length) {
      righe.push(`<div class="avviso-riquadro" style="margin-top:12px">
        <span>⚠</span><div><strong>Qualcuno si sovrappone</strong>
        ${esito.conflitti.length} ${esito.conflitti.length === 1 ? 'volta cade' : 'volte cadono'} sopra un altro appuntamento.
        Sono stati creati lo stesso: li vedi affiancati in agenda e decidi tu.</div></div>`);
    }
    if (saltate) {
      righe.push(`<p class="campo__aiuto" style="margin-top:12px">${saltate} ${saltate === 1 ? 'volta era stata cancellata' : 'volte erano state cancellate'} a mano con «solo questo»: quelle non tornano, altrimenti il tasto rimetterebbe in agenda proprio ciò che avevi tolto. Se ne servisse una, rifissala a mano.</p>`);
    }

    const riepilogo = ui.pannello({
      titolo: 'Appuntamenti fissi propagati',
      sottotitolo: nomeCompleto(c),
      contenuto: righe.join(''),
      azioni: '<button class="btn btn--principale" data-x="ok">Ho capito</button>'
    });
    riepilogo.elemento.querySelector('[data-x="ok"]').addEventListener('click', () => {
      riepilogo.chiudi();
      p.chiudi();
      setTimeout(() => scheda(id), 260);
    });
  });

  p.elemento.querySelector('[data-x="appuntamento"]').addEventListener('click', () => {
    p.chiudi();
    setTimeout(() => apriNuovoAppuntamento({ cliente: c }), 250);
  });

  p.elemento.querySelector('[data-x="modifica"]').addEventListener('click', () => {
    p.chiudi();
    setTimeout(() => modulo(c), 250);
  });

  const btnWa = p.elemento.querySelector('[data-x="whatsapp"]');
  if (btnWa) btnWa.addEventListener('click', () => {
    const link = wa.linkWhatsApp(c.telefono, '');
    if (link) window.open(link, '_blank', 'noopener'); else ui.errore('Numero non valido');
  });

  p.elemento.querySelector('[data-x="elimina"]').addEventListener('click', async () => {
    const sicuro = await ui.conferma({
      titolo: `Eliminare ${nomeCompleto(c)}?`,
      testo: `Verranno eliminati anche i suoi ${s.tutti.length} appuntamenti e tutto lo storico. L'operazione non si può annullare.`,
      confermaTesto: 'Elimina definitivamente', pericolo: true
    });
    if (!sicuro) return;
    await store.eliminaCliente(id);
    ui.ok('Cliente eliminata');
    p.chiudi();
    document.dispatchEvent(new CustomEvent('dati:cambiati'));
  });
}

      <div class="riga-campi">

          <label class="campo__etichetta" for="f-nome">Nome</label>

        <div class="campo">
          <label class="campo__etichetta" for="f-cognome">Cognome</label>
          <input class="input" id="f-cognome" value="${esc(c.cognome)}" autocomplete="off">
        </div>
      </div>
      <div class="riga-campi">
        <div class="campo">
          <label class="campo__etichetta" for="f-tel">Telefono</label>
          <input class="input" id="f-tel" type="tel" inputmode="tel" value="${esc(c.telefono)}" placeholder="333 123 4567" autocomplete="off">
        </div>
        <div class="campo">
          <label class="campo__etichetta" for="f-email">Email <span style="text-transform:none;font-weight:500">(facoltativa)</span></label>
          <input class="input" id="f-email" type="email" value="${esc(c.email || '')}" autocomplete="off">

      </div>
      <div class="campo">
        <label class="campo__etichetta" for="f-allergie">Allergie e sensibilità</label>

        <p class="campo__aiuto">Se compilato, compare in rosso in cima alla sua scheda e su ogni appuntamento.</p>
      </div>
      <div class="campo">
        <label class="campo__etichetta" for="f-note">Note</label>

      </div>

        <input type="checkbox" id="f-prom" ${c.promemoriaAttivo ? 'checked' : ''}>
        <span class="interruttore__leva"></span>
        <span class="interruttore__testo">Promemoria WhatsApp il giorno prima
          <small>Se spento, questa cliente non comparirà nella lista dei promemoria da inviare</small></span>
      </label>
    `,
    azioni: `<button class="btn btn--fantasma" data-x="no">Annulla</button>
             <button class="btn btn--principale" data-x="si">${nuova ? 'Crea cliente' : 'Salva'}</button>`
  });

  p.elemento.querySelector('[data-x="no"]').addEventListener('click', () => p.chiudi());
  p.elemento.querySelector('[data-x="si"]').addEventListener('click', async () => {
    const nome = p.elemento.querySelector('#f-nome').value.trim();
    if (!nome) { ui.errore('Il nome è obbligatorio'); return; }
    await store.salvaCliente({
      id: cliente ? cliente.id : undefined,
      creatoIl: cliente ? cliente.creatoIl : undefined,
      nome,
      cognome: p.elemento.querySelector('#f-cognome').value.trim(),
      telefono: p.elemento.querySelector('#f-tel').value.trim(),
      email: p.elemento.querySelector('#f-email').value.trim(),
      allergie: p.elemento.querySelector('#f-allergie').value.trim(),
      note: p.elemento.querySelector('#f-note').value.trim(),
      promemoriaAttivo: p.elemento.querySelector('#f-prom').checked
    });
    ui.ok(nuova ? 'Cliente aggiunta' : 'Modifiche salvate');
    p.chiudi();
    document.dispatchEvent(new CustomEvent('dati:cambiati'));
  });
}

/* =========================================================================
   IL PANNELLINO DI UNA VISITA
   Toccando una riga dello storico: la nota di quella volta, e il pulsante
   per rifissare gli stessi servizi. Le due cose nello stesso gesto.
   ========================================================================= */

function pannelloVisita(appuntamento, cliente, alChiudere) {
  const valuta = cfg.get('incassi').valuta;
  const d = daIsoLocale(appuntamento.inizio);
  // Confronto fra due orari locali: toISOString() avrebbe dato l'ora di
  // Greenwich, due ore indietro d'estate, e per due ore un appuntamento
  // appena passato sarebbe sembrato ancora da fare.
  const passato = appuntamento.inizio < isoLocale(new Date());
  const servizi = (appuntamento.servizi || []).map(x => x.nome).join(', ') || 'Appuntamento';

  const p = ui.pannello({
    titolo: dataEstesa(d),
    sottotitolo: `${oraDi(d)} · ${servizi} · ${euro(appuntamento.prezzo, valuta)}`,
    contenuto: `
      ${appuntamento.serieId ? `<div class="avviso-riquadro avviso-riquadro--info" style="margin-bottom:14px">
        <span>↻</span><div><strong>Appuntamento fisso</strong>
        Fa parte di una serie. Le modifiche alla serie si fanno dall'ingranaggio della scheda.</div></div>` : ''}

      <div class="campo">
        <label class="campo__etichetta" for="v-nota">Com'è andata</label>
        <textarea class="area" id="v-nota" data-fuoco
          placeholder="Es. schiarito troppo sulle punte · vuole provare più corto · ha portato una foto">${esc(appuntamento.note || '')}</textarea>
        <p class="campo__aiuto">Resta agganciata a questa data. La rileggi la prossima volta che viene.</p>
      </div>

      <div class="campo" style="margin-bottom:0">
        <span class="campo__etichetta">Dettaglio</span>
        ${(appuntamento.servizi || []).map(x => `
          <div class="riga-info">
            <span class="riga-info__etichetta">${esc(x.nome)} · ${durataUmana(x.durata)}${x.posaMinuti ? ` (${x.posaMinuti}′ di posa)` : ''}</span>
            <span class="riga-info__valore">${euro(x.prezzo, valuta)}</span>
          </div>`).join('') || '<p class="testo-tenue">Nessun servizio registrato.</p>'}
      </div>
    `,
    azioni: `
      <button class="btn btn--fantasma" data-x="chiudi">Chiudi</button>
      ${passato ? '<button class="btn btn--principale" data-x="ripeti">Ripeti questo appuntamento</button>' : ''}
    `
  });

  const salvaNota = async () => {
    const nota = p.elemento.querySelector('#v-nota').value.trim();
    if (nota === (appuntamento.note || '')) return false;
    await store.salvaAppuntamento({ ...appuntamento, note: nota });
    return true;
  };

  p.elemento.querySelector('[data-x="chiudi"]').addEventListener('click', async () => {
    const cambiata = await salvaNota();
    p.chiudi();
    if (cambiata) { ui.ok('Nota salvata'); if (alChiudere) alChiudere(); }
  });

  const ripeti = p.elemento.querySelector('[data-x="ripeti"]');
  if (ripeti) ripeti.addEventListener('click', async () => {
    await salvaNota();
    p.chiudi();
    setTimeout(() => apriNuovoAppuntamento({
      cliente,
      serviziIniziali: appuntamento.servizi || []
    }), 250);
  });
}

/* =========================================================================
   L'INGRANAGGIO
   Le cose che si impostano una volta e non si toccano più: appuntamento
   fisso, servizi abituali, prezzi suoi, promemoria.
   ========================================================================= */

const GIORNI_SETTIMANA = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

const CADENZE = [
  { giorni: 7,  etichetta: 'ogni settimana' },
  { giorni: 14, etichetta: 'ogni 2 settimane' },
  { giorni: 21, etichetta: 'ogni 3 settimane' },
  { giorni: 28, etichetta: 'ogni 4 settimane' }
];

async function pannelloImpostazioni(cliente, alChiudere) {
  const valuta = cfg.get('incassi').valuta;
  const servizi = await store.elencoServizi({ soloAttivi: true });
  const r = { ...store.ricorrenzaVuota(), ...(cliente.ricorrenza || {}) };
  const abituali = new Set(cliente.serviziAbituali || []);
  const prezzi = { ...(cliente.prezzi || {}) };

  if (!r.dataInizio) r.dataInizio = store.primaDataPerGiorno(new Date().getDay());

  const p = ui.pannello({
    titolo: `Impostazioni di ${nomeCompleto(cliente)}`,
    sottotitolo: 'Si impostano una volta e restano. Non servono nell\'uso di tutti i giorni.',
    ampio: true,
    contenuto: '<div id="ing"></div>',
    azioni: `<button class="btn btn--fantasma" data-x="annulla">Annulla</button>
             <button class="btn btn--principale" data-x="salva">Salva</button>`
  });

  const radice = p.elemento.querySelector('#ing');

  function disegna() {
    const giornoAttuale = fromDayKey(r.dataInizio).getDay();
    const cadenzaNota = CADENZE.some(c => c.giorni === Number(r.cadenzaGiorni)) ? '' : 'libera';

    radice.innerHTML = `
      <!-- ---------- appuntamento fisso ---------- -->
      <div class="blocco" style="max-width:none">
        <h3 class="blocco__titolo">↻ Appuntamento fisso</h3>
        <p class="blocco__nota">Per chi viene sempre lo stesso giorno alla stessa ora.
        L'app tiene coperti tre mesi in avanti e li rinnova da sola: non finiscono mai.</p>

        <label class="interruttore">
          <input type="checkbox" id="r-attiva" ${r.attiva ? 'checked' : ''}>
          <span class="interruttore__leva"></span>
          <span class="interruttore__testo">Attivo</span>
        </label>

        <div id="r-dettagli" style="${r.attiva ? '' : 'display:none'};padding-top:10px">
          <div class="riga-campi--tre riga-campi">
            <div class="campo">
              <label class="campo__etichetta" for="r-giorno">Giorno</label>
              <select class="scelta" id="r-giorno">
                ${GIORNI_SETTIMANA.map((g, i) => `<option value="${i}" ${i === giornoAttuale ? 'selected' : ''}>${g}</option>`).join('')}
              </select>
            </div>
            <div class="campo">
              <label class="campo__etichetta" for="r-ora">Ora</label>
              ${ui.campoOra('r-ora', r.ora)}
            </div>
            <div class="campo">
              <label class="campo__etichetta" for="r-cadenza">Ogni quanto</label>
              <select class="scelta" id="r-cadenza">
                ${CADENZE.map(c => `<option value="${c.giorni}" ${Number(r.cadenzaGiorni) === c.giorni ? 'selected' : ''}>${c.etichetta}</option>`).join('')}
                <option value="libera" ${cadenzaNota ? 'selected' : ''}>ogni tot giorni…</option>
              </select>
            </div>
          </div>

          <div class="campo" id="r-libera-avvolgi" style="${cadenzaNota ? '' : 'display:none'}">
            <label class="campo__etichetta" for="r-giorni">Ogni quanti giorni</label>
            <input class="input" id="r-giorni" type="number" min="1" max="180" value="${esc(r.cadenzaGiorni)}" style="max-width:160px">
          </div>

          <div class="campo">
            <span class="campo__etichetta">Servizi da mettere ogni volta</span>
            <div class="chip-servizi">
              ${servizi.map(s => {
                const t = store.tariffaPerCliente(cliente, s);
                const scelto = (r.serviziIds || []).includes(s.id);
                return `<button class="chip${scelto ? ' is-scelto' : ''}" data-rserv="${esc(s.id)}" type="button">
                  ${esc(s.nome)}<span class="chip__meta">${t.durata}′ · ${euro(t.prezzo, valuta)}</span>
                </button>`;
              }).join('')}
            </div>
          </div>

          <div id="r-anteprima"></div>
        </div>
      </div>

      <!-- ---------- servizi abituali ---------- -->
      <div class="blocco" style="max-width:none">
        <h3 class="blocco__titolo">★ I soliti</h3>
        <p class="blocco__nota">Due o tre servizi che fa sempre. Nella schermata di inserimento
        compare un pulsante che li carica tutti insieme, in un tocco.</p>
        <div class="chip-servizi">
          ${servizi.map(s => {
            const t = store.tariffaPerCliente(cliente, s);
            return `<button class="chip${abituali.has(s.id) ? ' is-scelto' : ''}" data-abit="${esc(s.id)}" type="button">
              ${esc(s.nome)}<span class="chip__meta">${t.durata}′ · ${euro(t.prezzo, valuta)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>

      <!-- ---------- prezzi personalizzati ---------- -->
      <div class="blocco" style="max-width:none">
        <h3 class="blocco__titolo">✱ Prezzi e tempi suoi</h3>
        <p class="blocco__nota">Valgono <strong>sempre</strong> per questa cliente, anche scegliendo il servizio
        dal listino normale. Un aumento generale del listino non li tocca.</p>
        <div id="p-elenco"></div>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">
          <div class="campo" style="margin:0;flex:1;min-width:200px">
            <label class="campo__etichetta" for="p-nuovo">Aggiungi un servizio</label>
            <select class="scelta" id="p-nuovo">
              <option value="">scegli…</option>
              ${servizi.filter(s => !prezzi[s.id]).map(s => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn--fantasma" id="p-aggiungi" type="button">Aggiungi</button>
        </div>
      </div>

      <!-- ---------- promemoria ---------- -->
      <div class="blocco" style="max-width:none">
        <h3 class="blocco__titolo">💬 Promemoria WhatsApp</h3>
        <label class="interruttore">
          <input type="checkbox" id="c-prom" ${cliente.promemoriaAttivo ? 'checked' : ''}>
          <span class="interruttore__leva"></span>
          <span class="interruttore__testo">Le manda il promemoria il giorno prima
            <small>Se spento, non comparirà nella lista dei messaggi da inviare</small></span>
        </label>
      </div>`;

    disegnaPrezzi();
    disegnaAnteprima();
    aggancia();
  }

  function disegnaPrezzi() {
    const elenco = radice.querySelector('#p-elenco');
    const righe = Object.keys(prezzi);
    if (!righe.length) {
      elenco.innerHTML = '<p class="testo-tenue">Nessun prezzo personalizzato: valgono quelli di listino.</p>';
      return;
    }
    elenco.innerHTML = `
      <table class="tabella">
        <thead><tr><th>Servizio</th><th class="num">Durata</th><th class="num">Posa</th><th class="num">Prezzo</th><th></th></tr></thead>
        <tbody>
          ${righe.map(id => {
            const s = servizi.find(x => x.id === id) || { nome: 'servizio eliminato', durata: 0, prezzo: 0, posaMinuti: 0 };
            const v = prezzi[id];
            return `<tr>
              <td>${esc(s.nome)}<br><span class="testo-tenue">listino: ${s.durata}′ · ${euro(s.prezzo, valuta)}</span></td>
              <td class="num"><input class="input" data-pz="${esc(id)}" data-campo="durata" type="number" min="5" step="5" value="${esc(v.durata)}" style="width:82px;min-height:40px;padding:6px 8px"></td>
              <td class="num"><input class="input" data-pz="${esc(id)}" data-campo="posaMinuti" type="number" min="0" step="5" value="${esc(v.posaMinuti || 0)}" style="width:82px;min-height:40px;padding:6px 8px"></td>
              <td class="num"><input class="input" data-pz="${esc(id)}" data-campo="prezzo" type="number" min="0" step="0.5" value="${esc(v.prezzo)}" style="width:92px;min-height:40px;padding:6px 8px"></td>
              <td class="azioni"><button class="btn-icona" data-pz-via="${esc(id)}" title="Togli">&times;</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  async function disegnaAnteprima() {
    const zona = radice.querySelector('#r-anteprima');
    if (!zona) return;
    if (!r.attiva) { zona.innerHTML = ''; return; }
    const prossime = [];
    let g = r.dataInizio;
    const oggi = dayKey(new Date());
    for (let i = 0; i < 60 && prossime.length < 5; i++) {
      if (g >= oggi) prossime.push(g);
      g = dayKey(addDays(fromDayKey(g), Number(r.cadenzaGiorni) || 7));
    }
    const scelti = (r.serviziIds || []).map(id => servizi.find(s => s.id === id)).filter(Boolean);
    const durataTot = scelti.reduce((t, s) => t + store.tariffaPerCliente(cliente, s).durata, 0);
    zona.innerHTML = `<div class="avviso-riquadro avviso-riquadro--info">
      <span>↻</span><div><strong>Le prossime volte</strong>
      ${prossime.map(x => esc(dataBreve(fromDayKey(x)))).join(' · ')} … alle ${esc(r.ora)}
      ${scelti.length ? `<br>${esc(scelti.map(s => s.nome).join(', '))} · ${durataUmana(durataTot)}` : '<br>nessun servizio scelto: verranno creati appuntamenti vuoti da completare'}
      </div></div>`;
  }

  function aggancia() {
    ui.legaCampiOra(radice);
    const attiva = radice.querySelector('#r-attiva');
    attiva.addEventListener('change', () => {
      r.attiva = attiva.checked;
      radice.querySelector('#r-dettagli').style.display = r.attiva ? '' : 'none';
      disegnaAnteprima();
    });

    const giorno = radice.querySelector('#r-giorno');
    if (giorno) giorno.addEventListener('change', () => {
      r.dataInizio = store.primaDataPerGiorno(Number(giorno.value));
      disegnaAnteprima();
    });

    const ora = radice.querySelector('#r-ora');
    if (ora) ora.addEventListener('change', () => {
      r.ora = ui.normalizzaOra(ora.value) || r.ora;
      ora.value = r.ora;
      disegnaAnteprima();
    });

    const cadenza = radice.querySelector('#r-cadenza');
    if (cadenza) cadenza.addEventListener('change', () => {
      const libera = cadenza.value === 'libera';
      radice.querySelector('#r-libera-avvolgi').style.display = libera ? '' : 'none';
      if (!libera) r.cadenzaGiorni = Number(cadenza.value);
      disegnaAnteprima();
    });
    const giorni = radice.querySelector('#r-giorni');
    if (giorni) giorni.addEventListener('change', () => {
      r.cadenzaGiorni = Math.max(1, Number(giorni.value) || 7);
      disegnaAnteprima();
    });

    ui.su(radice, 'click', '[data-rserv]', (e, el) => {
      const id = el.dataset.rserv;
      const elenco = new Set(r.serviziIds || []);
      elenco.has(id) ? elenco.delete(id) : elenco.add(id);
      r.serviziIds = [...elenco];
      el.classList.toggle('is-scelto');
      disegnaAnteprima();
    });

    ui.su(radice, 'click', '[data-abit]', (e, el) => {
      const id = el.dataset.abit;
      abituali.has(id) ? abituali.delete(id) : abituali.add(id);
      el.classList.toggle('is-scelto');
    });

    radice.querySelector('#p-aggiungi').addEventListener('click', () => {
      const sel = radice.querySelector('#p-nuovo');
      const s = servizi.find(x => x.id === sel.value);
      if (!s) { ui.avviso('Scegli prima un servizio'); return; }
      prezzi[s.id] = { durata: s.durata, prezzo: s.prezzo, posaMinuti: s.posaMinuti || 0 };
      disegna();
    });

    ui.su(radice, 'change', '[data-pz]', (e, el) => {
      const id = el.dataset.pz;
      if (!prezzi[id]) return;
      prezzi[id][el.dataset.campo] = Number(el.value) || 0;
    });

    ui.su(radice, 'click', '[data-pz-via]', (e, el) => {
      delete prezzi[el.dataset.pzVia];
      disegna();
    });
  }

  disegna();

  p.elemento.querySelector('[data-x="annulla"]').addEventListener('click', () => p.chiudi());
  p.elemento.querySelector('[data-x="salva"]').addEventListener('click', async (e) => {
    e.target.disabled = true;
    const eraAttiva = !!(cliente.ricorrenza && cliente.ricorrenza.attiva);

    const aggiornato = await store.salvaImpostazioniCliente(cliente.id, {
      ricorrenza: r,
      serviziAbituali: [...abituali],
      prezzi,
      promemoriaAttivo: radice.querySelector('#c-prom').checked
    });

    if (r.attiva) {
      const esito = await store.generaOccorrenze(aggiornato);
      if (esito.create) {
        ui.ok(`Impostazioni salvate — ${esito.create} appuntamenti fissati`);
        if (esito.conflitti.length) {
          setTimeout(() => ui.avviso(
            `${esito.conflitti.length} ${esito.conflitti.length === 1 ? 'si sovrappone' : 'si sovrappongono'} ad altri appuntamenti: controllali in agenda`,
            'info', 7000), 900);
        }
      } else ui.ok('Impostazioni salvate');
    } else {
      if (eraAttiva) {
        const future = await store.occorrenzeSerie(r.serieId || '', { daGiorno: dayKey(new Date()) });
        if (future.length) {
          const via = await ui.conferma({
            titolo: 'Tolgo anche gli appuntamenti già fissati?',
            testo: `Ci sono ${future.length} appuntamenti futuri nati da questa serie. Vuoi cancellarli, o preferisci lasciarli in agenda?`,
            confermaTesto: 'Cancellali', annullaTesto: 'Lasciali'
          });
          if (via) for (const a of future) await store.eliminaAppuntamento(a.id);
        }
      }
      ui.ok('Impostazioni salvate');
    }

    p.chiudi();
    document.dispatchEvent(new CustomEvent('dati:cambiati'));
    if (alChiudere) alChiudere();
  });
}

return { disegna, inizializza, modulo, pannelloImpostazioni, pannelloVisita, scheda };
})();

let listino = null;   // caricato una volta e riusato

async function apri({ data = new Date(), oraSuggerita = null, appuntamento = null, cliente = null, serviziIniziali = null } = {}) {

  const valuta = cfg.get('incassi').valuta;

    durataManuale: null,
    prezzoManuale: null,
    filtroServizi: '',

  };

  if (serviziIniziali && serviziIniziali.length) {
    const tutti = await store.elencoServizi();
    stato.servizi = serviziIniziali.map(s => {
      // Servizi di allora, prezzi di oggi: prima quelli della cliente, poi il listino.
      const attuale = tutti.find(x => x.id === (s.servizioId || s.id));
      if (attuale) return store.servizioPerCliente(stato.cliente, attuale);
      return { id: s.servizioId || s.id, nome: s.nome, durata: s.durata, prezzo: s.prezzo, posaMinuti: s.posaMinuti || 0 };

  if (appuntamento) {
    stato.cliente = appuntamento.clienteId ? await store.leggiCliente(appuntamento.clienteId) : null;
    stato.nomeLibero = appuntamento.clienteNome || '';
    const tutti = await store.elencoServizi();
    stato.servizi = (appuntamento.servizi || []).map(s =>

      { id: s.servizioId, nome: s.nome, durata: s.durata, prezzo: s.prezzo, posaMinuti: s.posaMinuti || 0 }

    const sommaDurata = stato.servizi.reduce((t, s) => t + s.durata, 0);

  /* ---------------- 2. servizi ---------------- */

  const zonaServizi = radice.querySelector('#zona-servizi');

  function chip(s, colore) {
    const scelto = stato.servizi.some(x => x.id === s.id);
    const t = store.tariffaPerCliente(stato.cliente, s);
    return `<button class="chip chip--grande${scelto ? ' is-scelto' : ''}" data-servizio="${esc(s.id)}" type="button">
      <span class="chip__riga"><span class="chip__punto" style="background:${esc(colore)}"></span>${esc(s.nome)}</span>
      <span class="chip__meta">${t.durata}′ · ${euro(t.prezzo, valuta)}${t.personalizzato ? ' ✱' : ''}</span>
    </button>`;

  async function disegnaServizi() {
    const scorrimento = zonaServizi.scrollTop;   // non far saltare la lista sotto le dita
    const coloreDi = (id) => {
      const g = listino.gruppi.find(x => x.categoria.id === id);
      return g ? g.categoria.colore : '#9A8E80';
    };

    let html = '';
    const filtro = normalizza(stato.filtroServizi || '');

    if (filtro) {
      /* Con la ricerca attiva il listino sparisce e restano i soli servizi
         che corrispondono. Quelli già scelti che la ricerca esclude non si
         perdono di vista: si raccolgono sotto, sempre togliibili con un tocco. */
      const tutti = [];
      for (const g of listino.gruppi) {
        for (const srv of g.servizi) tutti.push({ srv, colore: g.categoria.colore });

      const trovati = tutti.filter(x => normalizza(x.srv.nome).includes(filtro));

      html += `<div class="gruppo-listino">
