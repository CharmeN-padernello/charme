/* ---------- accesso alle impostazioni ---------- */

let _cache = null;

/**
 * Unione profonda fra i valori predefiniti e quelli salvati.
 * Le chiavi nuove introdotte da un aggiornamento compaiono con il loro valore
 * predefinito; quelle già personalizzate restano come sono.
 *
 * Attenzione ai casi limite, che qui sono la norma e non l'eccezione:
 * molti valori predefiniti sono null (logo, ultimoBackup, ultimaSincronizzazione)
 * e diventano una stringa o un oggetto appena vengono usati la prima volta.
 * In JavaScript `typeof null` vale 'object', quindi un null predefinito va
 * riconosciuto PRIMA di trattarlo come un oggetto da percorrere.
 */
function unisci(predefinito, salvato) {
  // mai salvato: vale il predefinito
  if (salvato === undefined) return structuredClone(predefinito);

  // il predefinito è null o un valore semplice: comanda quello salvato
  if (predefinito === null || typeof predefinito !== 'object') return salvato;

  // elenchi: si prendono interi, non si fondono voce per voce
  if (Array.isArray(predefinito)) return Array.isArray(salvato) ? salvato : structuredClone(predefinito);

  // il predefinito è un oggetto ma il salvato no: dato incoerente, si riparte dal predefinito
  if (salvato === null || typeof salvato !== 'object' || Array.isArray(salvato)) {
    return structuredClone(predefinito);
  }

  const out = {};
  for (const k of Object.keys(predefinito)) out[k] = unisci(predefinito[k], salvato[k]);
  for (const k of Object.keys(salvato)) if (!(k in out)) out[k] = salvato[k];
  return out;
}

/**
 * Carica le impostazioni.
 * Nessun problema qui dentro può impedire di aprire l'app: se una sezione è
 * illeggibile si riparte dai valori predefiniti per quella sola sezione, e si
 * va avanti. L'agenda del giorno vale più di un'impostazione.
 */
async function carica() {
  let salvate = {};
  try {
    const righe = await db.leggiTutti('impostazioni');
    salvate = Object.fromEntries(righe.map(r => [r.chiave, r.valore]));
  } catch (e) {
    console.error('[Charme] impostazioni illeggibili, si usano i valori predefiniti', e);
  }

  _cache = {};
  const sezioniRecuperate = [];
  for (const sezione of Object.keys(PREDEFINITE)) {
    try {
      _cache[sezione] = unisci(PREDEFINITE[sezione], salvate[sezione]);
    } catch (e) {
      console.error(`[Charme] sezione impostazioni "${sezione}" non valida, ripristinata`, e);
      _cache[sezione] = structuredClone(PREDEFINITE[sezione]);
      sezioniRecuperate.push(sezione);
    }
  }
  if (sezioniRecuperate.length) {
    _cache._sezioniRecuperate = sezioniRecuperate;
  }
  return _cache;
}

/** Lettura sincrona: l'interfaccia la usa ovunque senza await. */
function get(sezione) {
  if (!_cache) throw new Error('Impostazioni non caricate');
  return sezione ? _cache[sezione] : _cache;
}

async function imposta(sezione, valori) {
  _cache[sezione] = { ..._cache[sezione], ...valori };
  await db.salva('impostazioni', { chiave: sezione, valore: _cache[sezione] });
  document.dispatchEvent(new CustomEvent('impostazioni:cambiate', { detail: { sezione } }));
  return _cache[sezione];
}

async function ripristinaSezione(sezione) {
  _cache[sezione] = structuredClone(PREDEFINITE[sezione]);
  await db.salva('impostazioni', { chiave: sezione, valore: _cache[sezione] });
  document.dispatchEvent(new CustomEvent('impostazioni:cambiate', { detail: { sezione } }));
  return _cache[sezione];
}

/* ---------- primo avvio ---------- */

async function primoAvvio() {
  const serviziEsistenti = await db.conta('servizi');
  if (serviziEsistenti > 0) return false;

  const categorie = CATEGORIE_ESEMPIO.map(c => ({ id: uid('cat'), ...c }));
  await db.salvaMolti('categorie', categorie);

  const perNome = Object.fromEntries(categorie.map(c => [c.nome, c.id]));
  const servizi = SERVIZI_ESEMPIO.map(([cat, nome, durata, prezzo, posa], i) => ({
    id: uid('srv'),
    nome,
    categoriaId: perNome[cat],
    durata,
    prezzo,
    posaMinuti: posa,
    note: '',
    attivo: 1,
    preferito: i < 6 ? 1 : 0,
    ordine: i + 1,
    ricerca: normalizza(nome)
  }));
  await db.salvaMolti('servizi', servizi);

  await db.salva('impostazioni', { chiave: '_esempio', valore: { listinoDiEsempio: true, creatoIl: new Date().toISOString() } });
  return true;
}

/** true finché il listino non è stato personalizzato: l'app mostra un avviso. */
async function listinoEsempioAncoraPresente() {
  const r = await db.leggi('impostazioni', '_esempio');
  return !!(r && r.valore && r.valore.listinoDiEsempio);
}

async function segnaListinoPersonalizzato() {
  await db.salva('impostazioni', { chiave: '_esempio', valore: { listinoDiEsempio: false } });
}

return { CATEGORIE_ESEMPIO, PREDEFINITE, SERVIZI_ESEMPIO, carica, get, imposta, listinoEsempioAncoraPresente, primoAvvio, ripristinaSezione, segnaListinoPersonalizzato };
})();

/* ======================= js/ui.js ======================= */
MOD.ui = (function () {
/* Charme — componenti di interfaccia riutilizzabili
   Pannelli, avvisi, conferme. Tutto dimensionato per essere usato col dito. */

const { esc } = MOD.util;

/* ---------- avvisi temporanei ---------- */

let contenitoreAvvisi = null;

function avviso(testo, tipo = 'info', durata = 3200) {
  if (!contenitoreAvvisi) {
    contenitoreAvvisi = document.createElement('div');
    contenitoreAvvisi.className = 'avvisi';
    document.body.appendChild(contenitoreAvvisi);
  }
  const el = document.createElement('div');
  el.className = `avviso avviso--${tipo}`;
  el.innerHTML = `<span>${esc(testo)}</span>`;
  contenitoreAvvisi.appendChild(el);
  requestAnimationFrame(() => el.classList.add('is-visibile'));
  setTimeout(() => {
    el.classList.remove('is-visibile');
    setTimeout(() => el.remove(), 300);
  }, durata);
  return el;
}

const ok = (t) => avviso(t, 'ok');
const errore = (t) => avviso(t, 'errore');

/* ---------- pannello a scomparsa (bottom sheet) ---------- */

/* I pannelli si impilano: aprirne uno secondario (una cliente nuova, una
   conferma) NON deve chiudere quello sotto. */
const pila = [];

/**
 * Apre un pannello dal basso.
 * @returns {{chiudi:Function, elemento:HTMLElement, corpo:HTMLElement}}
 */
function pannello({ titolo, sottotitolo = '', contenuto, azioni = '', ampio = false, classe = '', alChiudere = null }) {
  const livello = pila.length;
  const zSfondo = 60 + livello * 10;

  const sfondo = document.createElement('div');
  sfondo.className = 'sfondo-modale';
  sfondo.style.zIndex = zSfondo;

  const el = document.createElement('div');
  el.className = `pannello${ampio ? ' pannello--ampio' : ''}${classe ? ' ' + classe : ''}`;
  el.style.zIndex = zSfondo + 1;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', titolo || 'Pannello');
  el.innerHTML = `
    <div class="pannello__maniglia" aria-hidden="true"></div>
    <header class="pannello__testa">
      <div>
        <h2 class="pannello__titolo">${esc(titolo || '')}</h2>
        ${sottotitolo ? `<p class="pannello__sottotitolo">${esc(sottotitolo)}</p>` : ''}
      </div>
      <button class="btn-icona pannello__chiudi" type="button" aria-label="Chiudi">&times;</button>
    </header>
    <div class="pannello__corpo"></div>
    ${azioni ? `<footer class="pannello__azioni">${azioni}</footer>` : ''}
  `;

  const corpo = el.querySelector('.pannello__corpo');
  if (typeof contenuto === 'string') corpo.innerHTML = contenuto;
  else if (contenuto instanceof Node) corpo.appendChild(contenuto);

  document.body.appendChild(sfondo);
  document.body.appendChild(el);
  document.body.classList.add('senza-scorrimento');

  const riferimento = { chiudi: null, elemento: el, corpo };

  const chiudi = () => {
    if (!el.isConnected) return;
    el.classList.remove('is-aperto');
    sfondo.classList.remove('is-aperto');
    setTimeout(() => { el.remove(); sfondo.remove(); }, 240);
    document.removeEventListener('keydown', suEsc);
    const i = pila.indexOf(riferimento);
    if (i >= 0) pila.splice(i, 1);
    if (!pila.length) document.body.classList.remove('senza-scorrimento');
    if (alChiudere) alChiudere();
  };
  riferimento.chiudi = chiudi;

  // Esc chiude solo il pannello più in alto.
  const suEsc = (e) => {
    if (e.key !== 'Escape') return;
    if (pila[pila.length - 1] !== riferimento) return;
    chiudi();
  };
  document.addEventListener('keydown', suEsc);
  sfondo.addEventListener('click', chiudi);
  el.querySelector('.pannello__chiudi').addEventListener('click', chiudi);

  requestAnimationFrame(() => {
    el.classList.add('is-aperto');
    sfondo.classList.add('is-aperto');
    const primo = el.querySelector('[data-fuoco]');
    if (primo) setTimeout(() => primo.focus(), 260);
  });

  pila.push(riferimento);
  return riferimento;
}

/** Chiude il pannello più in alto. */
function chiudiPannello() {
  if (pila.length) pila[pila.length - 1].chiudi();
}

/** Chiude tutti i pannelli aperti. */
function chiudiTuttiIPannelli() {
  while (pila.length) pila[pila.length - 1].chiudi();
}

/* ---------- conferme ---------- */

function conferma({ titolo, testo, confermaTesto = 'Conferma', annullaTesto = 'Annulla', pericolo = false }) {
  return new Promise((risolvi) => {
    let deciso = false;
    const p = pannello({
      titolo,
      contenuto: `<p class="testo-lungo">${esc(testo)}</p>`,
      azioni: `
        <button class="btn btn--fantasma" data-azione="no">${esc(annullaTesto)}</button>
        <button class="btn ${pericolo ? 'btn--pericolo' : 'btn--principale'}" data-azione="si" data-fuoco>${esc(confermaTesto)}</button>
      `,
      alChiudere: () => { if (!deciso) risolvi(false); }
    });
    p.elemento.querySelectorAll('[data-azione]').forEach(b => {
      b.addEventListener('click', () => {
        deciso = true;
        risolvi(b.dataset.azione === 'si');
        p.chiudi();
      });
    });
  });
}

/**
 * Chiede una riga di testo. Restituisce la stringa scritta, oppure null se
 * si annulla — così chi chiama distingue «l'ha svuotata» da «ha rinunciato».
 */
function chiediTesto({ titolo, sottotitolo = '', valore = '', segnaposto = '', aiuto = '', confermaTesto = 'Salva', lunghezzaMax = 120 }) {
  return new Promise(risolvi => {
    let deciso = false;
    const p = pannello({
      titolo,
      sottotitolo,
      contenuto: `<div class="campo" style="margin-bottom:0">
          <input class="input" id="testo-chiesto" maxlength="${Number(lunghezzaMax) || 120}" data-fuoco
                 value="${esc(valore || '')}" placeholder="${esc(segnaposto)}">
          ${aiuto ? `<p class="campo__aiuto">${esc(aiuto)}</p>` : ''}
        </div>`,
      azioni: `<button class="btn btn--fantasma" data-x="no">Annulla</button>
               <button class="btn btn--principale" data-x="si">${esc(confermaTesto)}</button>`,
      alChiudere: () => { if (!deciso) risolvi(null); }
    });
    const campo = p.elemento.querySelector('#testo-chiesto');
    const conferma = () => {
      deciso = true;
      risolvi(campo.value.trim());
      p.chiudi();
    };
    p.elemento.querySelector('[data-x="no"]').addEventListener('click', () => p.chiudi());
    p.elemento.querySelector('[data-x="si"]').addEventListener('click', conferma);
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') conferma(); });
  });
}

/* ---------- utilità DOM ---------- */

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function svuota(nodo) { while (nodo.firstChild) nodo.removeChild(nodo.firstChild); }

/** Delegazione eventi: sopravvive al ridisegno delle liste. */
function su(radice, evento, selettore, gestore) {
  radice.addEventListener(evento, (e) => {
    const bersaglio = e.target.closest(selettore);
    if (bersaglio && radice.contains(bersaglio)) gestore(e, bersaglio);
  });
}

/* ---------- campo orario, sempre a 24 ore ----------
   Il campo orario di Android segue l'orologio del tablet: se quello è a 12 ore
   escono AM/PM e non c'è modo di impedirlo dall'app. Questo è scritto qui e
   quindi è a 24 ore ovunque e sempre, qualunque tablet ci sia sotto.
   Si può battere 1430, 14.30, 14:30, 930: tutto diventa 14:30 e 09:30. */

/** Un orario scritto in qualunque modo → 'HH:MM', oppure '' se non si capisce. */
function normalizzaOra(testo) {
  const grezzo = String(testo == null ? '' : testo).trim();
  if (!grezzo) return '';
  const cifre = grezzo.replace(/\D/g, '');
  let ore, minuti;
  if (cifre.length <= 2) { ore = Number(cifre); minuti = 0; }
  else if (cifre.length === 3) { ore = Number(cifre.slice(0, 1)); minuti = Number(cifre.slice(1)); }
  else { ore = Number(cifre.slice(0, 2)); minuti = Number(cifre.slice(2, 4)); }
  if (!Number.isFinite(ore) || !Number.isFinite(minuti)) return '';
  if (ore > 23 || minuti > 59) return '';
  return `${String(ore).padStart(2, '0')}:${String(minuti).padStart(2, '0')}`;
}

/** L'HTML di un campo orario. Da legare poi con legaCampiOra(). */
function campoOra(id, valore = '', { stile = '', segnaposto = '--:--', etichetta = '' } = {}) {
  return `<input class="input input--ora" id="${esc(id)}" type="text"
    inputmode="numeric" autocomplete="off" maxlength="5"
    value="${esc(normalizzaOra(valore))}" placeholder="${esc(segnaposto)}"
    ${etichetta ? `aria-label="${esc(etichetta)}"` : ''}
    ${stile ? `style="${esc(stile)}"` : ''}>`;
}

/**
 * Rende vivi tutti i campi orario dentro una radice: formattazione mentre si
 * scrive, normalizzazione quando si esce, evento 'change' come un campo vero.
 * Chiamarla dopo ogni innerHTML che contenga campi orario.
 */
function legaCampiOra(radice) {
  radice.querySelectorAll('.input--ora:not([data-ora-legata])').forEach(campo => {
    campo.dataset.oraLegata = '1';

    campo.addEventListener('input', () => {
      // Solo cifre e i due punti, e i due punti li mettiamo noi al posto giusto.
      const cifre = campo.value.replace(/\D/g, '').slice(0, 4);
      campo.value = cifre.length > 2 ? `${cifre.slice(0, 2)}:${cifre.slice(2)}` : cifre;
    });

    const sistema = () => {
      const prima = campo.value;
      const dopo = normalizzaOra(prima);
      if (!prima.trim()) { campo.value = ''; campo.classList.remove('is-storta'); return; }
      if (!dopo) { campo.classList.add('is-storta'); return; }
      campo.classList.remove('is-storta');
      campo.value = dopo;
    };

    // Solo il riordino di quello che si vede: chi legge il campo passa comunque
    // da normalizzaOra(), così non dipende da quando è scattato quale evento.
    campo.addEventListener('blur', sistema);
    campo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); campo.blur(); }
    });
  });
}

function statoVuoto({ icona = '', titolo, testo = '', azione = '' }) {
  return `
    <div class="stato-vuoto">
      ${icona ? `<div class="stato-vuoto__icona">${icona}</div>` : ''}
      <h3>${esc(titolo)}</h3>
      ${testo ? `<p>${esc(testo)}</p>` : ''}
      ${azione}
    </div>`;
}

return { avviso, campoOra, chiediTesto, chiudiPannello, chiudiTuttiIPannelli, conferma, el, errore, legaCampiOra, normalizzaOra, ok, pannello, statoVuoto, su, svuota };
})();

/* ======================= js/whatsapp.js ======================= */
MOD.whatsapp = (function () {
/* Charme — messaggi WhatsApp
   L'app compone il testo e apre WhatsApp con il messaggio già scritto nella
   chat giusta. L'invio resta un tocco di Veronica: è l'unico modo gratuito e
   conforme ai termini di servizio di WhatsApp. */

const cfg = MOD.cfgApp;
const { daIsoLocale, dataEstesa, dataNumerica, ora, durataUmana, euro, telefonoInternazionale, nomeCompleto, quandoUmano } = MOD.util;

/** Campi disponibili nei testi delle impostazioni. */
const CAMPI = [
  { chiave: '{nome}',        descrizione: 'Nome della cliente',            esempio: 'Maria' },
  { chiave: '{cognome}',     descrizione: 'Cognome della cliente',         esempio: 'Rossi' },
  { chiave: '{giorno}',      descrizione: 'Giorno esteso',                 esempio: 'giovedì 20 agosto' },
  { chiave: '{quando}',      descrizione: 'Oggi / domani / giorno esteso', esempio: 'domani' },
  { chiave: '{data}',        descrizione: 'Data in cifre',                 esempio: '20/08/2026' },
  { chiave: '{ora}',         descrizione: 'Ora di inizio',                 esempio: '15:00' },
  { chiave: '{servizio}',    descrizione: 'Servizi prenotati',             esempio: 'taglio e piega' },
  { chiave: '{durata}',      descrizione: 'Durata prevista',               esempio: '1h 15min' },
  { chiave: '{prezzo}',      descrizione: 'Importo previsto',              esempio: '€ 38' },
  { chiave: '{negozio}',     descrizione: 'Nome del negozio',              esempio: 'Charme Parrucchieri' },
  { chiave: '{titolare}',    descrizione: 'Nome della titolare',           esempio: 'Veronica' },
  { chiave: '{indirizzo}',   descrizione: 'Indirizzo del negozio',         esempio: 'Via Sottana, Padernello' },
  { chiave: '{telefono}',    descrizione: 'Telefono del negozio',          esempio: '0422 000000' }
];

function elencoServizi(app) {
  const nomi = (app.servizi || []).map(s => s.nome.toLowerCase());
  if (!nomi.length) return 'il tuo appuntamento';
  if (nomi.length === 1) return nomi[0];
  return nomi.slice(0, -1).join(', ') + ' e ' + nomi[nomi.length - 1];
}

function valoriCampi(cliente, appuntamento) {
  const negozio = cfg.get('negozio');
  const valuta = cfg.get('incassi').valuta;
  const d = daIsoLocale(appuntamento.inizio);
  return {
    '{nome}': (cliente && cliente.nome) || '',
    '{cognome}': (cliente && cliente.cognome) || '',
    '{giorno}': dataEstesa(d).toLowerCase(),
    '{quando}': quandoUmano(d),
    '{data}': dataNumerica(d),
    '{ora}': ora(d),
    '{servizio}': elencoServizi(appuntamento),
    '{durata}': durataUmana(appuntamento.durata),
    '{prezzo}': euro(appuntamento.prezzo, valuta),
    '{negozio}': negozio.nome || '',
    '{titolare}': (negozio.titolare || '').split(' ')[0] || '',
    '{indirizzo}': negozio.indirizzo || '',
    '{telefono}': negozio.telefono || ''
  };
}

function componi(modello, cliente, appuntamento) {
  const valori = valoriCampi(cliente, appuntamento);
  let testo = String(modello || '');
  for (const [campo, valore] of Object.entries(valori)) {
    testo = testo.split(campo).join(valore);
  }
  const firma = cfg.get('messaggi').firma;
  if (firma && !testo.includes(firma)) testo += `\n${firma}`;
  return testo.replace(/\n{3,}/g, '\n\n').trim();
}

function testoConferma(cliente, appuntamento) {
  return componi(cfg.get('messaggi').conferma, cliente, appuntamento);
}

function testoPromemoria(cliente, appuntamento) {
  return componi(cfg.get('messaggi').promemoria, cliente, appuntamento);
}

/** Anteprima nelle impostazioni, con una cliente inventata. */
function anteprima(modello) {
  const clienteFinto = { nome: 'Maria', cognome: 'Rossi' };
  const oggi = new Date();
  const domani = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate() + 1, 15, 0);
  const appFinto = {
    inizio: `${domani.getFullYear()}-${String(domani.getMonth()+1).padStart(2,'0')}-${String(domani.getDate()).padStart(2,'0')}T15:00`,
    durata: 75,
    prezzo: 38,
    servizi: [{ nome: 'Taglio' }, { nome: 'Piega' }]
  };
  return componi(modello, clienteFinto, appFinto);
}

function linkWhatsApp(telefono, testo) {
  const numero = telefonoInternazionale(telefono, cfg.get('cliente').prefissoTelefonico);
  if (!numero) return null;
  return `https://wa.me/${numero}?text=${encodeURIComponent(testo)}`;
}

/** Apre WhatsApp. Restituisce false se manca il numero della cliente. */
function apri(cliente, testo) {
  const link = linkWhatsApp(cliente && cliente.telefono, testo);
  if (!link) return false;
  window.open(link, '_blank', 'noopener');
  return true;
}

function nomePerMessaggio(cliente) {
  return cliente ? (cliente.nome || nomeCompleto(cliente)) : '';
}

return { CAMPI, anteprima, apri, componi, linkWhatsApp, nomePerMessaggio, testoConferma, testoPromemoria, valoriCampi };
})();

}

/** Ricerca per nome, cognome o numero. Tollerante ad accenti e maiuscole. */
async function cercaClienti(testo, limite = 40) {
  const q = normalizza(testo);
  const tutti = await elencoClienti();
  if (!q) return tutti.slice(0, limite);

  const soloCifre = q.replace(/\D/g, '');
  const punteggio = (c) => {
    const nome = normalizza(nomeCompleto(c));
    const tel = String(c.telefono || '').replace(/\D/g, '');
    if (nome.startsWith(q)) return 3;
    if (nome.split(/\s+/).some(p => p.startsWith(q))) return 2;
    if (nome.includes(q)) return 1;
    if (soloCifre && tel.includes(soloCifre)) return 1;
    return 0;
  };

  return tutti
    .map(c => ({ c, p: punteggio(c) }))
    .filter(x => x.p > 0)
    .sort((a, b) => b.p - a.p || nomeCompleto(a.c).localeCompare(nomeCompleto(b.c), 'it'))
    .slice(0, limite)
    .map(x => x.c);
}

  // Le impostazioni dietro l'ingranaggio non passano da questo modulo: vanno

  const precedente = dati.id ? await db.leggi('clienti', dati.id) : null;
  const cliente = {
    ...(precedente || {}),
    ricorrenza: (precedente && precedente.ricorrenza) || ricorrenzaVuota(),
    serviziAbituali: (precedente && precedente.serviziAbituali) || [],
    prezzi: (precedente && precedente.prezzi) || {},
    // Il promemoria per la prossima volta — «avanza 20 euro» — non passa da

    notaProssima: (precedente && precedente.notaProssima) || '',
    id: dati.id || uid('cli'),

/** Riepilogo per l'intestazione della scheda cliente. */
async function storicoCliente(clienteId) {
  const tutti = (await db.leggiPerIndice('appuntamenti', 'clienteId', clienteId))
    .sort((a, b) => b.inizio.localeCompare(a.inizio));

  const passati = tutti.filter(a => a.inizio < oggi && a.stato !== 'annullato');
  const futuri = tutti.filter(a => a.inizio >= oggi && a.stato !== 'annullato')
                      .sort((a, b) => a.inizio.localeCompare(b.inizio));
  const contabili = passati.filter(a => a.stato !== 'assente');
  const totale = contabili.reduce((s, a) => s + (Number(a.prezzo) || 0), 0);

    scontrinoMedio: contabili.length ? totale / contabili.length : 0,
    ultimaVisita: contabili.length ? daIsoLocale(contabili[0].inizio) : null,
    prossimo: futuri[0] || null
  };

/**
 * Salva un appuntamento.
 * I servizi vengono copiati dentro l'appuntamento (nome, durata, prezzo del
 * momento): se domani il listino cambia, lo storico resta fedele a com'era.
 */
async function salvaAppuntamento(dati) {
  const adesso = new Date().toISOString();
  const inizio = typeof dati.inizio === 'string' ? dati.inizio : isoLocale(dati.inizio);

  // I servizi vengono copiati dentro l'appuntamento con nome, durata e prezzo
  // del momento: se domani il listino cambia, lo storico resta fedele.
  // L'ordine è quello di svolgimento: prima chi ha una posa.
  const servizi = ordinaServizi((dati.servizi || []).map(s => ({
    servizioId: s.servizioId || s.id || null,
    nome: s.nome,
    durata: Number(s.durata) || 0,
    prezzo: Number(s.prezzo) || 0,
    posaMinuti: Number(s.posaMinuti) || 0
  })));

  const durata = dati.durata != null
    ? Number(dati.durata)
    : (durataDaServizi(servizi) || cfg.get('agenda').durataPredefinita);

  const app = {
    id: dati.id || uid('app'),
    // Un impegno personale — il dentista, una consegna, una pausa — è un
    // appuntamento senza cliente con un contrassegno. Passando di qui eredita
    // tutto quello che già funziona: griglia, conflitti, orari liberi.
    tipo: dati.tipo === 'impegno' ? 'impegno' : 'appuntamento',
    titolo: dati.tipo === 'impegno' ? (dati.titolo || '').trim() || 'Impegno' : null,
    clienteId: dati.tipo === 'impegno' ? null : (dati.clienteId || null),
    // Chi non ha ancora una scheda vive con il solo nome, fin quando non gliela si crea.
    clienteNome: (dati.tipo === 'impegno' || dati.clienteId) ? null : (dati.clienteNome || '').trim() || null,
    giorno: inizio.slice(0, 10),
    inizio,
    durata,
    posaMinuti: servizi.reduce((t, s) => t + (s.posaMinuti || 0), 0),
    servizi,
    prezzo: dati.prezzo != null && dati.prezzo !== ''
      ? Number(dati.prezzo)
      : servizi.reduce((t, s) => t + s.prezzo, 0),
    stato: dati.stato || 'previsto',      // previsto | concluso | annullato | assente
    note: dati.note || '',
    metodoPagamento: dati.metodoPagamento || null,
    serieId: dati.serieId || null,        // se nasce da un appuntamento fisso
    dataSerie: dati.dataSerie || null,    // la data prevista dalla serie, anche se poi spostato
    confermaInviata: dati.confermaInviata || null,
    promemoriaInviato: dati.promemoriaInviato || null,
    creatoIl: dati.creatoIl || adesso,
    modificatoIl: adesso
  };

  await db.salva('appuntamenti', app);
  if (!dati.silenzioso) {
    document.dispatchEvent(new CustomEvent('dati:cambiati', { detail: { tipo: 'appuntamento', id: app.id } }));
  }
  return app;
}

/**
 * A giornata finita un appuntamento non è più "previsto": o è stato spostato,
 * o annullato, o si è svolto. Quelli rimasti previsti su un giorno ormai
 * passato diventano conclusi da soli all'avvio, senza chiedere niente.
 * Vale anche per l'arretrato: la prima volta sistema tutto quello che trova.
 * Non tocca annullati, assenti e già conclusi, e non tocca la giornata di oggi.
 */
async function concludiGiorniPassati() {
  const oggi = dayKey(new Date());
  const tutti = await db.leggiTutti('appuntamenti');
  const daChiudere = tutti.filter(a => a.stato === 'previsto' && a.giorno && a.giorno < oggi);
  if (!daChiudere.length) return 0;

  const adesso = new Date().toISOString();
  await db.salvaMolti('appuntamenti',
    daChiudere.map(a => ({ ...a, stato: 'concluso', modificatoIl: adesso })));

/** Il nome da mostrare, che la cliente abbia una scheda oppure no. */
function nomeDiAppuntamento(appuntamento, cliente) {
  if (appuntamento && appuntamento.tipo === 'impegno') return appuntamento.titolo || 'Impegno';
  if (cliente) return nomeCompleto(cliente);
  if (appuntamento && appuntamento.clienteNome) return appuntamento.clienteNome;
  return 'cliente eliminata';
}

function eImpegno(appuntamento) {
  return !!appuntamento && appuntamento.tipo === 'impegno';
}

function senzaScheda(appuntamento) {

/**
 * Crea la scheda per chi era stato fissato con il solo nome, e le aggancia

async function creaSchedaDaAppuntamento(appuntamentoId, dati = {}) {
  const app = await db.leggi('appuntamenti', appuntamentoId);
  if (!app || app.clienteId) return null;

  const nomeGrezzo = (dati.nome || app.clienteNome || '').trim();

    nome: dati.nome !== undefined ? dati.nome : (parti[0] || nomeGrezzo),

    telefono: dati.telefono || '',
    note: dati.note || '',
    allergie: dati.allergie || ''
  });

  const tutti = await db.leggiTutti('appuntamenti');
  const bersaglio = normalizza(app.clienteNome);
  let agganciati = 0;
  for (const a of tutti) {
    if (a.clienteId || !a.clienteNome) continue;
    if (normalizza(a.clienteNome) !== bersaglio) continue;
    await db.salva('appuntamenti', { ...a, clienteId: cliente.id, clienteNome: null, modificatoIl: new Date().toISOString() });
    agganciati++;
  }
  document.dispatchEvent(new CustomEvent('dati:cambiati'));
  return { cliente, agganciati };
}

}

/* ---------- tratti: come si svolge davvero un appuntamento ----------

   Un appuntamento non è un blocco unico. È una sequenza:
   ogni servizio dà il suo tratto di LAVORO e, se ha una posa, l'ATTESA che
   segue subito dopo. L'attesa è tempo in cui le mani sono libere.

     Colore radici 45' (30' di posa) + Taglio 30' + Piega 30', dalle 15:00

       15:00–15:15  lavoro   applicazione colore
       15:15–15:45  ATTESA   posa            ← qui entra un'altra cliente
       15:45–16:15  lavoro   taglio
       16:15–16:45  lavoro   piega

   Tutto il resto — occupazione, orari liberi, conflitti, disegno in agenda —
   discende da qui.
   ------------------------------------------------------------------------ */

const LAVORO_MINIMO = 5;

/** I servizi con posa vanno svolti per primi: l'attesa dell'uno copre il
    lavoro dell'altro. Fra pari, si rispetta l'ordine in cui sono stati scelti. */
function ordinaServizi(servizi) {
  const conPosa = [], senzaPosa = [];
  for (const s of servizi || []) ((s.posaMinuti || 0) > 0 ? conPosa : senzaPosa).push(s);
  return [...conPosa, ...senzaPosa];
}

/**
 * I tratti di un appuntamento, in minuti dal suo inizio.
 * @returns [{ tipo:'lavoro'|'attesa', da, a, servizio }]
 */
function tratti(appuntamento) {
  const servizi = (appuntamento.servizi && appuntamento.servizi.length)
    ? appuntamento.servizi
    : [{ nome: 'Appuntamento', durata: appuntamento.durata || 30, posaMinuti: 0 }];

  const out = [];
  let t = 0;
  for (const s of servizi) {
    const durata = Number(s.durata) || 0;
    if (durata <= 0) continue;
    const posa = Math.min(Number(s.posaMinuti) || 0, Math.max(0, durata - LAVORO_MINIMO));
    const lavoro = durata - posa;
    if (lavoro > 0) { out.push({ tipo: 'lavoro', da: t, a: t + lavoro, servizio: s.nome }); t += lavoro; }
    if (posa > 0)   { out.push({ tipo: 'attesa', da: t, a: t + posa,   servizio: s.nome }); t += posa; }
  }
  if (!out.length) {
    return [{ tipo: 'lavoro', da: 0, a: Math.max(LAVORO_MINIMO, appuntamento.durata || 30), servizio: '' }];
  }

  // Se la durata complessiva è stata corretta a mano, la differenza va sul
  // lavoro: il tempo di posa è un dato tecnico del prodotto, non si stira.
  const durataTratti = out[out.length - 1].a;
  const durataVoluta = Number(appuntamento.durata) || durataTratti;
  const differenza = durataVoluta - durataTratti;

  if (differenza > 0) {
    const ultimoLavoro = [...out].reverse().find(x => x.tipo === 'lavoro');
    if (ultimoLavoro && out[out.length - 1] === ultimoLavoro) ultimoLavoro.a += differenza;
    else out.push({ tipo: 'lavoro', da: durataTratti, a: durataVoluta, servizio: '' });
  } else if (differenza < 0) {
    let residuo = -differenza;
    for (let i = out.length - 1; i >= 0 && residuo > 0; i--) {
      if (out[i].tipo !== 'lavoro') continue;
      const riducibile = Math.min(residuo, (out[i].a - out[i].da) - LAVORO_MINIMO);
      if (riducibile <= 0) continue;
      out[i].a -= riducibile;
      for (let j = i + 1; j < out.length; j++) { out[j].da -= riducibile; out[j].a -= riducibile; }
      residuo -= riducibile;
    }
  }
  return out;
}

/** La durata complessiva che discende dai servizi scelti. */
function durataDaServizi(servizi) {
  return (servizi || []).reduce((t, s) => t + (Number(s.durata) || 0), 0);
}

/** I tratti in minuti dalla mezzanotte, pronti da confrontare fra appuntamenti. */
function trattiAssoluti(appuntamento) {
  const base = minutiDaHHMM(appuntamento.inizio.slice(11));
  return tratti(appuntamento).map(t => ({ ...t, da: base + t.da, a: base + t.a }));
}

function finestreLavoro(appuntamento) {
  return trattiAssoluti(appuntamento).filter(t => t.tipo === 'lavoro');
}

function finestreAttesa(appuntamento) {
  return trattiAssoluti(appuntamento).filter(t => t.tipo === 'attesa');
}

function siSovrappongono(a1, a2, b1, b2) { return a1 < b2 && b1 < a2; }

function inConflitto(finestreA, finestreB) {
  for (const x of finestreA) for (const y of finestreB) {
    if (siSovrappongono(x.da, x.a, y.da, y.a)) return true;
  }
  return false;
}

/** Un appuntamento finto, per calcolare i tratti di una scelta non ancora salvata. */
function appuntamentoIpotetico(inizioIso, durata, servizi) {
  return { inizio: inizioIso, durata, servizi: servizi || [] };
}

/**
 * Conflitti con gli altri appuntamenti della stessa giornata.
 * - attivi: due tratti di LAVORO che si accavallano. Conflitto vero.
 * - durantePosa: il lavoro nuovo cade nell'ATTESA di un'altra. È desiderabile.
 */
async function verificaConflitti(inizioIso, durata, { escludiId = null, servizi = null } = {}) {
  const giorno = inizioIso.slice(0, 10);
  const esistenti = (await appuntamentiDelGiorno(giorno))
    .filter(a => a.id !== escludiId && a.stato !== 'annullato');

  const nuovo = appuntamentoIpotetico(inizioIso, durata, servizi);
  const lavoroNuovo = finestreLavoro(nuovo);

  const attivi = [], durantePosa = [];
  for (const altro of esistenti) {
    if (inConflitto(lavoroNuovo, finestreLavoro(altro))) attivi.push(altro);
    else if (inConflitto(lavoroNuovo, finestreAttesa(altro))) durantePosa.push(altro);
  }
  return { attivi, durantePosa, nessuno: attivi.length === 0 };
}

/**
 * Orari in cui l'appuntamento ci sta.
 * Ogni voce: { ora, minuti, libero, durantePosa, appuntamentoInPosa, conflittoCon }
 */
async function orariLiberi(data, durata, { escludiId = null, servizi = null, includiOccupati = false } = {}) {
  const agenda = cfg.get('agenda');
  const passo = agenda.passoMinuti || 15;
  const giorno = dayKey(data);

  // Si propone solo dentro le fasce di apertura: la pausa pranzo e i giorni
  // chiusi non devono comparire fra gli orari liberi.
  const fasce = fasceDelGiorno(giorno);
  if (!fasce.length) return [];

  const esistenti = (await appuntamentiDelGiorno(data))
    .filter(a => a.id !== escludiId && a.stato !== 'annullato');
  const altrui = esistenti.map(a => ({
    app: a, lavoro: finestreLavoro(a), attesa: finestreAttesa(a)
  }));

  const oggi = dayKey(new Date()) === giorno;
  const adesso = new Date();
  const minutiOra = adesso.getHours() * 60 + adesso.getMinutes();

  const risultato = [];
  for (const fascia of fasce) {
    for (let t = fascia.da; t + Number(durata) <= fascia.a; t += passo) {
      if (oggi && t < minutiOra - passo) continue;

      const lavoroNuovo = finestreLavoro(
        appuntamentoIpotetico(`${giorno}T${hhmmDaMinuti(t)}`, durata, servizi)
      );

      const conflitto = altrui.find(x => inConflitto(lavoroNuovo, x.lavoro));
      const inPosa = !conflitto && altrui.find(x => inConflitto(lavoroNuovo, x.attesa));

      const voce = {
        ora: hhmmDaMinuti(t),
        minuti: t,
        libero: !conflitto,
        durantePosa: !!inPosa,
        appuntamentoInPosa: inPosa ? inPosa.app : null,
        conflittoCon: conflitto ? conflitto.app : null
      };
      if (voce.libero || includiOccupati) risultato.push(voce);
    }
  }
  return risultato.sort((a, b) => a.minuti - b.minuti);
}

async function primoOrarioUtile(data, durata, servizi = null) {
  const liberi = await orariLiberi(data, durata, { servizi });
  return liberi.find(s => s.libero && !s.durantePosa) || liberi[0] || null;
}

/* ---------- promemoria ---------- */

/** Appuntamenti di domani per cui va inviato il promemoria WhatsApp. */
async function promemoriaDaInviare(data = addDays(new Date(), 1)) {
  const appuntamenti = await appuntamentiDelGiorno(data);
  const adesso = isoLocale(new Date());
  const risultato = [];
  for (const a of appuntamenti) {
    if (a.stato === 'annullato' || a.promemoriaInviato) continue;
    if (a.inizio <= adesso) continue;   // avvisare per un appuntamento già passato non serve
    if (!a.clienteId) continue;        // fissata con il solo nome: non c'è un numero a cui scrivere
    const cliente = await leggiCliente(a.clienteId);
    if (!cliente || !cliente.promemoriaAttivo) continue;
    if (!cliente.telefono) continue;
    risultato.push({ appuntamento: a, cliente });
  }
  return risultato;
}

/* ---------- riepiloghi ---------- */

async function riepilogoGiorno(data) {
  const tutto = (await appuntamentiDelGiorno(data)).filter(a => a.stato !== 'annullato');
  // Gli impegni personali occupano tempo ma non sono clienti e non portano
  // incasso: contarli fra le clienti falserebbe la giornata.
  const impegni = tutto.filter(eImpegno);
  const appuntamenti = tutto.filter(a => !eImpegno(a));
  const conclusi = appuntamenti.filter(a => a.stato === 'concluso');
  return {
    totale: appuntamenti.length,
    impegni: impegni.length,
    conclusi: conclusi.length,
    incassato: conclusi.reduce((s, a) => s + (Number(a.prezzo) || 0), 0),
    previsto: appuntamenti.filter(a => a.stato !== 'assente')
                          .reduce((s, a) => s + (Number(a.prezzo) || 0), 0),
    minutiOccupati: appuntamenti.reduce((s, a) => s + Math.max(0, a.durata - (a.posaMinuti || 0)), 0),
    minutiImpegni: impegni.reduce((s, a) => s + (Number(a.durata) || 0), 0)
  };
}

/** Appuntamenti con il cliente già risolto: comodo per disegnare l'agenda. */
async function giornataCompleta(data) {
  const appuntamenti = await appuntamentiDelGiorno(data);
  const clienti = {};
  for (const a of appuntamenti) {
    if (!a.clienteId) continue;                       // fissata con il solo nome
    if (!clienti[a.clienteId]) clienti[a.clienteId] = await leggiCliente(a.clienteId);
  }
  return appuntamenti.map(a => ({
    ...a,
    cliente: a.clienteId ? (clienti[a.clienteId] || null) : null,
    nomeVisualizzato: nomeDiAppuntamento(a, a.clienteId ? clienti[a.clienteId] : null)
  }));
}

/* =========================================================================
   PREZZI E SERVIZI DI UNA SINGOLA CLIENTE
   Il colore di Rita non costa come il colore di listino. I prezzi suoi
   valgono sempre, anche scegliendo il servizio dal listino normale, e un
   aumento generale non li tocca.
   ========================================================================= */

/** Durata, prezzo e posa validi per questa cliente e questo servizio. */
function tariffaPerCliente(cliente, servizio) {
  const suo = cliente && cliente.prezzi ? cliente.prezzi[servizio.id] : null;
  if (!suo) {
    return {
      durata: servizio.durata, prezzo: servizio.prezzo,
      posaMinuti: servizio.posaMinuti || 0, personalizzato: false
    };
  }
  return {
    durata: suo.durata != null ? Number(suo.durata) : servizio.durata,
    prezzo: suo.prezzo != null ? Number(suo.prezzo) : servizio.prezzo,
    posaMinuti: suo.posaMinuti != null ? Number(suo.posaMinuti) : (servizio.posaMinuti || 0),
    personalizzato: true
  };
}

/** Il servizio con la tariffa della cliente già applicata. */
function servizioPerCliente(cliente, servizio) {
  const t = tariffaPerCliente(cliente, servizio);
  return { ...servizio, ...t };
}

/* ---------- il promemoria per la prossima volta ----------
   «Avanza 20 euro», «piega gratis». Sta sulla cliente e non sull'appuntamento:
   se quell'appuntamento salta, i 20 euro non si perdono con lui. Resta finché
   non viene segnato fatto. */

async function scriviNotaProssima(clienteId, testo) {
  const c = await leggiCliente(clienteId);
  if (!c) return null;
  const aggiornato = { ...c, notaProssima: (testo || '').trim(), modificatoIl: new Date().toISOString() };
  await db.salva('clienti', aggiornato);
  document.dispatchEvent(new CustomEvent('dati:cambiati', { detail: { tipo: 'cliente', id: clienteId } }));
  return aggiornato;
}

function notaProssimaDi(cliente) {
  return cliente && cliente.notaProssima ? cliente.notaProssima : '';
}

async function serviziAbitualiDi(cliente) {
  if (!cliente || !cliente.serviziAbituali || !cliente.serviziAbituali.length) return [];
  const tutti = await elencoServizi();
  return cliente.serviziAbituali
    .map(id => tutti.find(s => s.id === id))
    .filter(Boolean)
    .map(s => servizioPerCliente(cliente, s));
}

/**
 * I servizi da proporre a colpo sicuro quando si fissa un appuntamento.
 * Prima quelli scelti a mano dall'ingranaggio; se non ce ne sono — ed è il
 * caso di quasi tutte — quelli dell'ultima volta che è venuta. Prima questa
 * seconda strada non c'era: chi non aveva i "soliti" impostati non si vedeva
 * proporre niente, e ogni appuntamento andava ricomposto servizio per servizio.
 */
async function serviziProposti(cliente) {
  if (!cliente || !cliente.id) return null;

  const abituali = await serviziAbitualiDi(cliente);
  if (abituali.length) return { origine: 'abituali', servizi: abituali, quando: null };

  const storia = await storicoCliente(cliente.id);
  const ultima = storia.passati.find(a => a.stato !== 'assente' && (a.servizi || []).length);
  if (!ultima) return null;

  // Servizi di allora, prezzi e durate di oggi.
  const tutti = await elencoServizi();
  const servizi = (ultima.servizi || []).map(s => {
    const attuale = tutti.find(x => x.id === s.servizioId);
    return attuale
      ? servizioPerCliente(cliente, attuale)
      : { id: s.servizioId, nome: s.nome, durata: s.durata, prezzo: s.prezzo, posaMinuti: s.posaMinuti || 0 };
  }).filter(s => s.id);

  if (!servizi.length) return null;
  return { origine: 'ultima', servizi, quando: daIsoLocale(ultima.inizio) };
}

/** Salva le impostazioni che stanno dietro l'ingranaggio della scheda. */
async function salvaImpostazioniCliente(clienteId, modifiche) {
  const c = await leggiCliente(clienteId);
  if (!c) return null;
  const aggiornato = { ...c, ...modifiche, modificatoIl: new Date().toISOString() };
  await db.salva('clienti', aggiornato);
  document.dispatchEvent(new CustomEvent('dati:cambiati', { detail: { tipo: 'cliente', id: clienteId } }));
  return aggiornato;
}

/* =========================================================================
   APPUNTAMENTI FISSI
   "Giulia, ogni giovedì alle 15:00". L'app tiene coperti tre mesi in avanti
   e sposta l'orizzonte a ogni apertura: non finiscono mai.
   ========================================================================= */

const ORIZZONTE_GIORNI = 90;

function ricorrenzaVuota() {
  return {
    attiva: false,
    serieId: null,
    cadenzaGiorni: 7,
    ora: '09:00',
    serviziIds: [],
    dataInizio: null,
    saltate: [],          // occorrenze cancellate una per una: non si ricreano
    generatoFinoA: null
  };
}

/** La prima data utile con quel giorno della settimana, da oggi in avanti. */
function primaDataPerGiorno(giornoSettimana, da = new Date()) {
  const base = startOfDay(da);
  const avanti = (Number(giornoSettimana) - base.getDay() + 7) % 7;
  return dayKey(addDays(base, avanti));
}

/**
 * Genera le occorrenze mancanti fino all'orizzonte.
 * Non ricrea quelle cancellate a mano, e non duplica quelle già spostate:
 * ogni appuntamento ricorda la data che la serie gli aveva assegnato.
 * @returns { create, conflitti }
 */
async function generaOccorrenze(cliente, { orizzonteGiorni = ORIZZONTE_GIORNI } = {}) {
  const r = cliente && cliente.ricorrenza;
  if (!r || !r.attiva || !r.dataInizio || !r.cadenzaGiorni) return { create: 0, conflitti: [] };

  const serieId = r.serieId || uid('ser');
  const oggi = dayKey(new Date());
  const limite = dayKey(addDays(new Date(), orizzonteGiorni));

  const esistenti = await db.leggiPerIndice('appuntamenti', 'serieId', serieId);
  const giaFatte = new Set(esistenti.map(a => a.dataSerie).filter(Boolean));
  const saltate = new Set(r.saltate || []);

  const tuttiServizi = await elencoServizi();
  const servizi = (r.serviziIds || [])
    .map(id => tuttiServizi.find(s => s.id === id))
    .filter(Boolean)
    .map(s => {
      const t = tariffaPerCliente(cliente, s);
      return { servizioId: s.id, nome: s.nome, durata: t.durata, prezzo: t.prezzo, posaMinuti: t.posaMinuti };
    });

  let create = 0;
  const conflitti = [];
  let giorno = r.dataInizio;
  let giri = 0;

  const saltatePerChiusura = [];

  while (giorno <= limite && giri++ < 500) {
    // Un appuntamento fisso non si crea a saracinesca abbassata: si salta e si dice.
    if (giorno >= oggi && !giaFatte.has(giorno) && !saltate.has(giorno) && !giornoAperto(giorno)) {
      const c = chiusuraDi(giorno);
      saltatePerChiusura.push({ giorno, motivo: c ? (c.motivo || 'chiusura') : 'giorno di chiusura' });
      giorno = dayKey(addDays(fromDayKey(giorno), Number(r.cadenzaGiorni)));
      continue;
    }
    if (giorno >= oggi && !giaFatte.has(giorno) && !saltate.has(giorno)) {
      const inizio = `${giorno}T${r.ora}`;
      const durata = durataDaServizi(servizi) || cfg.get('agenda').durataPredefinita;

      // Le clienti fisse sono un punto fermo della settimana: l'appuntamento
      // si crea comunque, e la sovrapposizione viene segnalata.
      const c = await verificaConflitti(inizio, durata, { servizi });
      if (c.attivi.length) conflitti.push({ giorno, con: c.attivi });

      await salvaAppuntamento({
        clienteId: cliente.id,
        inizio, durata, servizi,
        serieId, dataSerie: giorno,
        silenzioso: true
      });
      create++;
    }
    giorno = dayKey(addDays(fromDayKey(giorno), Number(r.cadenzaGiorni)));
  }

  await salvaImpostazioniCliente(cliente.id, {
    ricorrenza: { ...r, serieId, generatoFinoA: limite }
  });

  if (create) document.dispatchEvent(new CustomEvent('dati:cambiati'));
  return { create, conflitti, saltatePerChiusura, serieId };
}

/** All'avvio dell'app: sposta in avanti l'orizzonte di tutte le serie attive. */
async function rigeneraTutteLeSerie() {
  const clienti = await elencoClienti();
  let totale = 0;
  const conflitti = [];
  const chiusure = [];
  for (const c of clienti) {
    if (!c.ricorrenza || !c.ricorrenza.attiva) continue;
    const esito = await generaOccorrenze(c);
    totale += esito.create;
    if (esito.conflitti.length) conflitti.push({ cliente: c, conflitti: esito.conflitti });
    if (esito.saltatePerChiusura && esito.saltatePerChiusura.length) {
      chiusure.push({ cliente: c, saltate: esito.saltatePerChiusura });
    }
  }
  return { create: totale, conflitti, chiusure };
}

async function occorrenzeSerie(serieId, { daGiorno = dayKey(new Date()) } = {}) {
  const tutte = await db.leggiPerIndice('appuntamenti', 'serieId', serieId);
  return tutte.filter(a => a.giorno >= daGiorno).sort((x, y) => x.inizio.localeCompare(y.inizio));
}

/** Cancella una sola occorrenza e la annota, così non viene ricreata. */
async function saltaOccorrenza(appuntamento) {
  if (appuntamento.serieId && appuntamento.clienteId) {
    const c = await leggiCliente(appuntamento.clienteId);
    if (c && c.ricorrenza) {
      const saltate = new Set(c.ricorrenza.saltate || []);
      if (appuntamento.dataSerie) saltate.add(appuntamento.dataSerie);
      await salvaImpostazioniCliente(c.id, {
        ricorrenza: { ...c.ricorrenza, saltate: [...saltate] }
      });
    }
  }
  await eliminaAppuntamento(appuntamento.id);
}

/** Ferma la serie: cancella le occorrenze future e spegne la ricorrenza. */
async function fermaSerie(appuntamento, { daGiorno = null } = {}) {
  const da = daGiorno || appuntamento.giorno;
  const future = await occorrenzeSerie(appuntamento.serieId, { daGiorno: da });
  for (const a of future) await db.elimina('appuntamenti', a.id);

  if (appuntamento.clienteId) {
    const c = await leggiCliente(appuntamento.clienteId);
    if (c && c.ricorrenza) {
      await salvaImpostazioniCliente(c.id, {
        ricorrenza: { ...c.ricorrenza, attiva: false }
      });
    }
  }
  document.dispatchEvent(new CustomEvent('dati:cambiati'));
  return future.length;
}

/** Sposta tutte le occorrenze future a un nuovo orario e/o cadenza. */
async function spostaSerie(appuntamento, { ora = null, cadenzaGiorni = null } = {}) {
  const future = await occorrenzeSerie(appuntamento.serieId, { daGiorno: appuntamento.giorno });
  if (ora) {
    for (const a of future) {
      await salvaAppuntamento({ ...a, inizio: `${a.giorno}T${ora}`, silenzioso: true });
    }
  }
  if (appuntamento.clienteId) {
    const c = await leggiCliente(appuntamento.clienteId);
    if (c && c.ricorrenza) {
      const r = { ...c.ricorrenza };
      if (ora) r.ora = ora;
      if (cadenzaGiorni) r.cadenzaGiorni = Number(cadenzaGiorni);
      await salvaImpostazioniCliente(c.id, { ricorrenza: r });
    }
  }
  document.dispatchEvent(new CustomEvent('dati:cambiati'));
  return future.length;
}

/* =========================================================================
   ORARI DEL NEGOZIO E CHIUSURE

   Finché la tabella settimanale non viene compilata, vale la vecchia fascia
   unica: aggiornare l'app non deve cambiare il comportamento sotto i piedi.
   ========================================================================= */

const NOMI_GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

/** Una settimana tipica, da proporre a chi non ha ancora compilato niente. */
function settimanaTipica(apertura = '09:00', chiusura = '19:00') {
  return [0,1,2,3,4,5,6].map(i => ({
    aperto: i !== 0 && i !== 1,               // domenica e lunedì chiusi
    apertura,
    chiusura,
    pausaDa: i === 6 ? '' : '12:30',          // il sabato di solito si tira dritto
    pausaA:  i === 6 ? '' : '14:30'
  }));
}

/* ---------- il titolo della giornata ----------
   Una riga sola per ogni data: «consegna colore», «Marta richiama».
   Vive in un archivio suo, aggiunto senza toccare gli altri. */

async function titoloDelGiorno(data) {
  const g = typeof data === 'string' ? data : dayKey(data);
  const riga = await db.leggi('giorni', g);
  return riga && riga.titolo ? riga.titolo : '';
}

/** Titoli di più giornate in un colpo solo: serve alla vista su più giorni. */
async function titoliDeiGiorni(chiavi) {
  const out = {};
  for (const g of chiavi) out[g] = await titoloDelGiorno(g);
  return out;
}

async function salvaTitoloDelGiorno(data, titolo) {
  const g = typeof data === 'string' ? data : dayKey(data);
  const pulito = (titolo || '').trim();
  // Svuotare il campo cancella la riga: l'archivio non si riempie di vuoti.
  if (!pulito) await db.elimina('giorni', g);
  else await db.salva('giorni', { giorno: g, titolo: pulito, modificatoIl: new Date().toISOString() });
  return pulito;
}

/**
 * L'apertura extra fissata su quel giorno, se c'è.
 * È la regola più specifica di tutte — riguarda un giorno solo — e per questo
 * vince su tutto il resto: sulle ferie e sulla tabella settimanale.
 * Serve per i prefestivi e per i giorni in più sotto le feste.
 */
function aperturaDi(data) {
  const g = typeof data === 'string' ? data : dayKey(data);
  for (const a of (cfg.get('agenda').aperture || [])) {
    if (a && a.giorno === g) return a;
  }
  return null;
}

/**
 * La chiusura straordinaria che copre quel giorno, se c'è.
 * Un'apertura extra su quel giorno la annulla: è la regola più specifica.
 */
function chiusuraDi(data) {
  const g = typeof data === 'string' ? data : dayKey(data);
  if (aperturaDi(g)) return null;
  for (const c of (cfg.get('agenda').chiusure || [])) {
    if (!c || !c.da) continue;
    if (g >= c.da && g <= (c.a || c.da)) return c;
  }
  return null;
}

/** La chiusura scritta nell'elenco, apertura extra o no: serve alle impostazioni. */
function chiusuraScrittaDi(data) {
  const g = typeof data === 'string' ? data : dayKey(data);
  for (const c of (cfg.get('agenda').chiusure || [])) {
    if (!c || !c.da) continue;
    if (g >= c.da && g <= (c.a || c.da)) return c;
  }
  return null;
}

/** Le fasce di una singola giornata descritta da orari propri. */
function fasceDaOrari(o) {
  if (!o) return [];
  const apertura = minutiDaHHMM(o.apertura);
  const chiusura = minutiDaHHMM(o.chiusura);
  if (!(chiusura > apertura)) return [];
  if (o.pausaDa && o.pausaA && minutiDaHHMM(o.pausaA) > minutiDaHHMM(o.pausaDa)) {
    return [
      { da: apertura, a: minutiDaHHMM(o.pausaDa) },
      { da: minutiDaHHMM(o.pausaA), a: chiusura }
    ].filter(f => f.a > f.da);
  }
  return [{ da: apertura, a: chiusura }];
}

/**
 * Le fasce di apertura di quel giorno, in minuti dalla mezzanotte.
 * Vuoto se il negozio è chiuso.
 */
function fasceDelGiorno(data) {
  const a = cfg.get('agenda');
  const g = typeof data === 'string' ? data : dayKey(data);

  // Prima di tutto il resto: un'apertura extra decide da sola quella giornata.
  const extra = aperturaDi(g);
  if (extra) return fasceDaOrari(extra);

  if (chiusuraDi(g)) return [];

  if (!Array.isArray(a.settimana) || a.settimana.length !== 7) {
    return [{ da: minutiDaHHMM(a.oraInizio), a: minutiDaHHMM(a.oraFine) }];
  }
  const giorno = a.settimana[fromDayKey(g).getDay()];
  if (!giorno || !giorno.aperto) return [];
  return fasceDaOrari(giorno);
}

function giornoAperto(data) { return fasceDelGiorno(data).length > 0; }

function orariConfigurati() {
  const s = cfg.get('agenda').settimana;
  return Array.isArray(s) && s.length === 7;
}

/** Gli estremi da disegnare in agenda: comodi, non vincolanti. */
function estremiGriglia() {
  const a = cfg.get('agenda');
  let da = minutiDaHHMM(a.oraInizio), fine = minutiDaHHMM(a.oraFine);
  if (Array.isArray(a.settimana) && a.settimana.length === 7) {
    const aperti = a.settimana.filter(g => g && g.aperto);
    if (aperti.length) {
      da = Math.min(...aperti.map(g => minutiDaHHMM(g.apertura)));
      fine = Math.max(...aperti.map(g => minutiDaHHMM(g.chiusura)));
    }
  }
  // Un prefestivo che apre prima o chiude più tardi non deve finire
  // fuori dalla griglia: la fascia disegnata li comprende tutti.
  for (const e of (a.aperture || [])) {
    if (!e || !e.apertura || !e.chiusura) continue;
    da = Math.min(da, minutiDaHHMM(e.apertura));
    fine = Math.max(fine, minutiDaHHMM(e.chiusura));
  }
  da = Math.max(0, da - 30);                  // mezz'ora di margine per gli sconfinamenti
  fine = Math.min(24 * 60, fine + 30);
  return { da, a: fine };
}

/**
 * L'appuntamento sta fuori dall'orario di apertura?
 * @returns null se va bene, altrimenti { motivo }
 */
function fuoriOrario(inizioIso, durata) {
  if (!cfg.get('agenda').avvisoFuoriOrario) return null;
  const giorno = inizioIso.slice(0, 10);
  const chiusura = chiusuraDi(giorno);
  if (chiusura) {
    return { motivo: chiusura.motivo ? `sei chiusa: ${chiusura.motivo}` : 'sei chiusa' };
  }
  const fasce = fasceDelGiorno(giorno);

MOD.ponte = (function () {
/* Charme — ponte verso il telefono
   ---------------------------------------------------------------------------
   Manda al server una copia dell'agenda, perché Claude possa consultarla dal
   telefono. Va in una direzione sola: da qui verso il server. Nulla di quello
   che sta sul server può modificare i dati del tablet.

   I riepiloghi (visite, incassi, classifiche) vengono calcolati QUI, dove i
   dati ci sono tutti e non ci sono limiti di tempo di calcolo: il server deve
   solo servirli.
   --------------------------------------------------------------------------- */

const db = MOD.db;
const store = MOD.store;
const cfg = MOD.cfgApp;
const { dayKey, addDays, nomeCompleto, normalizza, isoLocale, telefonoLeggibile, minutiDaHHMM } = MOD.util;

const GIORNI_STORICO = 550;   // ~18 mesi di appuntamenti passati nel pacchetto
const GIORNI_FUTURO  = 400;
const ATTESA_INVIO   = 8000;  // si aspetta che finisca di digitare prima di inviare

let temporizzatore = null;
let invioInCorso = false;
let daRinviare = false;

/* ---------- costruzione del pacchetto ---------- */

async function costruisciPacchetto() {
  const [clienti, appuntamenti, giorni] = await Promise.all([
    store.elencoClienti(),
    db.leggiTutti('appuntamenti'),
    db.leggiTutti('giorni')
  ]);

  const oggi = dayKey(new Date());
  const daGiorno = dayKey(addDays(new Date(), -GIORNI_STORICO));
  const aGiorno  = dayKey(addDays(new Date(), GIORNI_FUTURO));

  const perId = Object.fromEntries(clienti.map(c => [c.id, c]));

  /* --- agenda --- */
  const agenda = appuntamenti
    .filter(a => a.giorno >= daGiorno && a.giorno <= aGiorno)
    .sort((x, y) => x.inizio.localeCompare(y.inizio))
    .map(a => {
      const c = perId[a.clienteId];
      // I tratti si calcolano qui, dove non ci sono limiti di tempo: il server
      // deve solo leggerli. Sono anche il motivo per cui le risposte di Claude
      // sulla disponibilità restano giuste dopo la correzione della posa.
      const trattiAssoluti = store.tratti(a).map(t => ({
        t: t.tipo === 'attesa' ? 'a' : 'l',
        da: minutiDaHHMM(a.inizio.slice(11)) + t.da,
        a: minutiDaHHMM(a.inizio.slice(11)) + t.a
      }));

      const riga = {
        giorno: a.giorno,
        ora: a.inizio.slice(11),
        cliente: store.nomeDiAppuntamento(a, c),
        telefono: c && c.telefono ? telefonoLeggibile(c.telefono) : '',
        servizi: (a.servizi || []).map(s => s.nome),
        durata: a.durata,
        posa: a.posaMinuti || 0,
        prezzo: Number(a.prezzo) || 0,
        stato: a.stato,
        tratti: trattiAssoluti
      };
      // Gli impegni personali vanno segnalati per quello che sono: occupano
      // l'orario, ma non è una cliente e non c'è niente da incassare.
      if (store.eImpegno(a)) riga.impegno = true;
      else if (!a.clienteId) riga.senzaScheda = true;
      if (a.serieId) riga.fisso = true;
      if (a.note) riga.note = a.note;
      if (c && c.allergie) riga.allergie = c.allergie;
      if (c && c.notaProssima) riga.promemoria = c.notaProssima;
      return riga;
    });

  /* --- clienti, con i riepiloghi già calcolati --- */
  const perCliente = {};
  for (const a of appuntamenti) {
    if (!a.clienteId) continue;                 // fissate con il solo nome
    (perCliente[a.clienteId] ||= []).push(a);
  }

  const elencoClienti = clienti.map(c => {
    const suoi = perCliente[c.id] || [];
    const conclusi = suoi.filter(a => a.stato === 'concluso' ||
                                     (a.stato === 'previsto' && a.inizio < isoLocale(new Date())));
    const totale = conclusi.reduce((s, a) => s + (Number(a.prezzo) || 0), 0);
    const date = conclusi.map(a => a.giorno).sort();

    const conteggio = {};
    for (const a of conclusi) {
      for (const s of (a.servizi || [])) conteggio[s.nome] = (conteggio[s.nome] || 0) + 1;
    }

    const riga = {
      nome: nomeCompleto(c),
      telefono: c.telefono ? telefonoLeggibile(c.telefono) : '',
      visite: conclusi.length,
      totale: Math.round(totale * 100) / 100,
      media: conclusi.length ? Math.round((totale / conclusi.length) * 100) / 100 : 0,
      ultima: date.length ? date[date.length - 1] : null,
      promemoria: !!c.promemoriaAttivo,
      serviziAbituali: Object.entries(conteggio).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0])
    };
    if (c.ricorrenza && c.ricorrenza.attiva) {
      riga.appuntamentoFisso = { ogniGiorni: c.ricorrenza.cadenzaGiorni, ora: c.ricorrenza.ora };
    }
    if (c.allergie) riga.allergie = c.allergie;
    if (c.note) riga.note = c.note;
    return riga;
  });

  /* --- statistiche --- */
  const perMese = {};
  const perServizio = {};
  const limiteServizi = dayKey(addDays(new Date(), -365));

  for (const a of appuntamenti) {
    if (a.stato !== 'concluso') continue;
    const mese = a.giorno.slice(0, 7);
    perMese[mese] ||= { incasso: 0, appuntamenti: 0 };
    perMese[mese].incasso += Number(a.prezzo) || 0;
    perMese[mese].appuntamenti++;

    if (a.giorno >= limiteServizi) {
      for (const s of (a.servizi || [])) {
        perServizio[s.nome] ||= { nome: s.nome, volte: 0, incasso: 0 };
        perServizio[s.nome].volte++;
        perServizio[s.nome].incasso += Number(s.prezzo) || 0;
      }
    }
  }
  for (const m of Object.values(perMese)) m.incasso = Math.round(m.incasso * 100) / 100;

  const agendaCfg = cfg.get('agenda');
  return {
    formato: 'charme-ponte',
    versione: 1,
    negozio: cfg.get('negozio').nome,
    oraInizio: agendaCfg.oraInizio,
    oraFine: agendaCfg.oraFine,
    // Senza questi Claude proporrebbe orari a saracinesca abbassata.
    settimana: agendaCfg.settimana || null,
    chiusure: agendaCfg.chiusure || [],
    // Le aperture extra vincono su tutto: il telefono deve saperlo anche lui.
    aperture: agendaCfg.aperture || [],
    // I promemoria scritti in cima alle giornate: solo quelli del periodo utile.
    titoliGiorni: Object.fromEntries((giorni || [])
      .filter(g => g && g.titolo && g.giorno >= daGiorno && g.giorno <= aGiorno)
      .map(g => [g.giorno, g.titolo])),
    periodo: { da: daGiorno, a: aGiorno },
    agenda,
    clienti: elencoClienti,
    statistiche: {
      perMese,
      servizi: Object.values(perServizio).map(s => ({ ...s, incasso: Math.round(s.incasso) })),
      mesiConsiderati: 12
    }
  };
}

/* ---------- invio ---------- */

function indirizzoSync() {
  const p = cfg.get('ponte');
  if (!p.attivo || !p.indirizzo || !p.chiaveScrittura) return null;
  const base = p.indirizzo.trim().replace(/\/+$/, '');
  if (!/^https?:\/\//.test(base)) return null;
  return `${base}/${p.chiaveScrittura.trim()}/sync`;
}

function configurato() { return !!indirizzoSync(); }

function indirizzoConsultazione() {
  const p = cfg.get('ponte');
  if (!p.indirizzo || !p.chiaveLettura) return null;
  return `${p.indirizzo.trim().replace(/\/+$/, '')}/${p.chiaveLettura.trim()}/agenda`;
}

function indirizzoConnettore() {
  const p = cfg.get('ponte');
  if (!p.indirizzo || !p.chiaveLettura) return null;
  return `${p.indirizzo.trim().replace(/\/+$/, '')}/${p.chiaveLettura.trim()}/mcp`;
}

/**
 * Invia adesso. Restituisce { ok, messaggio, dettagli }.
 * Non solleva mai eccezioni: un ponte che non risponde non deve disturbare
 * chi sta lavorando in negozio.
 */
async function sincronizza({ manuale = false } = {}) {
  const url = indirizzoSync();
  if (!url) return { ok: false, messaggio: 'Ponte non configurato' };

  if (invioInCorso) { daRinviare = true; return { ok: true, messaggio: 'invio già in corso' }; }
  invioInCorso = true;

  try {
    const pacchetto = await costruisciPacchetto();
    const controllore = new AbortController();
    const scadenza = setTimeout(() => controllore.abort(), 20000);

    const risposta = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pacchetto),
      signal: controllore.signal,
      cache: 'no-store'
    });
    clearTimeout(scadenza);

    if (!risposta.ok) {
      const testo = await risposta.text().catch(() => '');
      throw new Error(`il server ha risposto ${risposta.status}${testo ? ' — ' + testo.slice(0, 120) : ''}`);
    }
    const esito = await risposta.json();

    await cfg.imposta('ponte', {
      ultimaSincronizzazione: new Date().toISOString(),
      ultimoErrore: null,
      inSospeso: false,
      ultimoConteggio: esito.ricevuti || null
    });
    document.dispatchEvent(new CustomEvent('ponte:cambiato'));

    // Una volta al giorno, appesa a una sincronizzazione riuscita, parte anche
    // la copia di sicurezza completa. Non blocca né disturba se fallisce.
    inviaBackupGiornaliero().catch(() => {});

    return { ok: true, messaggio: 'Agenda inviata', dettagli: esito.ricevuti };

  } catch (e) {
    const motivo = e.name === 'AbortError'
      ? 'il server non ha risposto in tempo'
      : (e.message || 'errore di rete');
    await cfg.imposta('ponte', { ultimoErrore: motivo, inSospeso: true });
    document.dispatchEvent(new CustomEvent('ponte:cambiato'));
    return { ok: false, messaggio: motivo };

  } finally {
    invioInCorso = false;
    if (daRinviare) { daRinviare = false; programma(1500); }
  }
}

/** Prova la connessione senza inviare tutto l'archivio. */
async function prova() {
  const url = indirizzoSync();
  if (!url) return { ok: false, messaggio: 'Indirizzo o chiave mancanti' };
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ formato: 'charme-ponte', versione: 1, agenda: [], clienti: [], statistiche: {} }),
      cache: 'no-store'
    });
    if (r.status === 404) return { ok: false, messaggio: 'Indirizzo o chiave di scrittura errati (il server risponde "non trovato")' };
    if (!r.ok) return { ok: false, messaggio: `Il server ha risposto ${r.status}` };
    return { ok: true, messaggio: 'Il ponte risponde. Ora invio l\'agenda vera.' };
  } catch (e) {
    return { ok: false, messaggio: 'Non raggiungibile: ' + (e.message || 'errore di rete') };
  }
}

/* ---------- automatismo ---------- */

function programma(attesa = ATTESA_INVIO) {
  if (!configurato()) return;
  clearTimeout(temporizzatore);
  temporizzatore = setTimeout(() => sincronizza(), attesa);
}

function avvia() {
  // a ogni modifica dei dati, con un po' di calma per non inviare a ogni tasto
  document.addEventListener('dati:cambiati', () => programma());
  document.addEventListener('impostazioni:cambiate', (e) => {
    if (e.detail && e.detail.sezione === 'ponte') programma(2000);
  });

  // quando torna la rete, si recupera quello che era rimasto in sospeso
  window.addEventListener('online', () => {
    if (cfg.get('ponte').inSospeso) programma(2500);
  });

  // riapertura dell'app e controllo periodico di sicurezza
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cfg.get('ponte').inSospeso) programma(3000);
  });
  setInterval(() => { if (cfg.get('ponte').inSospeso) sincronizza(); }, 15 * 60 * 1000);

  if (configurato()) programma(4000);
  avviaControlloProposte();
}

/** Da quante ore il ponte non riceve dati (null se mai sincronizzato o spento). */
function oreDaUltimaSincronizzazione() {
  const p = cfg.get('ponte');
  if (!p.attivo || !p.ultimaSincronizzazione) return null;
  return (Date.now() - Date.parse(p.ultimaSincronizzazione)) / 3600000;
}

/* =========================================================================
   BACKUP AUTOMATICO SUL SERVER

   Il canale della sincronizzazione porta il riassunto per Claude. Questo
   porta il database vero e proprio: è quello che serve per ricostruire tutto
   su un tablet nuovo. Una copia al giorno, non una a ogni modifica.
   ========================================================================= */

function indirizzoBackup(coda = '') {
  const p = cfg.get('ponte');
  if (!p.indirizzo || !p.chiaveScrittura) return null;
  const base = p.indirizzo.trim().replace(/\/+$/, '');
  if (!/^https?:\/\//.test(base)) return null;
  return `${base}/${p.chiaveScrittura.trim()}/backup${coda}`;
}

/** Manda la copia di oggi, se non è già stata mandata. */
async function inviaBackupGiornaliero({ forza = false } = {}) {
  const p = cfg.get('ponte');
  if (!p.attivo || !p.backupSuServer) return { ok: false, messaggio: 'backup sul server spento' };
  const url = indirizzoBackup();
  if (!url) return { ok: false, messaggio: 'ponte non configurato' };

  const oggi = dayKey(new Date());
  if (!forza && p.ultimoBackupServer === oggi) {
    return { ok: true, messaggio: 'copia di oggi già inviata', saltato: true };
  }

  try {
    const pacchetto = await db.esporta({ includiFoto: false });
    const risposta = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pacchetto),
      cache: 'no-store'
    });
    if (!risposta.ok) throw new Error(`il server ha risposto ${risposta.status}`);
    const esito = await risposta.json();
    await cfg.imposta('ponte', { ultimoBackupServer: oggi });
    document.dispatchEvent(new CustomEvent('ponte:cambiato'));
    return { ok: true, messaggio: 'Copia di sicurezza inviata', byte: esito.byte };
  } catch (e) {
    return { ok: false, messaggio: e.message || 'errore di rete' };
  }
}

/** Le copie disponibili sul server, dalla più recente. */
async function copieSulServer() {
  const url = indirizzoBackup();
  if (!url) return { ok: false, messaggio: 'ponte non configurato', copie: [] };
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`il server ha risposto ${r.status}`);
    return await r.json();
  } catch (e) {
    return { ok: false, messaggio: e.message || 'errore di rete', copie: [] };
  }
}

async function scaricaCopia(giorno) {
  const url = indirizzoBackup('/' + giorno);
  if (!url) throw new Error('ponte non configurato');
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`copia non trovata (${r.status})`);
  return r.json();
}

async function svuotaCopieSulServer() {
  const url = indirizzoBackup('/svuota');
  if (!url) return { ok: false };
  const r = await fetch(url, { method: 'POST', cache: 'no-store' });
  return r.json();
}

/* =========================================================================
   PROPOSTE DA CLAUDE

   Il tablet va a vedere se ce ne sono: non c'è modo di farsi chiamare.
   Controlla all'apertura dell'app e ogni pochi minuti mentre è accesa.
   ========================================================================= */

const OGNI_QUANTO_CONTROLLO = 5 * 60 * 1000;
let proposteInMemoria = [];

function indirizzoProposte(coda = '') {
  const p = cfg.get('ponte');
  if (!p.attivo || !p.indirizzo || !p.chiaveScrittura) return null;
  const base = p.indirizzo.trim().replace(/\/+$/, '');
  if (!/^https?:\/\//.test(base)) return null;
  return `${base}/${p.chiaveScrittura.trim()}/proposte${coda}`;
}

function proposte() { return proposteInMemoria; }

async function controllaProposte() {
  const url = indirizzoProposte();
  if (!url) return [];
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return proposteInMemoria;
    const esito = await r.json();
    const nuove = Array.isArray(esito.proposte) ? esito.proposte : [];
    const cambiate = nuove.length !== proposteInMemoria.length ||
      nuove.some((p, i) => !proposteInMemoria[i] || proposteInMemoria[i].id !== p.id);
    proposteInMemoria = nuove;
    await cfg.imposta('ponte', { ultimoControlloProposte: new Date().toISOString() });
    if (cambiate) document.dispatchEvent(new CustomEvent('proposte:cambiate', { detail: { quante: nuove.length } }));
    return nuove;
  } catch {
    return proposteInMemoria;
  }
}

/** Toglie la proposta dal server: gestita, in un senso o nell'altro. */
async function chiudiProposta(id, esito) {
  const url = indirizzoProposte('/' + id);
  if (!url) return false;
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ esito })
    });
  } catch { /* se non si riesce a toglierla, ricomparirà: meglio che perderla */ }
  proposteInMemoria = proposteInMemoria.filter(p => p.id !== id);
  document.dispatchEvent(new CustomEvent('proposte:cambiate', { detail: { quante: proposteInMemoria.length } }));
  return true;
}

function avviaControlloProposte() {
  const giro = () => { if (configurato()) controllaProposte(); };
  setTimeout(giro, 6000);
  setInterval(giro, OGNI_QUANTO_CONTROLLO);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) giro(); });
  window.addEventListener('online', giro);
}

return { avvia, avviaControlloProposte, chiudiProposta, configurato, controllaProposte, copieSulServer, costruisciPacchetto, indirizzoConnettore, indirizzoConsultazione, inviaBackupGiornaliero, oreDaUltimaSincronizzazione, proposte, prova, scaricaCopia, sincronizza, svuotaCopieSulServer };
})();

MOD.vAgenda = (function () {

let dataCorrente = new Date();
let apriNuovo = null;      // iniettata da app.js per evitare dipendenze circolari

/** Sta scrivendo in una casella che un ridisegno le porterebbe via? */

/**

function aggiornaOraAdesso() {
  clearTimeout(temporizzatoreAdesso);

  // A mezzanotte «oggi» cambia davvero: lì il ridisegno serve.
  if (giornoDisegnato && giornoDisegnato !== dayKey(new Date())) { disegna(); return; }

  if (m < griglia.da || m > griglia.a) { riga.hidden = true; return; }
  riga.hidden = false;
  riga.style.top = `${(m - griglia.da) * ppm}px`;
